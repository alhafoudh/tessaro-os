# The development broker of `mise run mqtt:run` and the e2e suite's mqtt
# lane (test/mqtt/broker.rb starts it). One listener of each kind a device
# can use: plain and TLS, MQTT and MQTT over WebSocket. The plain ones take
# anyone, so a device needs nothing but mqtt.url; the TLS ones want the user
# broker.rb sets up, as a broker that matters would. Certificates are the
# dev CA's, in build/mqtt/.

per_listener_settings true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
allow_anonymous true

listener 8883
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/passwd

listener 9001
protocol websockets
allow_anonymous true

listener 9443
protocol websockets
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/passwd
