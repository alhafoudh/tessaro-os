# Everything about a Tessaro image that does not depend on the machine.
#
# Every fragment in kas/machine/ includes this file, so the pins and the kiosk
# stack are defined exactly once (distro is the exception - see the bottom of
# this file). A build is always this file plus one machine fragment:
#
#   kas-container build kas/machine/<machine>.yml:kas/common/debug.yml
#
# which is what the mise tasks assemble from TESSARO_MACHINE.
header:
  version: 16
  includes:
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-distro.yml
    # Kiosk stack: Weston (the graphics fragment also turns on the wayland,
    # opengl and polkit DISTRO_FEATURES) and Chromium. The meta-chromium
    # fragment is also what brings the Rust toolchain in, which tessaro-agent
    # is built with - see the pin comment there.
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-graphics.yml
    - kas/repo/meta-chromium.yml

local_conf_header:
  # Key names are merged across the whole config chain, so anything set here
  # would be replaced wholesale by a fragment reusing the name. Machine
  # fragments use 25_tessaro-machine, upstream Moonforge uses
  # 10_/20_meta-moonforge-*; this one is ours alone.
  20_tessaro-common: |
    # The kiosk needs room on /data: the /etc overlay, /home/weston (the
    # volatile-binds bbappend in meta-tessaro-distro maps it to
    # /data/overlay-home) and the Chromium profile with its caches all live on
    # this partition. The profile is what dominates.
    #
    # This is only the size the image is written with, and it is kept small
    # so the image fits the smallest disk a target ships on (an 8 GB eMMC, next
    # to the fixed root and ESP). The rest of the disk goes to /data on the
    # device with `tessaro-ctl storage grow` (docs/updates.md, "Storage"). An
    # ungrown 1 GB still holds the profile, its 200 MB disk cache and an
    # update's upload, but not much more: grow it on any disk that has room.
    # Changing this does not change the layout updates check, which covers
    # the boot and root partitions only.
    IMAGE_DATA_MIN_SIZE = "1024M"
    # Find /data by filesystem label rather than by device node, so one image
    # boots off SATA, USB, NVMe and SD without a rebuild. Every wks in use
    # labels that partition "data" (wic passes it to mkfs.ext4 -L), and the
    # preinit that mounts it is util-linux mount with libblkid behind it, on a
    # kernel with CONFIG_DEVTMPFS_MOUNT=y - so /dev is populated before /sbin/init
    # runs and blkid can resolve the label.
    #
    # Only the "data" on the disk / is on counts: a second disk with that
    # label (the USB stick the device was flashed from, left plugged in)
    # would otherwise win whenever blkid finds it first. The preinit pastes
    # this value into its mount command line, so it is a command
    # substitution: tessaro-disk-part (recipes-core/tessaro-disk) looks the
    # label up on the root's disk, and a device whose root disk has no such
    # partition falls back to any disk's.
    #
    # A machine fragment can still override this with a plain path if a board
    # needs it.
    OVERLAYFS_ETC_DEVICE = "$(/usr/libexec/tessaro/tessaro-disk-part data || echo LABEL=data)"
    # In-place image updates (tessaro-ctl update), without A/B partitions:
    # the device stages the new image on /data, and at the next boot an
    # initramfs rewrites the root partition before anything mounts it.
    #
    # The root partition's size is part of the disk layout, so it is fixed
    # here instead of following each build's rootfs: a later image has to fit
    # into the partition already on the disk, and wic fails the build when one
    # does not. The image is ~900M today; 4096M leaves room for years of
    # Chromium growth, because every change here costs a reflash. The ESP has
    # room for two kernels (~21M each on x86), which is what the updater needs
    # while it swaps them, with the same margin. Changing either is a new disk
    # layout - devices need one full reflash to take updates again.
    TESSARO_ROOTFS_SIZE = "4096M"
    TESSARO_ESP_SIZE = "256M"
    # The initramfs lives inside the kernel, so the kernel on the boot
    # partition stays one file - the one the updater swaps - and bootimg-efi
    # picks the bundled image up without any change to its config. The cost
    # is that the kernel is re-bundled (not rebuilt) whenever the initramfs,
    # tessaro-flash included, changes.
    INITRAMFS_IMAGE = "tessaro-initramfs"
    INITRAMFS_IMAGE_BUNDLE = "1"

repos:
  # Upstream layer collection. Pinned here; kas clones and checks it out.
  # Bumping Moonforge is this one commit hash.
  meta-moonforge:
    url: https://github.com/moonforgelinux/meta-moonforge.git
    commit: 7c2fe20810b8878a2d466bacb6de799149f968f4
    branch: main
  # meta-networking carries NetworkManager, which is how a field technician
  # reconfigures the network (nmtui on tty1 or over SSH, nmcli for scripting).
  # The repo itself is already pinned and cloned by meta-moonforge's
  # kas/include/repo/meta-openembedded.yml, so only the layers are turned on
  # here. kas merges repos.<name>.layers additively across the whole chain, so
  # this adds to - rather than replaces - what the graphics fragment enables
  # (meta-oe).
  #
  # meta-python is not optional and not ours to want: it is named in
  # LAYERDEPENDS_networking-layer ("core meta-python openembedded-layer"), so
  # dropping it fails the parse outright. It used to arrive with the Moonforge
  # podman fragment, which this image no longer includes, so it has to be
  # spelled out here now. Check with:
  #   kas-container dump kas/machine/<machine>.yml:kas/common/debug.yml
  #
  # meta-webserver carries nginx, which serves the self-test page on the
  # loopback. A file:// page would need no server at all, but it would also
  # have a null origin, and Chromium's device-permission policies match on
  # origin - so the page could not be granted a serial port or a HID device
  # without a chooser dialog nobody is there to click. One static directory
  # over http is the cost of making those grants possible. Its collection name
  # is "webserver" and it depends on openembedded-layer, which the graphics
  # fragment already enables.
  #
  # meta-multimedia carries PipeWire and WirePlumber, the kiosk's sound
  # server (meta-tessaro-distro/recipes-multimedia/tessaro-audio). Its
  # collection name is "multimedia-layer" and it depends on meta-oe and
  # meta-python, both enabled already. It has no bbappends, and none of its
  # recipes replace one Chromium builds against - so enabling it does not
  # rebuild Chromium. Check before a full build:
  #   bitbake -n moonforge-image-base | grep -i chromium
  meta-openembedded:
    layers:
      meta-networking:
      meta-python:
      meta-webserver:
      meta-multimedia:
  # No url: this is the repo holding this file, which kas never touches.
  tessaro-os:
    layers:
      meta-tessaro-distro:

# distro deliberately lives in the machine fragments, not here. kas resolves a
# plain key like distro by include order, and a file's own value beats the ones
# its includes set - so the *entry point* of the chain has to be the file that
# says "tessaro". Setting it here instead is silently undone: every machine
# fragment also includes a meta-moonforge-*.yml layer fragment that pulls in
# meta-moonforge-distro.yml, and that one comes later and says "moonforge".
# The symptom is a whole image built with DISTRO = "moonforge": no tessaro
# hostname, no kiosk PACKAGECONFIG, and DISTROOVERRIDES flipped.
