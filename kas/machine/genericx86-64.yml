# genericx86-64: x86_64 machines that boot through UEFI - real hardware (PCs,
# mini PCs, thin clients) and QEMU, where the mise run qemu:* tasks and the
# e2e suite boot this same image through runqemu, with the OVMF image:build
# builds next to it. The e2e suite tests the image that ships.
#
# The machine comes from meta-yocto-bsp, not meta-intel - the generic x86
# machines moved out of meta-intel years ago. It keeps linux-yocto, so
# PREFERRED_VERSION_linux-yocto = "6.6%" from moonforge.conf still applies, and
# it works on AMD hardware as well; meta-intel's machines would switch the
# kernel to linux-intel and pull in the Intel media stack.
header:
  version: 16
  includes:
    - kas/common/tessaro.yml
    - kas/repo/meta-yocto.yml
    - kas/repo/meta-intel.yml

local_conf_header:
  25_tessaro-machine: |
    # meta-yocto-bsp's own genericx86.wks.in has no /data partition, which
    # overlayfs-etc needs, so the image uses ours - ESP, rootfs, /data, with
    # the loader taken from EFI_PROVIDER and the identifiers pinned for
    # in-place updates (see the wks).
    WKS_FILE = "tessaro-image-base-genericx86-64.wks.in"
    # No OVERLAYFS_ETC_DEVICE here on purpose: this is the target where the
    # disk name is least predictable (SATA and USB are /dev/sda*, NVMe is
    # /dev/nvme0n1p*, eMMC is /dev/mmcblk0p*), which is exactly why
    # kas/common/tessaro.yml mounts /data by label instead.
    # WiFi drivers and firmware need nothing added here: packaging is
    # handled by the BSP, and the drivers themselves by a kernel fragment.
    #
    # meta-yocto-bsp's genericx86-common.inc already carries
    #   MACHINE_EXTRA_RRECOMMENDS += "kernel-modules linux-firmware"
    # kernel-modules installs every module linux-yocto built. linux-yocto's
    # own config builds only the old wifi drivers, though (ath5k/ath9k, brcm,
    # mt7601u, rt2x00), so iwlwifi, ath10k/11k/12k, mt76, rtw88/rtw89 and the
    # rest are turned on as modules by
    # meta-tessaro-distro/recipes-kernel/linux/files/tessaro-x86-wireless.cfg.
    #
    # linux-firmware is complete, even though oe-core splits the recipe
    # into a few hundred packages: populate_packages:prepend in
    # linux-firmware_*.bb makes the base package RRECOMMENDS every split one,
    # so iwlwifi-8265, ath10k and the rest come in with it, and the newer
    # Intel blobs (AX200, AX210, BE200) through ${PN}-iwlwifi-misc. Confirmed
    # on a built rootfs: /usr/lib/firmware holds every wifi vendor's blobs.
    #
    # The size is the cost: a few hundred MB, almost all of it GPU, Mellanox
    # and modem blobs a kiosk never touches. Once the hardware is fixed:
    #   BAD_RECOMMENDATIONS += "linux-firmware"
    # plus the split packages the board needs.
    #
    # Hardware video decode (docs/kiosk-browser.md, "Hardware video decode").
    # Chromium decodes through VA-API here, and libva picks the driver for
    # the GPU it finds at runtime, so one image carries a driver for each:
    # intel-media-driver (iHD, from meta-intel) for Intel GPUs from Broadwell
    # on; intel-vaapi-driver (i965, also meta-intel) for the older ones and for
    # Braswell/Cherry Trail Atoms, which iHD does not support - the Dell Wyse
    # 3040's Atom x5-Z8350 among them; and Mesa's radeonsi VA driver for AMD,
    # which comes in with mesa-megadriver (tessaro.conf).
    MACHINE_EXTRA_RRECOMMENDS += "libva intel-media-driver intel-vaapi-driver"
    #
    # What the e2e suite and the qemu:* tasks use in the guest. Their kernel
    # modules (USB/IP's client, uvcvideo, vivid's emulated CEC bus, the HDA
    # and USB sound cards) come with kernel-modules above, built by
    # tessaro-qemu-usbip.cfg, tessaro-qemu-cec.cfg and tessaro-x86-audio.cfg.
    # Nothing loads them unless asked to: no daemon, no listening port.
    # usbip attaches the test camera and scanner the host serves over USB/IP
    # (test/usbcam/usbcam.rb, test/usbscanner/usbscanner.rb); v4l-utils has
    # v4l2-ctl to read a virtual camera as a second reader - with mmap, since
    # v4l2loopback gives read() to one reader only - and cec-ctl and
    # cec-follower for the CEC lane (docs/camera.md and docs/cec.md, Testing
    # in qemu).
    MACHINE_EXTRA_RRECOMMENDS += "usbip-tools v4l-utils"
  30_tessaro-qemu-kiosk: |
    # Everything below shapes how runqemu boots the image - the
    # qemuboot.conf it reads and the host's own QEMU - and nothing that goes
    # into the image itself. genericx86-common.inc already writes a
    # qemuboot.conf (qemuboot-x86.inc: q35, IvyBridge, a USB keyboard and
    # tablet).
    #
    # runqemu defaults to 256M, which Chromium plus Weston will not survive.
    # 4G rather than the 2G cog needed: Chromium's process model is the whole
    # difference - a renderer, a GPU process and a zygote per tab, on top of
    # Weston.
    QB_MEM = "-m 4096"
    # Suppress QEMU's default std VGA. The display device itself comes from
    # runqemu's "egl-headless" option, which adds -device virtio-vga-gl and
    # -display egl-headless; adding one here as well would give Weston two
    # cards to choose between. QB_GRAPHICS is always appended by runqemu.
    #
    # virtio-vga-gl means virgl, which needs a real GPU on the *host* (a
    # render node at /dev/dri). Weston can limp along on Mesa's kms_swrast
    # because it holds DRM master, but the unprivileged renderer processes
    # cannot allocate dumb buffers, so the kiosk renders nothing at all
    # without host GPU passthrough.
    QB_GRAPHICS = "-vga none"
    # runqemu's own slirp forwards (ssh on 2222, telnet on 2323) plus the
    # tessaro-ctl TLS port on 7401, so `tessaro-ctl -n 127.0.0.1:7401` and
    # `tessaro-ctl -n 127.0.0.1:7401 ssh connect --port 2222` reach the VM from
    # the host. 7401, not 7400: dev:tunnel holds the build host's 7400 for the
    # device on the desk. All on the loopback. They only reach the host
    # because the run tasks start the kas container with --network=host;
    # runqemu shifts a port up by itself if it is taken, and says so in its
    # "Port forward:" line. The e2e suite rewrites these forwards per worker
    # (test/e2e/spec/support/vm.rb), so keep them in this form.
    QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:2323-:23,hostfwd=tcp:127.0.0.1:7401-:7400,tftp=${DEPLOY_DIR_IMAGE}"
    # A temperature sensor for the VM: an empty emulated NVMe drive, whose
    # controller reports a fixed 323 K under a 343 K warning threshold to the
    # guest's hwmon (docs/hardware.md, Temperatures). Every qemu:run, qemu:vnc
    # and e2e boot gets it from here. null-co needs no backing file: it reads
    # zeros and drops writes. The drive is nvme0n1, so it never takes the root
    # disk's name. An :append, because x86/qemuboot-x86.inc sets
    # QB_OPT_APPEND after local.conf.
    QB_OPT_APPEND:append = " -blockdev driver=null-co,node-name=sensor,size=67108864,read-zeroes=on -device nvme,serial=tessaro-sensor,drive=sensor"
    # qemu:vnc puts a password on the display, and VNC's password auth is
    # DES, which QEMU takes from a crypto library it is built without by
    # default ("Cipher backend does not support DES algorithm"). Only the
    # host's QEMU changes; the image does not.
    PACKAGECONFIG:append:pn-qemu-system-native = " nettle"

# Both keys belong in the entry point of the config chain: an include cannot
# set them, because meta-moonforge-distro.yml sets distro too and wins by
# order. See the note in kas/common/tessaro.yml.
distro: tessaro
machine: genericx86-64
