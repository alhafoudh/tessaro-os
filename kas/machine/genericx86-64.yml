# genericx86-64: real x86_64 hardware (UEFI PCs, mini PCs, thin clients).
#
# The machine comes from meta-yocto-bsp, not meta-intel - the generic x86
# machines moved out of meta-intel years ago. It keeps linux-yocto, so
# PREFERRED_VERSION_linux-yocto = "6.6%" from moonforge.conf still applies, and
# it works on AMD hardware as well; meta-intel's machines would switch the
# kernel to linux-intel and pull in the Intel media stack.
header:
  version: 16
  includes:
    - kas/common/tessaro.yml
    - kas/repo/meta-yocto.yml

local_conf_header:
  25_tessaro-machine: |
    # meta-yocto-bsp's own genericx86.wks.in has no /data partition, which
    # overlayfs-etc needs, so the image uses ours - it is the Moonforge
    # qemux86-64 layout (ESP, rootfs, /data, swap) with the loader taken from
    # EFI_PROVIDER instead of being hardcoded to grub-efi.
    WKS_FILE = "tessaro-image-base-genericx86-64.wks.in"
    # No OVERLAYFS_ETC_DEVICE here on purpose: this is the target where the
    # disk name is least predictable (SATA and USB are /dev/sda*, NVMe is
    # /dev/nvme0n1p*, eMMC is /dev/mmcblk0p*), which is exactly why
    # kas/common/tessaro.yml mounts /data by label instead.
    OVERLAYFS_ETC_DEVICE = "/dev/sda3"
    # WiFi drivers need nothing added here; firmware is only mostly covered.
    #
    # meta-yocto-bsp's genericx86-common.inc already carries
    #   MACHINE_EXTRA_RRECOMMENDS += "kernel-modules linux-firmware"
    # kernel-modules installs every module linux-yocto built, which includes
    # the whole wireless stack (cfg80211, mac80211, iwlwifi, ath*, rtw*,
    # brcmfmac, mt76). That side is genuinely complete - 39MB for 683 modules,
    # of which the wifi ones are 7.3MB.
    #
    # linux-firmware is the part to be careful about, and "the whole thing" is
    # not what gets installed. oe-core splits the recipe into 138 packages and
    # the base package is only the catch-all:
    #   FILES:${PN} += "${nonarch_base_libdir}/firmware/*"
    # so whatever a split package claims is NOT in it and is NOT pulled in by
    # anything. For wifi that boundary runs straight through Intel: the
    # ${PN}-iwlwifi-* packages claim 135, 3160, 6000, 6050, 7260, 7265, 8000C,
    # 8265, 9000 and 9260, while the newer cc/so/ty/gl/ma blobs (AX200, AX210,
    # BE200) match no split and so land in the catch-all. Same story for
    # ath10k and ath11k, which are split out; ath12k is not, because the base
    # package RDEPENDS on it explicitly.
    #
    # Net effect: a modern Intel or Atheros card works out of the box, an
    # Intel 8265 or 9260 or an ath10k card - very common in the mini PCs and
    # thin clients this target is for - comes up with the driver bound and no
    # firmware, which presents as a NIC that never appears in nmtui. Check
    # `dmesg | grep -i firmware` on the first real board and add what it asks
    # for, e.g.:
    #   MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-iwlwifi-8265"
    #
    # Going the other way, once the hardware is fixed, is where the size is:
    # the catch-all is a few hundred MB and almost all of it is GPU, Mellanox
    # and modem blobs a kiosk never touches.
    #   BAD_RECOMMENDATIONS += "linux-firmware"
    # plus the one or two split packages the board needs.

# Both keys belong in the entry point of the config chain: an include cannot
# set them, because meta-moonforge-distro.yml sets distro too and wins by
# order. See the note in kas/common/tessaro.yml.
distro: tessaro
machine: genericx86-64
