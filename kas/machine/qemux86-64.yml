# qemux86-64: the development target. Boots under QEMU via the mise run tasks,
# and is the only machine that needs OVMF.
header:
  version: 16
  includes:
    - kas/common/tessaro.yml
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-qemu.yml

local_conf_header:
  25_tessaro-machine: |
    # Partition layout: ESP, rootfs, /data, swap. /data is found by label, set
    # in kas/common/tessaro.yml; here it would be /dev/sda3.
    WKS_FILE = "moonforge-image-base-qemux86-64.wks.in"
  30_tessaro-qemu-kiosk: |
    # runqemu defaults to 256M, which Chromium plus Weston will not survive.
    # 4G rather than the 2G cog needed: Chromium's process model is the whole
    # difference - a renderer, a GPU process and a zygote per tab, on top of
    # Weston.
    QB_MEM = "-m 4096"
    # Suppress QEMU's default std VGA. The display device itself comes from
    # runqemu's "egl-headless" option, which adds -device virtio-vga-gl and
    # -display egl-headless; adding one here as well would give Weston two
    # cards to choose between. QB_GRAPHICS is always appended by runqemu.
    #
    # virtio-vga-gl means virgl, which needs a real GPU on the *host* (a
    # render node at /dev/dri). Weston can limp along on Mesa's kms_swrast
    # because it holds DRM master, but the unprivileged renderer processes
    # cannot allocate dumb buffers, so the kiosk renders nothing at all
    # without host GPU passthrough.
    QB_GRAPHICS = "-vga none"

# Both keys belong in the entry point of the config chain: an include cannot
# set them, because meta-moonforge-distro.yml sets distro too and wins by
# order. See the note in kas/common/tessaro.yml.
distro: tessaro
machine: qemux86-64
