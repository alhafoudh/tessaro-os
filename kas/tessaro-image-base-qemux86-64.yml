header:
  version: 16
  includes:
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-distro.yml
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-qemu.yml
    # Kiosk browser. Pulls in meta-moonforge-graphics (Weston), meta-webkit and
    # meta-openembedded by itself, so this is the only layer line it needs.
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-wpe.yml

local_conf_header:
  20_meta-moonforge-qemu: |
    # Specifies description file for partitioning the image
    WKS_FILE = "moonforge-image-base-qemux86-64.wks.in"
  20_meta-moonforge-distro: |
    # Sets up persistent data partition
    OVERLAYFS_ETC_DEVICE = "/dev/sda3"
    # The kiosk needs room: the /etc overlay, /home/weston (the wpe layer's
    # volatile-binds bbappend maps it to /data/overlay-home) and the WebKit
    # disk cache all live on this partition.
    IMAGE_DATA_MIN_SIZE = "4096M"
  30_tessaro-qemu-kiosk: |
    # runqemu defaults to 256M, which WPEWebKit plus Weston will not survive.
    QB_MEM = "-m 2048"
    # Suppress QEMU's default std VGA. The display device itself comes from
    # runqemu's "egl-headless" option, which adds -device virtio-vga-gl and
    # -display egl-headless; adding one here as well would give Weston two
    # cards to choose between. QB_GRAPHICS is always appended by runqemu.
    #
    # virtio-vga-gl means virgl, which needs a real GPU on the *host* (a
    # render node at /dev/dri). Weston can limp along on Mesa's kms_swrast
    # because it holds DRM master, but WPEWebProcess runs as the unprivileged
    # "weston" user and the kernel refuses it the dumb-buffer allocation, so
    # the kiosk renders nothing at all without host GPU passthrough.
    QB_GRAPHICS = "-vga none"

repos:
  # Upstream layer collection. Pinned here; kas clones and checks it out.
  meta-moonforge:
    url: https://github.com/moonforgelinux/meta-moonforge.git
    commit: 7c2fe20810b8878a2d466bacb6de799149f968f4
    branch: main
  # No url: this is the repo holding this file, which kas never touches.
  tessaro-os:
    layers:
      meta-tessaro-distro:

distro: tessaro
machine: qemux86-64
