header:
  version: 16
  includes:
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-distro.yml
    - repo: meta-moonforge
      file: kas/include/layer/meta-moonforge-qemu.yml

local_conf_header:
  20_meta-moonforge-qemu: |
    # Specifies description file for partitioning the image
    WKS_FILE = "moonforge-image-base-qemux86-64.wks.in"
  20_meta-moonforge-distro: |
    # Sets up persistent data partition
    OVERLAYFS_ETC_DEVICE = "/dev/sda3"

repos:
  # Upstream layer collection. Pinned here; kas clones and checks it out.
  meta-moonforge:
    url: https://github.com/moonforgelinux/meta-moonforge.git
    commit: 7c2fe20810b8878a2d466bacb6de799149f968f4
    branch: main
  # No url: this is the repo holding this file, which kas never touches.
  tessaro-os:
    layers:
      meta-tessaro-distro:

distro: tessaro
machine: qemux86-64
