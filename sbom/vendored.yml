# Third-party files kept in this repo, which no lock file lists. Add one here
# in the same change that adds the file; sbom:check fails on an entry whose
# path is gone. See docs/sbom.md.

- component: tessaro-webconfig
  name: Manrope
  version: "4.505"
  license: OFL-1.1
  source: https://github.com/googlefonts/manrope
  path: webconfig/src/fonts/OFL.txt

- component: tessaro-gui
  name: Manrope
  version: "4.505"
  license: OFL-1.1
  source: https://github.com/googlefonts/manrope
  path: gui/tessaro-style/fonts/OFL.txt

- component: try-tessaro
  name: Manrope
  version: "4.505"
  license: OFL-1.1
  source: https://github.com/googlefonts/manrope
  path: gui/tessaro-style/fonts/OFL.txt

# MediaPipe's face detectors, converted to ONNX by `mise run vision:models`
# (agent/vision/models/convert.py, which pins the tag and the sha256).
- component: tessaro-kiosk
  name: MediaPipe face_detection_full_range
  version: "0.8.9"
  license: Apache-2.0
  source: https://github.com/google/mediapipe/blob/v0.8.9/mediapipe/modules/face_detection/face_detection_full_range.tflite
  path: agent/vision/models/face-full.onnx

- component: tessaro-kiosk
  name: MediaPipe face_detection_short_range
  version: "0.8.9"
  license: Apache-2.0
  source: https://github.com/google/mediapipe/blob/v0.8.9/mediapipe/modules/face_detection/face_detection_short_range.tflite
  path: agent/vision/models/face-short.onnx

# HSE FaceRes, the age and gender estimator, as `@vladmandic/human` ships it
# (MIT repository, the weights HSE-asavchenko's), converted to ONNX by the
# same task, pinned to a commit and its sha256.
- component: tessaro-kiosk
  name: HSE FaceRes (age and gender)
  version: bc66dc53bac03c96d35a7e6daaf717e72f3985f5
  license: Apache-2.0
  source: https://github.com/vladmandic/human-models/blob/bc66dc53bac03c96d35a7e6daaf717e72f3985f5/models/faceres.json
  path: agent/vision/models/faceres.onnx

# Two portrait photographs, scaled down: the faces the vision tests and the
# e2e presence lane's clip are made of. Not shipped.
- component: tests
  name: Opdracht Bonera 2 pasfoto's (Nationaal Archief 902-7906)
  version: "1"
  license: CC0-1.0
  source: https://commons.wikimedia.org/wiki/File:Opdracht_Bonera_2_pasfoto%27s,_Bestanddeelnr_902-7906.jpg
  path: agent/vision/tests/two-faces.jpg

# A colour portrait, scaled down: the woman the age and gender test reads.
# Not shipped.
- component: tests
  name: Outdoor portrait (Unsplash, Anthony Ginsbrook)
  version: "1"
  license: CC0-1.0
  source: https://commons.wikimedia.org/wiki/File:Outdoor_portrait_(Unsplash).jpg
  path: agent/vision/tests/woman.jpg
