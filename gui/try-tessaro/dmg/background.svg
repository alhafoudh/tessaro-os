<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
<!-- The DMG window's background (settings.py): the welcome page's look
     (tessaro-selftest/files/index.html), its glows, dot grid, wordmark and
     gradient heading, with an arrow from the app's place to Applications'.
     The icons sit at (180, 228) and (480, 228), as settings.py puts them. -->
<defs>
  <radialGradient id="glow-a" cx="110" cy="40" r="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="rgb(18,48,77)" stop-opacity=".95"/>
    <stop offset=".6" stop-color="rgb(16,36,58)" stop-opacity=".35"/>
    <stop offset="1" stop-color="rgb(16,36,58)" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-b" cx="580" cy="400" r="340" gradientUnits="userSpaceOnUse">
    <stop stop-color="rgb(36,27,68)" stop-opacity=".95"/>
    <stop offset=".6" stop-color="rgb(29,23,51)" stop-opacity=".35"/>
    <stop offset="1" stop-color="rgb(29,23,51)" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r=".9" fill="rgb(184,200,230)" fill-opacity=".09"/>
  </pattern>
  <radialGradient id="fade" cx="330" cy="210" r="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff"/>
    <stop offset=".55" stop-color="#fff" stop-opacity=".7"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dots-mask"><rect width="660" height="420" fill="url(#fade)"/></mask>
  <linearGradient id="heading" x1="230" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset=".3" stop-color="#eaf0f8"/>
    <stop offset=".7" stop-color="#5cc8ff"/>
    <stop offset="1" stop-color="#9d8cff"/>
  </linearGradient>
  <linearGradient id="arrow" x1="272" y1="0" x2="388" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#5cc8ff"/>
    <stop offset="1" stop-color="#9d8cff"/>
  </linearGradient>
  <linearGradient id="mark" x1="225" y1="103" x2="800" y2="921" gradientUnits="userSpaceOnUse">
    <stop stop-color="#5CC8FF"/>
    <stop offset="1" stop-color="#9D8CFF"/>
  </linearGradient>
</defs>

<rect width="660" height="420" fill="#0a0d14"/>
<rect width="660" height="420" fill="url(#glow-a)"/>
<rect width="660" height="420" fill="url(#glow-b)"/>
<rect width="660" height="420" fill="url(#dots)" mask="url(#dots-mask)"/>

<!-- The mark, tessaro-gui's icon without its tile, and the wordmark. -->
