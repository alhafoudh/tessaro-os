</g>
<text x="292" y="45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="3.3" fill="#eaf0f8">tessaro-os</text>

<text x="330" y="96" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-.7" fill="url(#heading)">Try Tessaro</text>
<text x="330" y="122" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8e9bb0">A Tessaro kiosk on this Mac, to explore before the real one</text>

<!-- From the app's place to Applications'. -->
<g fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M272 228 H384"/>
  <path d="M368 212 L388 228 L368 244"/>
</g>

<text x="330" y="392" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" letter-spacing=".9" fill="#8e9bb0">DRAG TRY TESSARO TO APPLICATIONS, THEN OPEN IT FROM THERE</text>
</svg>
