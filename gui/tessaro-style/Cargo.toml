[package]
name = "tessaro-style"
description = "The look tessaro-gui and Try Tessaro share: palette, styles, fonts, icons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The tones of the shared text (`text::Tone`), painted in theme.rs.
tessaro-client = { path = "../../agent/client" }
# `canvas` draws the title-bar icons (icon.rs).
iced = { version = "0.14", features = ["canvas"] }
