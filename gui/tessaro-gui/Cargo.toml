[package]
name = "tessaro-gui"
description = "Manage Tessaro kiosks from a desktop: discovery, known nodes, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tessaro-gui"
path = "src/main.rs"

[dependencies]
protocol = { path = "../../agent/protocol" }
tessaro-client = { path = "../../agent/client" }
serde = { version = "1", features = ["derive"] }
# The prefs' values: the zoom and where each kind of window was left.
serde_json = "1"
# The VNC viewer's VeNCrypt TLS, the platform's as everywhere else.
native-tls = "0.2"
# The system's own open and save dialogs: uploads, downloads, images.
rfd = "0.17"

# The GUI: one window, with the node list and each device as inner windows
# in it (mdi.rs). A device's blocking session runs on a thread of its own
# and talks to the UI through a subscription. `image` shows screenshots.
iced = { version = "0.14", features = ["advanced", "canvas", "image"] }
iced_table2 = "0.14.2"
# Own the cell widgets borrowed by iced_table2's column/row API.
ouroboros = "0.18"

[dev-dependencies]
# The README's screenshots: the app drawn headless (screenshot.rs).
iced_test = "0.14"
