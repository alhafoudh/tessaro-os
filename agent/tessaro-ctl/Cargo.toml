[package]
name = "tessaro-ctl"
description = "Manage Tessaro kiosks: locally on the device, or remotely over TLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tessaro-ctl"
path = "src/main.rs"

# Runs on the device and on a technician's laptop, macOS included, so no
# zbus, no tokio and no openssl crate: plain blocking sockets are all a
# one-request-at-a-time client needs.
[dependencies]
protocol = { path = "../protocol" }
# Finding a device, the pinned TLS session and nodes.json, shared with
# tessaro-gui.
tessaro-client = { path = "../client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", features = ["derive", "env"] }
# `tessaro-ctl completion bash|zsh|powershell`. Already in the lock through
# cfspeedtest.
clap_complete = "4"

# Colored output. Both already in the lock through clap. anstream's print
# macros strip the codes again when the stream is not a terminal, under
# NO_COLOR, or with --color never.
anstream = "1"
anstyle = "1"

# Password prompts without echo.
rpassword = "7"

[dev-dependencies]
tempfile = "3"
