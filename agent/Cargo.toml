# The kiosk's device-side programs, as one workspace so the command model is
# defined once and both ends of it compile against the same types:
#
#   protocol/       the wire types and the key registry. No Linux-only
#                   dependencies: tessaro-ctl builds for a technician's laptop.
#   tessaro-agent/  the supervisor on the device (zbus, CDP, systemd).
#   client/         talking to a device: discovery, the pinned session,
#                   the known nodes. A library, shared with tessaro-gui.
#   db/             opening a SQLite store: pragmas, migrations, setting a
#                   broken file aside. Shared by the agent and client/.
#   tessaro-ctl/    the client, on the device and on a laptop.
#   update/         in-place image updates: prepared by the agent, applied
#                   by tessaro-flash from the initramfs.
#   camera/         tessaro-camera, which mirrors a USB camera into a
#                   v4l2loopback device, one process per camera.
#
# The recipe builds the whole workspace from this directory (S is agent/), and
# cargo.bbclass installs every binary it finds, so all of them land in /usr/bin.
# That is why tessaro-gui is not a member: it lives in gui/, a workspace of its
# own, and reaches protocol/ and client/ by path.
[workspace]
resolver = "2"
members = ["protocol", "client", "db", "tessaro-agent", "tessaro-ctl", "update", "camera"]

[workspace.package]
version = "1.0.0"
edition = "2021"
# Kept at or below the rustc bitbake will use. That version is dictated by the
# Chromium pin (meta-lts-mixins-rust in kas/repo/meta-chromium.yml), not chosen
# here - see the comment on the mixin.
rust-version = "1.95"
license = "Apache-2.0"
publish = false
