# The kiosk's device-side programs, as one workspace so the command model is
# defined once and both ends of it compile against the same types:
#
#   protocol/       the wire types and the key registry. No Linux-only
#                   dependencies: tessaro-ctl builds for a technician's laptop.
#   tessaro-agent/  the supervisor on the device (zbus, CDP, systemd).
#   tessaro-ctl/    the client, on the device and on a laptop.
#
# The recipe builds the whole workspace from this directory (S is agent/), and
# cargo.bbclass installs every binary it finds, so both land in /usr/bin.
[workspace]
resolver = "2"
members = ["protocol", "tessaro-agent", "tessaro-ctl"]

[workspace.package]
version = "1.0.0"
edition = "2021"
# Kept at or below the rustc bitbake will use. That version is dictated by the
# Chromium pin (meta-lts-mixins-rust in kas/repo/meta-chromium.yml), not chosen
# here - see the comment on the mixin.
rust-version = "1.95"
license = "MIT"
publish = false
