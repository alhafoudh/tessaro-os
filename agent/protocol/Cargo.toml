[package]
name = "protocol"
description = "The Tessaro API: endpoint types, the OpenAPI document and the configuration key registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Types and pure functions only. Both tessaro-agent (device) and tessaro-ctl
# (device and laptop, macOS included) link this, so nothing Linux-only, no
# runtime and no I/O belong here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSH public keys: the base64 blob, and its SHA256 fingerprint in the form
# ssh-keygen prints, so both ends name a key the same way. Both are pure
# Rust and already in the lock through tessaro-ctl.
data-encoding = "2"
sha2 = "0.10"

# The API's query strings, the same encoding on both ends (`api.rs`). Already
# in the lock through reqwest.
serde_urlencoded = "0.7"

# JSON Schema of every type on the wire, which `openapi.rs` assembles into the
# API's OpenAPI document. Derive-only; the clients carry it for the bounds of
# `api::Endpoint`.
schemars = "1"
