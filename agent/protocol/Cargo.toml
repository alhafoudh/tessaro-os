[package]
name = "protocol"
description = "The Tessaro control protocol: wire types and the configuration key registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Types and pure functions only. Both tessaro-agent (device) and tessaro-ctl
# (device and laptop, macOS included) link this, so nothing Linux-only, no
# runtime and no I/O belong here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
