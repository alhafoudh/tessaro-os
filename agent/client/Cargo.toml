[package]
name = "tessaro-client"
description = "Talking to Tessaro devices: discovery, the pinned TLS session, the known nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Shared by tessaro-ctl and tessaro-gui (gui/, a workspace of its own), so
# nothing here prints or prompts: a caller that needs the user's say passes
# it in. Blocking sockets, like the ctl; the GUI runs a session on a thread.
[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tessaro.db, the known nodes and the GUI's preferences (store.rs). refinery
# is named only because embed_migrations! expands to `refinery::` paths;
# the same version and features as tessaro-db's.
tessaro-db = { path = "../db" }
refinery = { version = "0.9", default-features = false, features = ["rusqlite", "int8-versions"] }

# The platform's TLS: openssl on Linux, Security.framework on macOS. Chain
# verification is off on purpose - devices are self-signed - and replaced by
# a pin check on the certificate's SHA-256 before a single byte is sent.
native-tls = "0.2"
sha2 = "0.10"

# The API is HTTP/1.1 over that pinned stream (http.rs). No HTTP client
# crate: none takes a stream it did not open, which the pin check needs,
# without bringing an async runtime or rustls. httparse reads an answer's
# head; it is already in the lock through hyper.
httparse = "1"

data-encoding = "2"

# Reaching a device through its MQTT broker (mqtt.rs): the session, with no
# I/O of its own, run here on the same blocking sockets; the WebSocket for a
# ws:// or wss:// broker over them, handshake only, the version tokio's
# copy in the agent is; and the query a request carries, as the API's.
tessaro-mqtt = { path = "../mqtt" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_urlencoded = "0.7"

# NAME.local discovery. Blocking API, its own thread.
mdns-sd = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"
