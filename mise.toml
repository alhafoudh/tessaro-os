[tools]
python = "3.12.11"
# The agent is built by bitbake with the rustc the Chromium pin dictates
# (meta-lts-mixins-rust, see kas/repo/meta-chromium.yml). Pin the host
# toolchain to the same version so `cargo test` cannot pass on a language
# feature the image's compiler does not have. The lint tasks need rustfmt and
# clippy, which a fresh install (CI) does not bring on its own.
rust = { version = "1.95.0", components = "rustfmt,clippy" }
# Webconfig is built by bitbake with the nodejs-native meta-browser brings
# for Chromium. The same version here, so a dependency that needs a newer
# Node fails on the workstation, not in the image build.
node = "22.11.0"
# For `mise run image:flash`. Not on PyPI, so it comes straight from the upstream
# repo; mise installs it into its own tool dir, no venv to manage. The version
# is the git tag verbatim, and upstream tags carry a "v" - "3.9.0" asks for a
# ref that does not exist, and then every `mise run`/`mise exec` fails trying
# to install it.
"pipx:yoctoproject/bmaptool" = "v3.9.0"

[vars]
# The machine every task acts on. Override it per command:
#
#   TESSARO_MACHINE=raspberrypi3-64 mise run image:build
#
# or use the image:build:qemu / :x86 / :arm64 / :rpi3 / :rpi4 / :rpi5 wrappers. Valid values
# are the basenames in kas/machine/.
machine = "{{ env.TESSARO_MACHINE | default(value='qemux86-64') }}"

[env]
_.path = "/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/nvim-linux-x86_64/bin"
KAS_CONTAINER_ENGINE = "docker"
DL_DIR = "{{config_root}}/cache/downloads"
SSTATE_DIR = "{{config_root}}/cache/sstate-cache"

# Exported so the tasks can branch on it (OVMF and runqemu are QEMU-only).
TESSARO_MACHINE = "{{vars.machine}}"

# One machine fragment plus the shared debug fragment. The machine fragment
# includes kas/common/tessaro.yml, which carries the pins, the distro and the
# kiosk layers.
KAS_CONFIG = "kas/machine/{{vars.machine}}.yml:kas/common/debug.yml"

# A build dir (TOPDIR) per machine, all sharing DL_DIR and SSTATE_DIR, so
# switching targets does not throw away the other one's tmp/. kas-container
# creates this directory and mounts it at /build.
KAS_BUILD_DIR = "{{config_root}}/build/{{vars.machine}}"

# Relative to the build dir, so the same value works on the host
# ("$KAS_BUILD_DIR/$WIC") and inside the container (cwd is /build).
WIC = "tmp/deploy/images/{{vars.machine}}/tessaro-os-{{vars.machine}}.rootfs.wic"

# Keep cargo's build tree out of agent/. The recipe fetches that directory
# with a file:// SRC_URI, and bitbake copies and checksums everything it finds
# there - a stray target/ would put gigabytes of object files into WORKDIR and
# into the task hash on every build.
CARGO_TARGET_DIR = "{{config_root}}/build/cargo-target"

# Task names are <artifact>:<action>[:<variant>], and an action means the same
# thing in every group (build, run, test, lint).

[tasks."agent:test"]
description = "Run the unit tests of the agent workspace (protocol, tessaro-agent, tessaro-ctl)"
dir = "{{config_root}}/agent"
run = "cargo test --workspace"

[tasks."agent:lint"]
description = "Check formatting and run clippy on the agent workspace"
dir = "{{config_root}}/agent"
run = '''
set -e
cargo fmt --all --check
cargo clippy --workspace --all-targets -- -D warnings
'''

[tasks."vision:models"]
description = "Convert MediaPipe's face detectors into the ONNX files tessaro-vision runs (tf2onnx in docker)"
dir = "{{config_root}}"
run = '''
set -e
docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
    -v "$PWD/agent/vision/models:/models" python:3.11-slim \
    sh -c 'pip install --quiet --user tf2onnx==1.16.1 tensorflow-cpu==2.15.1 "numpy<2" && python /models/convert.py'
'''

[tasks."agent:integration"]
description = "Run the agent against a real headless Chromium (Ctrl-C to stop)"
dir = "{{config_root}}/agent"
raw = true
run = '''
set -e
docker compose up -d chromium
trap 'docker compose down' EXIT

# Wait for the endpoint rather than for the container: a running container
# whose DevTools port is not listening yet would just make the first few
# cycles lie.
for _ in $(seq 30); do
    curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
    sleep 1
done

# headless-shell starts with no tab, and the agent drives the first target of
# type "page" - with none it correctly reports the browser as unusable and
# spends the whole run trying to restart it. On the device tessaro-kiosk.service
# always starts Chromium with a URL, so open one here to match.
curl -sf -X PUT "http://127.0.0.1:9222/json/new?about:blank" >/dev/null

# Everything the agent owns on a device - tessaro.db, the TLS identity, the
# socket, a shadow file to set a root password in, the rendered files - goes
# into one sandbox here, so the control plane runs for real without touching
# the host. Drive it from another terminal with
#   TESSARO_SOCKET=<sandbox>/agent.sock tessaro-ctl device status
#   tessaro-ctl --node 127.0.0.1:17400 access claim
# or open Webconfig and the API at https://127.0.0.1:17400/ once
# `mise run webconfig:build` has built it. Swagger UI comes from its recipe
# and is not here.
sandbox="$(mktemp -d)"
mkdir -p "$sandbox/etc"
printf 'root::19000:0:99999:7:::\n' > "$sandbox/etc/shadow"
echo "sandbox: $sandbox"

# The CDP server doubles as the probe target - it is the one HTTP endpoint
# guaranteed to be up here, and /json/version is cheap.
KIOSK_STATE_DIR="$sandbox/data" \
KIOSK_FILES_DIR="$sandbox/files" \
KIOSK_RUN_DIR="$sandbox/run" \
KIOSK_POLICY="$sandbox/policy.json" \
KIOSK_POLICY_BASE=/nonexistent \
KIOSK_SOCKET="$sandbox/agent.sock" \
KIOSK_SHADOW="$sandbox/etc/shadow" \
KIOSK_AUTHORIZED_KEYS="$sandbox/root/.ssh/authorized_keys" \
KIOSK_SSH_HOST_KEY_DIRS="$sandbox/dropbear" \
KIOSK_NM_RUN_DIR="$sandbox/nm" \
KIOSK_MANAGE_CLOCK=0 \
KIOSK_PROXY_CONFIG="$sandbox/tinyproxy.conf" \
KIOSK_PROXY_UNIT=tessaro-e2e-no-such-proxy.service \
KIOSK_TIMESYNCD_DROPIN="$sandbox/timesyncd.conf" \
KIOSK_MANAGE_SCHEDULES=0 \
KIOSK_SYSTEMD_UNIT_DIR="$sandbox/units" \
KIOSK_MANAGE_PRINTERS=0 \
KIOSK_API_LISTEN=127.0.0.1:17400 \
KIOSK_PORTAL_DIR="$sandbox/portal" \
KIOSK_WEBCONFIG_ROOT="{{config_root}}/build/webconfig" \
KIOSK_MDNS=off \
KIOSK_URL="data:text/html,<h1>integration target</h1>" \
KIOSK_CDP_URL=http://127.0.0.1:9222 \
KIOSK_PROBE_URL=http://127.0.0.1:9222/json/version \
KIOSK_PROBE_INTERVAL=5 \
KIOSK_PROBE_INTERVAL_FAIL=2 \
KIOSK_FAIL_THRESHOLD=1 \
KIOSK_REFRESH_INTERVAL=30 \
KIOSK_PING_FAILS=3 \
KIOSK_RESTART_AFTER=0 \
KIOSK_OFFLINE_DIR="$(mktemp -d)" \
KIOSK_OFFLINE_PAGE_DEFAULT="{{config_root}}/meta-tessaro-distro/recipes-browser/tessaro-kiosk/files/offline.html" \
KIOSK_DEBUG=1 \
    cargo run -p tessaro-agent
'''

[tasks."e2e:setup"]
description = "Install the gems the end-to-end suite runs on (rspec, parallel_tests)"
dir = "{{config_root}}/test/e2e"
run = "bundle install"

[tasks."e2e:run"]
description = "Run the end-to-end suite, one qemux86-64 VM per lane, E2E_JOBS (3) at a time"
dir = "{{config_root}}/test/e2e"
depends = ["qemu:unpack"]
raw = true
# Never builds: `mise run image:build` first. Each spec file under
# test/e2e/spec is a lane, run in order on a VM of its own (snapshot, host
# networking, ports offset per worker); parallel_tests spreads the lanes over
# E2E_JOBS workers, balanced by the runtimes the last run logged. E2E_JOBS=1
# runs one VM at a time. Output is live, each line prefixed with its worker;
# E2E_VERBOSE=1 adds each step (2 the agent's journal), and every lane's steps
# are in build/e2e/<lane>.log either way. Arguments go to parallel_rspec, e.g.
# `-- -o '--tag ~reboot'` to leave out the update lanes.
run = '''
[ "$TESSARO_MACHINE" = "qemux86-64" ] || {
    echo "e2e only works for qemux86-64, not $TESSARO_MACHINE" >&2
    exit 1
}
rm -rf ../../build/e2e/progress && mkdir -p ../../build/e2e/progress
date +%s > ../../build/e2e/progress/started
exec bundle exec parallel_rspec -n "${E2E_JOBS:-3}" --prefix-output --combine-stderr \
    --runtime-log ../../build/e2e/parallel_runtime.log "$@" spec
'''

[tasks."e2e:one"]
description = "Run one lane or case of the end-to-end suite with plain rspec, on worker 0's ports"
dir = "{{config_root}}/test/e2e"
depends = ["qemu:unpack"]
raw = true
# Arguments go to rspec, relative to test/e2e:
#   mise run e2e:one -- spec/network_spec.rb -e ping
# With E2E_KEEP=1 the VM stays up afterwards, and E2E_REUSE=1 runs against it.
run = '''
[ "$TESSARO_MACHINE" = "qemux86-64" ] || {
    echo "e2e only works for qemux86-64, not $TESSARO_MACHINE" >&2
    exit 1
}
exec bundle exec rspec "$@"
'''

[tasks."ctl:build"]
description = "Build tessaro-ctl for this host, to manage devices remotely"
dir = "{{config_root}}/agent"
# A release build of the client only - no zbus, no tokio - for the machine
# this runs on. The device gets its own copy from the image; this one is for a
# technician's laptop. Copy it anywhere on PATH.
run = '''
set -e
cargo build --release -p tessaro-ctl
echo "$CARGO_TARGET_DIR/release/tessaro-ctl"
'''

[tasks."ctl:run"]
description = "Build tessaro-ctl if its source changed, then run it with the arguments after --"
dir = "{{config_root}}"
# The release build ctl:build makes, brought up to date first as gui:run
# does; cargo does nothing when it is fresh. Quiet, and on stderr, so
# stdout is only the ctl's (--json pipes). The repo root stays the cwd, so
# relative paths in the arguments mean what they did. raw for the commands
# that prompt or take over the terminal (access claim, ssh connect).
#   mise run ctl:run -- device status
raw = true
run = '''
set -e
cargo build --release --quiet --manifest-path agent/Cargo.toml -p tessaro-ctl
exec "$CARGO_TARGET_DIR/release/tessaro-ctl" "$@"
'''

# tessaro-gui, the desktop client. gui/ is a workspace of its own with a lock
# of its own, so it builds into a target dir of its own too: sharing agent/'s
# would rebuild the crates both use every time the other one is built.
[tasks."gui:run"]
description = "Run tessaro-gui, the desktop client, on this host"
dir = "{{config_root}}/gui"
env = { CARGO_TARGET_DIR = "{{config_root}}/build/gui-target" }
run = '''
set -e
if [ "$(uname -s)" = Darwin ]; then
    cargo build -p tessaro-gui
    app=$(sh package-macos.sh "$CARGO_TARGET_DIR/debug/tessaro-gui")
    # Through Launch Services, so the window comes to the front: a child of
    # the terminal is never activated (docs/gui.md). -n starts this build
    # even when an older one is running; Ctrl-C quits it.
    if tty -s; then out=$(tty); else out=/dev/null; fi
    trap 'pkill -f "$app/Contents/MacOS/tessaro-gui" || true' INT TERM
    open -n -W --stdout "$out" --stderr "$out" "$app"
else
    exec cargo run -p tessaro-gui
fi
'''

[tasks."gui:build"]
description = "Build tessaro-gui for this host, release"
dir = "{{config_root}}/gui"
env = { CARGO_TARGET_DIR = "{{config_root}}/build/gui-target" }
run = '''
set -e
cargo build --release -p tessaro-gui
if [ "$(uname -s)" = Darwin ]; then
    sh package-macos.sh "$CARGO_TARGET_DIR/release/tessaro-gui"
else
    echo "$CARGO_TARGET_DIR/release/tessaro-gui"
fi
'''

# Try Tessaro, the macOS launcher in gui/try-tessaro: the app bundles QEMU
# (Homebrew's, relinked), tessaro-ctl, Tessaro.app and a genericarm64 image,
# so packaging needs all of them (docs/try-tessaro.md).
[tasks."try:run"]
description = "Run Try Tessaro, the macOS launcher, from this checkout with a genericarm64 image"
dir = "{{config_root}}/gui"
env = { CARGO_TARGET_DIR = "{{config_root}}/build/gui-target" }
usage = '''
arg "[image]" help="a genericarm64 .wic.zst to bundle (default: the one image:pull fetched)"
'''
run = '''
set -e
[ "$(uname -s)" = Darwin ] || { echo "Try Tessaro runs on macOS" >&2; exit 1; }
image={{ usage.image | default(value="") | quote }}
[ -n "$image" ] || image="{{config_root}}/tessaro-os-genericarm64.rootfs.wic.zst"
case "$image" in /*) ;; *) image="$MISE_ORIGINAL_CWD/$image" ;; esac
CARGO_TARGET_DIR="{{config_root}}/build/cargo-target" \
    cargo build --release --manifest-path ../agent/Cargo.toml -p tessaro-ctl
cargo build -p tessaro-gui -p try-tessaro
gui_app=$(sh package-macos.sh "$CARGO_TARGET_DIR/debug/tessaro-gui")
app=$(sh try-tessaro/package-macos.sh "$CARGO_TARGET_DIR/debug/try-tessaro" \
    "{{config_root}}/build/cargo-target/release/tessaro-ctl" "$gui_app" "$image")
# Through Launch Services, as gui:run does: the window comes to the front.
if tty -s; then out=$(tty); else out=/dev/null; fi
trap 'pkill -f "$app/Contents/MacOS/try-tessaro" || true' INT TERM
open -n -W --stdout "$out" --stderr "$out" "$app"
'''

[tasks."try:build"]
description = "Build Try Tessaro.app and its DMG for this Mac, release, with a genericarm64 image"
dir = "{{config_root}}/gui"
env = { CARGO_TARGET_DIR = "{{config_root}}/build/gui-target" }
usage = '''
arg "[image]" help="a genericarm64 .wic.zst to bundle (default: the one image:pull fetched)"
'''
run = '''
set -e
[ "$(uname -s)" = Darwin ] || { echo "Try Tessaro builds on macOS" >&2; exit 1; }
image={{ usage.image | default(value="") | quote }}
[ -n "$image" ] || image="{{config_root}}/tessaro-os-genericarm64.rootfs.wic.zst"
case "$image" in /*) ;; *) image="$MISE_ORIGINAL_CWD/$image" ;; esac
CARGO_TARGET_DIR="{{config_root}}/build/cargo-target" \
    cargo build --release --manifest-path ../agent/Cargo.toml -p tessaro-ctl
cargo build --release -p tessaro-gui -p try-tessaro
gui_app=$(sh package-macos.sh "$CARGO_TARGET_DIR/release/tessaro-gui")
app=$(sh try-tessaro/package-macos.sh "$CARGO_TARGET_DIR/release/try-tessaro" \
    "{{config_root}}/build/cargo-target/release/tessaro-ctl" "$gui_app" "$image")
# The DMG opens on the app beside a link to /Applications, over the welcome
# page's background (try-tessaro/dmg/), laid out by dmgbuild, pinned, in a
# venv of its own under build/: it writes Finder's .DS_Store without Finder,
# so it runs the same on a headless runner, and sizes the image from the
# files' full size (the UEFI firmware is sparse; hdiutil's own estimate
# counts blocks on disk and runs out of room).
venv="{{config_root}}/build/dmgbuild-venv"
[ -x "$venv/bin/dmgbuild" ] || {
    python3 -m venv "$venv"
    "$venv/bin/pip" install --quiet dmgbuild==1.6.7
}
dmg="{{config_root}}/build/Try-Tessaro-macos-arm64.dmg"
"$venv/bin/dmgbuild" -s try-tessaro/dmg/settings.py -D here="$PWD/try-tessaro/dmg" \
    -D app="$app" "Try Tessaro" "$dmg" >&2
echo "$dmg"
'''

[tasks."gui:test"]
description = "Run the unit tests of tessaro-gui"
dir = "{{config_root}}/gui"
env = { CARGO_TARGET_DIR = "{{config_root}}/build/gui-target" }
run = "cargo test --workspace"

[tasks."gui:lint"]
description = "Check formatting and run clippy on tessaro-gui"
dir = "{{config_root}}/gui"
env = { CARGO_TARGET_DIR = "{{config_root}}/build/gui-target" }
run = '''
set -e
cargo fmt --all --check
cargo clippy --workspace --all-targets -- -D warnings
'''

[tasks."webconfig:setup"]
description = "Install Webconfig's dependencies from package-lock.json"
dir = "{{config_root}}/webconfig"
run = "npm ci --no-audit --no-fund"

[tasks."webconfig:gen"]
description = "Generate Webconfig's API types from agent/protocol/openapi.json"
dir = "{{config_root}}/webconfig"
run = "npm run gen"

[tasks."webconfig:lock"]
description = "Write bitbake-lock.json, what the tessaro-webconfig recipe fetches, from package-lock.json"
dir = "{{config_root}}/webconfig"
run = "npm run lock"

[tasks."webconfig:run"]
description = "Webconfig's dev server on http://localhost:5173, the API proxied to TESSARO_WEBCONFIG_TARGET (default the qemu forward)"
dir = "{{config_root}}/webconfig"
run = "npm run dev"

[tasks."webconfig:build"]
description = "Build Webconfig into build/webconfig, where agent:integration serves it from"
dir = "{{config_root}}/webconfig"
run = "npm run build"

[tasks."webconfig:test"]
description = "Webconfig's unit tests, the result text against the golden fixtures, and bitbake-lock.json being current"
dir = "{{config_root}}/webconfig"
run = '''
set -e
npm test
npm run lock:check
'''

[tasks."webconfig:lint"]
description = "Type check, ESLint and Prettier on Webconfig"
dir = "{{config_root}}/webconfig"
run = "npm run lint"

# The demo (docs/demo.md): Webconfig's tools and the same lock rules, but no
# API types - it reaches the device only through window.tessaro.
[tasks."demo:setup"]
description = "Install the demo's dependencies from package-lock.json"
dir = "{{config_root}}/demo"
run = "npm ci --no-audit --no-fund"

[tasks."demo:lock"]
description = "Write bitbake-lock.json, what the tessaro-demo recipe fetches, from package-lock.json"
dir = "{{config_root}}/demo"
run = "npm run lock"

[tasks."demo:run"]
description = "The demo's dev server on http://localhost:5174, with a pretend device on window.tessaro"
dir = "{{config_root}}/demo"
run = "npm run dev"

[tasks."demo:build"]
description = "Build the demo into build/demo"
dir = "{{config_root}}/demo"
run = "npm run build"

[tasks."demo:test"]
description = "The demo's unit tests, and bitbake-lock.json being current"
dir = "{{config_root}}/demo"
run = '''
set -e
npm test
npm run lock:check
'''

[tasks."demo:lint"]
description = "Type check, ESLint and Prettier on the demo"
dir = "{{config_root}}/demo"
run = "npm run lint"

# Into the device's file store and onto its screen, for working on the demo
# against real hardware. The page is then the file store's
# http://127.0.0.1/files/demo/, on the origin the bridge answers while
# browser.url is the welcome page.
[tasks."demo:sync"]
description = "Build the demo, sync it into TESSARO_NODE's /data/files/demo and open it there"
dir = "{{config_root}}"
run = '''
set -e
: "${TESSARO_NODE:?name the device, like TESSARO_NODE=192.168.1.42 mise run demo:sync}"
(cd demo && npm run build)
mise run ctl:run -- files sync build/demo demo --yes
mise run ctl:run -- browser navigate http://127.0.0.1/files/demo/
'''

[tasks."player:test"]
description = "The player page's unit tests (player-core.js), with node --test"
dir = "{{config_root}}/meta-tessaro-distro/recipes-browser/tessaro-selftest/files/player"
run = "node --test"

# The directory the recipe installs from, so the sample playlist reaches the
# local pages and their sample video by the same relative paths as on disk.
# python3's http.server because it is already a mise tool and needs nothing
# fetched; the page polls ?src= for changes, so editing dev/sample.json
# shows within seconds.
[tasks."player:run"]
description = "Serve the player page with dev/sample.json on http://127.0.0.1:8090 (PLAYER_PORT)"
dir = "{{config_root}}/meta-tessaro-distro/recipes-browser/tessaro-selftest/files"
run = '''
port="${PLAYER_PORT:-8090}"
echo "http://127.0.0.1:$port/player/player.html?src=dev/sample.json"
exec python3 -m http.server "$port" --bind 127.0.0.1
'''

[tasks."docs:screenshots"]
description = "Render the README's screenshots (the kiosk's pages, Webconfig, tessaro-gui) from the shipped pages and fixed data, Webconfig's with Playwright in docker"
dir = "{{config_root}}"
run = '''
set -e
# The fixtures are what the agent itself writes: the welcome page's
# welcome.json, QR code included, the debug screen's page, and the API's
# answers for a made-up device (api/).
(cd agent && UPDATE_SCREENSHOTS=1 cargo test -p tessaro-agent screenshot_fixture)
# Webconfig is shot as it is built for the image.
[ -d webconfig/node_modules ] || mise run webconfig:setup
mise run webconfig:build
# The demo too, served at /demo/ as the image does.
[ -d demo/node_modules ] || mise run demo:setup
mise run demo:build
# tessaro-gui draws itself, headless, from the same answers, into
# build/screenshots, which shoot.mjs turns into JPEGs.
(cd gui && CARGO_TARGET_DIR="$PWD/../build/gui-target" \
    cargo test -p tessaro-gui screenshot -- --ignored)
# The image's browser has to be the one playwright-core expects, so both
# take the version pinned in package.json.
version=$(node -p "require('./docs/screenshots/package.json').dependencies['playwright-core']")
docker run --rm --init --user "$(id -u):$(id -g)" -e HOME=/tmp \
    -v "$PWD:/repo" -w /repo/docs/screenshots \
    "mcr.microsoft.com/playwright:v$version-noble" \
    sh -c 'npm ci --no-audit --no-fund --silent && node shoot.mjs'
'''

[tasks."image:build"]
description = "Build the image for $TESSARO_MACHINE (default qemux86-64)"
dir = "{{config_root}}"
run = '''
# OVMF is the UEFI firmware runqemu boots the image with, so it is built for
# the QEMU target only. Real hardware brings its own. genericarm64 gets
# U-Boot's qemu_arm64 build instead (UBOOT_MACHINE in genericarm64.conf),
# which qemu:run boots it with on Linux; a Mac uses Homebrew's edk2.
case "$TESSARO_MACHINE" in
    qemux86-64) set -- --target moonforge-image-base --target ovmf ;;
    genericarm64) set -- --target moonforge-image-base --target u-boot ;;
    *) set -- --target moonforge-image-base ;;
esac
kas-container build "$@" $KAS_CONFIG
'''

[tasks."image:build:qemu"]
description = "Build the qemux86-64 image (development target)"
dir = "{{config_root}}"
run = "TESSARO_MACHINE=qemux86-64 mise run image:build"

[tasks."image:build:x86"]
description = "Build the genericx86-64 image (real x86_64 hardware)"
dir = "{{config_root}}"
run = "TESSARO_MACHINE=genericx86-64 mise run image:build"

[tasks."image:build:arm64"]
description = "Build the genericarm64 image (UEFI Arm64: QEMU, a Mac under HVF, SystemReady boards)"
dir = "{{config_root}}"
run = "TESSARO_MACHINE=genericarm64 mise run image:build"

[tasks."image:build:rpi3"]
description = "Build the raspberrypi3-64 image (Pi 3B / 3B+, SD or USB storage)"
dir = "{{config_root}}"
run = "TESSARO_MACHINE=raspberrypi3-64 mise run image:build"

[tasks."image:build:rpi4"]
description = "Build the raspberrypi4-64 image (Pi 4B / 400 / CM4, SD or USB storage)"
dir = "{{config_root}}"
run = "TESSARO_MACHINE=raspberrypi4-64 mise run image:build"

[tasks."image:build:rpi5"]
description = "Build the raspberrypi5 image (Pi 5, SD / USB / NVMe storage)"
dir = "{{config_root}}"
run = "TESSARO_MACHINE=raspberrypi5 mise run image:build"

[tasks."image:shell"]
description = "Drop into the kas build environment for $TESSARO_MACHINE (cwd is the build dir)"
dir = "{{config_root}}"
raw = true
run = "kas-container shell $KAS_CONFIG"

[tasks."image:clean"]
description = "Remove build artifacts for $TESSARO_MACHINE, keeping sstate and downloads"
dir = "{{config_root}}"
run = "kas-container clean $KAS_CONFIG"

[tasks."image:sizes"]
description = "List the size of every built .wic image, across all machines"
dir = "{{config_root}}"
run = '''
# Deliberately not scoped to $TESSARO_MACHINE: the point is to compare the
# targets against each other. Symlinks are skipped - the stable
# "...rootfs.wic.zst" name points at the versioned file already listed.
found=0
printf '%-16s %10s %10s  %s\n' MACHINE SIZE ON-DISK FILE
for dir in build/*/tmp/deploy/images/*; do
    [ -d "$dir" ] || continue
    machine=$(basename "$dir")
    for wic in "$dir"/*.wic "$dir"/*.wic.zst; do
        [ -f "$wic" ] || continue
        [ -L "$wic" ] && continue
        # A .wic is sparse, so the apparent size and the blocks it actually
        # costs on disk are different numbers and both are worth seeing.
        size=$(du -h --apparent-size "$wic" | cut -f1)
        disk=$(du -h "$wic" | cut -f1)
        printf '%-16s %10s %10s  %s\n' "$machine" "$size" "$disk" "$(basename "$wic")"
        found=1
    done
done
[ "$found" = 1 ] || echo "no .wic images found - run 'mise run image:build' first" >&2
'''

[tasks."image:name"]
description = "Print the file name the next image:build will give the $TESSARO_MACHINE image"
dir = "{{config_root}}"
run = '''
# The same computation as TESSARO_REVISION in tessaro.conf, from the same
# directory. The build runs git inside kas-container, which has no global git
# config, so the user's global excludes file is left out here too - a file it
# hides on the host is untracked there and makes the build -dirty.
version=$(sed -n 's/^DISTRO_VERSION = "\(.*\)"$/\1/p' meta-tessaro-distro/conf/distro/tessaro.conf)
cd meta-tessaro-distro
rev=$(git rev-parse --short=7 HEAD 2>/dev/null) || rev=unknown
[ -z "$(git -c core.excludesFile=/dev/null status --porcelain 2>/dev/null)" ] || rev=$rev-dirty
echo "tessaro-os-$TESSARO_MACHINE-$version-$rev.wic.zst"
'''

# image:list, image:pull, image:flash and image:update run on a workstation, not on the
# build host: the image is built on a remote x86 machine and pulled here. The
# normal way onto a device is image:update, which pulls the image and sends it
# to the running device over the network with tessaro-ctl, keeping its
# settings and claim. image:flash writes a card or disk plugged in here and is
# the manual path: a first install, a device that no longer boots, or one
# flashed before the update layout (see docs/updates.md).
# TESSARO_BUILD_HOST, TESSARO_BUILD_HOST_DIR, TESSARO_NODE and
# TESSARO_FLASH_DEVICE come from mise.local.toml, see README.md.

[tasks."image:list"]
description = "List the .wic.zst images on the build host, across all machines"
dir = "{{config_root}}"
run = '''
set -eu
: "${TESSARO_BUILD_HOST:?set it in mise.local.toml}"
: "${TESSARO_BUILD_HOST_DIR:?set it in mise.local.toml}"

# Deliberately not scoped to $TESSARO_MACHINE, like image:sizes. One find on
# the build host returns the versioned files and the stable .rootfs.wic.zst
# symlinks; the file a symlink points at is the one image:pull fetches by
# default, and gets a "*".
listing=$(ssh "$TESSARO_BUILD_HOST" "cd '$TESSARO_BUILD_HOST_DIR' && find build -mindepth 6 -maxdepth 6 -path 'build/*/tmp/deploy/images/*/*.wic.zst' -printf '%y\t%T@\t%s\t%TY-%Tm-%Td %TH:%TM\t%h\t%f\t%l\n'")
if [ -z "$listing" ]; then
    echo "no .wic.zst images on $TESSARO_BUILD_HOST - run 'mise run image:build' there first" >&2
    exit 1
fi

printf '%s\n' "$listing" | sort -t "$(printf '\t')" -k5,5 -k2,2n | awk -F'\t' '
function human(s,  i, u) {
    split("B K M G T", u, " ")
    for (i = 1; s >= 1024 && i < 5; i++) s /= 1024
    return sprintf("%.1f%s", s, u[i])
}
$1 == "l" { pulled[$5 "/" $7] = 1; next }
$1 == "f" { rows[++n] = $0 }
END {
    printf "  %-16s %8s  %-16s  %s\n", "MACHINE", "SIZE", "BUILT", "FILE"
    for (i = 1; i <= n; i++) {
        split(rows[i], f, "\t")
        machine = f[5]; sub(".*/", "", machine)
        mark = ((f[5] "/" f[6]) in pulled) ? "*" : " "
        printf "%s %-16s %8s  %-16s  %s\n", mark, machine, human(f[3]), f[4], f[6]
    }
}'
echo "* is what 'mise run image:pull' fetches for that machine"
'''

[tasks."image:pull"]
description = "Pull the $TESSARO_MACHINE image and its bmap from the build host into the repo root"
dir = "{{config_root}}"
usage = '''
arg "[path]" help="Remote path on $TESSARO_BUILD_HOST, wildcards allowed (defaults to the $TESSARO_MACHINE image in $TESSARO_BUILD_HOST_DIR)"
'''
run = '''
set -eu
: "${TESSARO_BUILD_HOST:?set it in mise.local.toml}"

path={{ usage.path | default(value="") | quote }}
if [ -z "$path" ]; then
    : "${TESSARO_BUILD_HOST_DIR:?set it in mise.local.toml}"
    path="$TESSARO_BUILD_HOST_DIR/build/$TESSARO_MACHINE/$WIC.*"
fi

# The wildcard stays quoted so it expands on the build host, not here. -L
# copies what the stable .rootfs symlinks point at, under the symlink's name,
# and -ii lists every matched file, including the ones already up to date.
set -- rsync -Lav -ii --progress "$TESSARO_BUILD_HOST:$path" .
echo "+ $*"
"$@"
'''

[tasks."image:flash"]
description = "Manual: write the pulled $TESSARO_MACHINE image to a card or disk with bmaptool (first install, recovery)"
dir = "{{config_root}}"
raw = true
usage = '''
arg "[device]" help="Target device, e.g. /dev/disk4 (macOS) or /dev/sdb (Linux) (defaults to $TESSARO_FLASH_DEVICE)"
'''
run = '''
set -eu

device={{ usage.device | default(value="") | quote }}
if [ -z "$device" ]; then
    device="${TESSARO_FLASH_DEVICE:?pass a device or set it in mise.local.toml}"
fi
name=$(basename "$WIC")
image="$name.zst"
bmap="$name.bmap"

if [ ! -f "$image" ]; then
    echo "missing $image - run 'mise run image:pull' first" >&2
    exit 1
fi
# Every image builds a wic.bmap (moonforge-image-base.bbappend), but one built
# before that has none. bmaptool still works without it, it just writes every
# block instead of only the used ones.
if [ -f "$bmap" ]; then
    set -- --bmap "$bmap"
else
    echo "no $bmap - writing the whole image" >&2
    set -- --nobmap
fi

target="$device"
if [ "$(uname -s)" = "Darwin" ]; then
    # bmaptool cannot write to a disk with mounted volumes
    diskutil unmountDisk "$device"
    # the raw device skips the buffer cache and is much faster
    target=$(echo "$device" | sed 's|^/dev/disk|/dev/rdisk|')
else
    for part in "$device"?*; do
        [ -b "$part" ] || continue
        sudo umount "$part" 2>/dev/null || true
    done
fi

echo "flashing $image -> $target"
sudo "$(command -v bmaptool)" copy "$@" "$image" "$target"

# flush pending writes, then release the disk so it can be pulled out
sync
if [ "$(uname -s)" = "Darwin" ]; then
    diskutil eject "$device"
elif command -v udisksctl >/dev/null; then
    udisksctl power-off -b "$device"
else
    sudo eject "$device"
fi
echo "done - $device can be removed"
'''

[tasks."image:update"]
description = "Pull the $TESSARO_MACHINE image and update a running device with it over the network, keeping its settings"
dir = "{{config_root}}"
# The freshest image, and a tessaro-ctl built from this checkout: the client
# speaks the protocol of the tree it was built from, so one left on PATH from
# an older checkout may not know `update` at all. Both are no-ops when
# nothing changed.
depends = ["image:pull", "ctl:build"]
raw = true
usage = '''
arg "[node]" help="The device, as tessaro-ctl --node takes it (defaults to $TESSARO_NODE)"
flag "--wipe-data" help="Also re-create /data: settings, the claim and the device's identity go"
flag "--repartition" help="Rewrite the whole disk, partition table and /data included, for a device on another layout"
flag "--no-reboot" help="Stage and commit it, but leave the reboot for later"
flag "-y --yes" help="Do not ask before writing the device"
'''
run = '''
set -eu

node={{ usage.node | default(value="") | quote }}
if [ -z "$node" ]; then
    node="${TESSARO_NODE:?pass a node or set TESSARO_NODE in mise.local.toml}"
fi
name=$(basename "$WIC")
image="$name.zst"

if [ ! -f "$image" ]; then
    echo "missing $image - image:pull found nothing to pull" >&2
    exit 1
fi
if [ ! -f "$name.bmap" ]; then
    echo "missing $name.bmap - an update writes only the blocks the bmap lists" >&2
    exit 1
fi

set --
[ "{{ usage.wipe_data | default(value='false') }}" = "true" ] && set -- "$@" --wipe-data
[ "{{ usage.repartition | default(value='false') }}" = "true" ] && set -- "$@" --repartition
[ "{{ usage.no_reboot | default(value='false') }}" = "true" ] && set -- "$@" --no-reboot
[ "{{ usage.yes | default(value='false') }}" = "true" ] && set -- "$@" --yes

# Resumes on its own: run it again after a dropped connection and the upload
# carries on from the last byte the device has.
exec "$CARGO_TARGET_DIR/release/tessaro-ctl" --node "$node" update send "$@" "$image"
'''

# The SBOM and its license policy (docs/sbom.md). sbom/sbom.rb uses only
# Ruby's standard library, cargo and npm, so the system ruby of a CI runner
# or the build host does.
[tasks."sbom:build"]
description = "Write the $TESSARO_MACHINE image's SBOM bundle and license list into build/sbom/, from its built image"
dir = "{{config_root}}"
run = 'ruby sbom/sbom.rb build --machine "$TESSARO_MACHINE" --build-dir "$KAS_BUILD_DIR" --out "build/sbom/$TESSARO_MACHINE"'

[tasks."sbom:check"]
description = "Check the licenses of every crate, npm package and vendored file against sbom/licenses.yml"
dir = "{{config_root}}"
run = "ruby sbom/sbom.rb check"

# The store is shared by every checkout and build on the host, like cache/;
# the release workflow sets TESSARO_SOURCES_DIR from a repository variable.
[tasks."sources:collect"]
description = "Copy the $TESSARO_MACHINE image's GPL, LGPL and AGPL sources into the store on this host and list them in build/sbom/"
dir = "{{config_root}}"
run = 'ruby sbom/sbom.rb sources --machine "$TESSARO_MACHINE" --build-dir "$KAS_BUILD_DIR" --store "${TESSARO_SOURCES_DIR:-/srv/tessaro/sources}" --out "build/sbom/$TESSARO_MACHINE"'

[tasks."sbom:test"]
description = "Run the SBOM tool's unit tests"
dir = "{{config_root}}/sbom"
run = "ruby -Ilib -e 'Dir[\"test/*_test.rb\"].sort.each { require File.expand_path(_1) }'"

[tasks."qemu:unpack"]
description = "Decompress the built .wic (or, on a Mac, the pulled one) so QEMU can boot it"
dir = "{{config_root}}"
run = '''
# A Mac builds nothing: it boots what `mise run image:pull` put in the repo
# root, or the file TESSARO_QEMU_IMAGE names, a release's .wic.zst say
# (scripts/qemu-arm64.sh).
if [ "$(uname -s)" = "Darwin" ]; then
    image=${TESSARO_QEMU_IMAGE:-$(basename "$WIC")}
    image=${image%.zst}
else
    cd "$KAS_BUILD_DIR"
    image=$WIC
fi
if [ -f "$image.zst" ] && [ ! "$image" -nt "$image.zst" ]; then
    zstd -dcf "$image.zst" > "$image"
fi
[ -f "$image" ] || { echo "$image not found - run 'mise run image:build' (or image:pull) first" >&2; exit 1; }
'''

[tasks."qemu:run"]
description = "Boot the qemux86-64 or genericarm64 image in QEMU with the serial console on this terminal, or --count N devices on one network"
dir = "{{config_root}}"
depends = ["qemu:unpack"]
raw = true
usage = '''
flag "--count <n>" default="1" help="Boot N devices on one network the host sees them on over mDNS (Linux: a bridge built under sudo for the run), serial consoles to build/qemu-devices/"
'''
run = '''
count={{ usage.count | default(value="1") }}
[ "$count" = 1 ] || exec sh scripts/qemu-devices.sh window "$count"
# genericarm64 boots on Linux and on a Mac (HVF, a window and CoreAudio).
[ "$TESSARO_MACHINE" = "genericarm64" ] && exec sh scripts/qemu-arm64.sh window
[ "$TESSARO_MACHINE" = "qemux86-64" ] || {
    echo "qemu:run only works for qemux86-64 and genericarm64, not $TESSARO_MACHINE" >&2
    exit 1
}
# /dev/kvm is root:kvm 0660. The kas entrypoint drops to the "builder" user
# via gosu, which rebuilds supplementary groups from the container's
# /etc/group - so "--group-add" is discarded. Overriding GROUP_ID instead
# makes the kvm gid builder's *primary* group, which survives gosu.
if [ -e /dev/kvm ]; then
    KVM_RUNTIME="--device /dev/kvm -e GROUP_ID=$(stat -c %g /dev/kvm)"
    KVM_OPT="kvm"
else
    KVM_RUNTIME=""
    KVM_OPT=""
fi
# The guest GPU is virtio-vga-gl, which is virgl backed by a real render node
# on the host. Only the kvm gid survives gosu (see above), so the render node
# is reached via mode 0666 from a udev rule rather than group membership.
# Without /dev/dri the kiosk browser cannot allocate a buffer and paints
# nothing; everything else still boots fine.
if [ -d /dev/dri ]; then
    GPU_RUNTIME="--device /dev/dri"
    GPU_OPT="egl-headless"
else
    echo "warning: no /dev/dri on the host - Weston will start but the kiosk" >&2
    echo "         browser will not render. See docs/build.md." >&2
    GPU_RUNTIME=""
    GPU_OPT="nographic"
fi
# --network=host, so runqemu's slirp forwards (127.0.0.1:2222 ssh,
# 127.0.0.1:7401 tessaro-ctl - QB_SLIRP_OPT in kas/machine/qemux86-64.yml)
# are the host's loopback and not the container's.
kas-container --runtime-args "$KVM_RUNTIME $GPU_RUNTIME --network=host" shell $KAS_CONFIG \
    -c "runqemu $WIC ovmf slirp snapshot $KVM_OPT $GPU_OPT serialstdio"
'''

[tasks."qemu:vnc"]
description = "Boot the qemux86-64 or genericarm64 image in QEMU with a VNC display on localhost:5901, or --count N devices on one network (5901 up)"
dir = "{{config_root}}"
depends = ["qemu:unpack"]
raw = true
usage = '''
flag "--count <n>" default="1" help="Boot N devices on one network the host sees them on over mDNS (Linux: a bridge built under sudo for the run), device n's VNC on localhost:590n"
'''
run = '''
count={{ usage.count | default(value="1") }}
[ "$count" = 1 ] || exec sh scripts/qemu-devices.sh vnc "$count"
[ "$TESSARO_MACHINE" = "genericarm64" ] && exec sh scripts/qemu-arm64.sh vnc
[ "$TESSARO_MACHINE" = "qemux86-64" ] || {
    echo "qemu:vnc only works for qemux86-64 and genericarm64, not $TESSARO_MACHINE" >&2
    exit 1
}
# /dev/kvm is root:kvm 0660. The kas entrypoint drops to the "builder" user
# via gosu, which rebuilds supplementary groups from the container's
# /etc/group - so "--group-add" is discarded. Overriding GROUP_ID instead
# makes the kvm gid builder's *primary* group, which survives gosu.
if [ -e /dev/kvm ]; then
    KVM_RUNTIME="--device /dev/kvm -e GROUP_ID=$(stat -c %g /dev/kvm)"
    KVM_OPT="kvm"
else
    KVM_RUNTIME=""
    KVM_OPT=""
fi
# See qemu:run for why this is --device plus a 0666 udev rule. QEMU's
# egl-headless display renders through the host GPU and is documented to be
# combinable with -vnc. Without a GPU, nographic keeps runqemu from looking
# for a gtk or sdl window; -vnc works next to it all the same.
if [ -d /dev/dri ]; then
    GPU_RUNTIME="--device /dev/dri"
    GPU_OPT="egl-headless"
else
    echo "warning: no /dev/dri on the host - the kiosk browser will not" >&2
    echo "         render over VNC. See docs/build.md." >&2
    GPU_RUNTIME=""
    GPU_OPT="nographic"
fi
# --network=host as in qemu:run: the ssh and tessaro-ctl forwards reach the
# host, and VNC display 1 is the host's 127.0.0.1:5901 with no -p needed.
# Not runqemu's publicvnc: that is display 0 on every interface, and
# something else on the build host already holds 5900.
# The display asks for the password "tessaro", given as a secret object so
# no monitor command is needed; VNC's password auth reads 8 characters at most.
kas-container --runtime-args "$KVM_RUNTIME $GPU_RUNTIME --network=host" shell $KAS_CONFIG \
    -c "runqemu $WIC ovmf slirp snapshot $KVM_OPT $GPU_OPT serialstdio qemuparams='-object secret,id=vncpw,data=tessaro -vnc 127.0.0.1:1,password-secret=vncpw'"
'''

# On a Mac the guest is on macOS's shared vmnet network, where mDNS reaches it
# (QEMU runs under sudo); --no-vmnet is scripts/qemu-arm64.sh's
# TESSARO_QEMU_NET=user, slirp with the 127.0.0.1 forwards. Linux has slirp
# for one device, and the bridge scripts/qemu-net.sh builds for --count N.
# IMAGE is its TESSARO_QEMU_IMAGE: a Mac boots a downloaded release image
# without the build host.
[tasks."qemu:run:arm64"]
description = "Boot the genericarm64 image (on a Mac under HVF in a window, pulled or downloaded), serial console on this terminal, or --count N devices on one network"
dir = "{{config_root}}"
raw = true
usage = '''
arg "[image]" help="macOS: a genericarm64 .wic.zst or .wic to boot, a release's say (default: the one image:pull fetched)"
flag "--no-vmnet" help="macOS: slirp with the 127.0.0.1:7401 and :2222 forwards, no sudo, in place of vmnet and mDNS"
flag "--count <n>" default="1" help="Boot N devices on one network the host sees them on over mDNS, serial consoles to build/qemu-devices/"
'''
run = '''
[ "{{ usage.no_vmnet | default(value='false') }}" = "true" ] && export TESSARO_QEMU_NET=user
image={{ usage.image | default(value="") | quote }}
if [ -n "$image" ]; then
    case "$image" in /*) ;; *) image="$MISE_ORIGINAL_CWD/$image" ;; esac
    export TESSARO_QEMU_IMAGE="$image"
fi
TESSARO_MACHINE=genericarm64 exec mise run qemu:run --count {{ usage.count | default(value="1") }}
'''

[tasks."qemu:vnc:arm64"]
description = "Boot the genericarm64 image with a VNC display on localhost:5901, or --count N devices on one network (5901 up)"
dir = "{{config_root}}"
raw = true
usage = '''
arg "[image]" help="macOS: a genericarm64 .wic.zst or .wic to boot, a release's say (default: the one image:pull fetched)"
flag "--no-vmnet" help="macOS: slirp with the 127.0.0.1:7401 and :2222 forwards, no sudo, in place of vmnet and mDNS"
flag "--count <n>" default="1" help="Boot N devices on one network the host sees them on over mDNS, device n's VNC on localhost:590n"
'''
run = '''
[ "{{ usage.no_vmnet | default(value='false') }}" = "true" ] && export TESSARO_QEMU_NET=user
image={{ usage.image | default(value="") | quote }}
if [ -n "$image" ]; then
    case "$image" in /*) ;; *) image="$MISE_ORIGINAL_CWD/$image" ;; esac
    export TESSARO_QEMU_IMAGE="$image"
fi
TESSARO_MACHINE=genericarm64 exec mise run qemu:vnc --count {{ usage.count | default(value="1") }}
'''

# A fake USB webcam for the qemu VM: test/usbcam/usbcam.rb serves a UVC camera
# over USB/IP on this host, playing a clip (looped), a Mac's camera (--live)
# or ffmpeg's test pattern, and the guest attaches it through vhci-hcd. On
# slirp the guest reaches this host as 10.0.2.2 and is reached on the
# 127.0.0.1:2222 forward; on a Mac's vmnet (qemu:run:arm64) it is reached at
# its DHCP lease or --vm, and reaches this host at its default gateway, the
# Mac's bridge address the server then listens on. QEMU emulates no camera;
# see docs/camera.md, Testing in qemu.
[tasks."usbcam:run"]
description = "Serve a fake USB webcam playing a clip or this Mac's camera over USB/IP, and attach it to the qemu:run/qemu:vnc VM with --attach"
dir = "{{config_root}}"
raw = true
usage = '''
arg "[clip]" help="A video file to loop; without one, a moving test pattern"
flag "--live" help="macOS: stream this Mac's built-in camera instead of a clip"
flag "--port <port>" default="3240" help="The USB/IP port"
flag "--attach" help="Also attach it in the VM, and detach it on exit"
flag "--vm <address>" help="With --attach: the VM's address on vmnet; by default the 127.0.0.1:2222 forward, else the Mac's DHCP lease for its MAC"
'''
run = '''
set -eu
case "$TESSARO_MACHINE" in
    qemux86-64|genericarm64) ;;
    *)
        echo "usbcam:run only works for qemux86-64 and genericarm64, not $TESSARO_MACHINE" >&2
        exit 1
        ;;
esac
command -v ffmpeg >/dev/null || { echo "usbcam:run needs ffmpeg on this host" >&2; exit 1; }

clip={{ usage.clip | default(value="") | quote }}
port={{ usage.port | default(value="3240") | quote }}
set -- --port "$port"
[ "{{ usage.live | default(value='false') }}" = "true" ] && set -- "$@" --live=0
[ -n "$clip" ] && set -- "$@" "$(realpath "$clip")"

if [ "{{ usage.attach | default(value='false') }}" != "true" ]; then
    exec ruby test/usbcam/usbcam.rb "$@"
fi

# The VM of qemu:run and qemu:vnc over SSH, at ssh_host:ssh_port. The
# unclaimed image has an empty root password.
guest() {
    ssh -p "$ssh_port" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        -o BatchMode=yes -o LogLevel=ERROR -o ConnectTimeout=5 "root@$ssh_host" "$@"
}
# The address the Mac's DHCP gave MAC on vmnet, written there without
# leading zeros (52:54:0:12:34:56), as in scripts/qemu-devices.sh.
lease() {
    short=$(echo "$1" | awk -F: '{ for (i = 1; i <= NF; i++) { sub(/^0/, "", $i); printf "%s%s", $i, (i < NF ? ":" : "") } }')
    awk -v mac="1,$short" '
        /ip_address=/ { ip = substr($0, index($0, "=") + 1) }
        /hw_address=/ { if (substr($0, index($0, "=") + 1) == mac) found = ip }
        END { print found }' /var/db/dhcpd_leases 2>/dev/null || true
}
vm_address={{ usage.vm | default(value="") | quote }}
ssh_host=127.0.0.1 ssh_port=2222
if [ -n "$vm_address" ]; then
    ssh_host=$vm_address ssh_port=22
elif ! guest true 2>/dev/null && [ "$(uname -s)" = Darwin ]; then
    # QEMU's own MAC, unless qemu-arm64.sh was given one.
    vm_address=$(lease "${TESSARO_QEMU_MAC:-52:54:00:12:34:56}")
    [ -n "$vm_address" ] && ssh_host=$vm_address ssh_port=22
fi
guest true 2>/dev/null || {
    case "$TESSARO_MACHINE" in
        genericarm64) vm="mise run qemu:run:arm64" ;;
        *) vm="mise run qemu:run" ;;
    esac
    echo "no VM answers SSH on $ssh_host:$ssh_port; start one with: $vm, or name it with --vm" >&2
    exit 1
}
guest 'command -v usbip' >/dev/null || {
    echo "the VM's image has no usbip; rebuild it with usbip-tools (docs/camera.md, Testing in qemu)" >&2
    exit 1
}
# Where the guest finds this host: slirp's alias, or on vmnet its gateway,
# the Mac's address on the bridge, which the server listens on alone.
if [ "$ssh_port" = 2222 ]; then
    listen=127.0.0.1 remote=10.0.2.2
else
    remote=$(guest "ip route show default | awk '{ print \$3; exit }'")
    [ -n "$remote" ] || { echo "the VM at $ssh_host has no default route" >&2; exit 1; }
    listen=$remote
fi
# Its log is a file, which the attach waits on and tail shows: mise runs this
# with sh, which has no process substitution to tee it.
log=$(mktemp)
ruby test/usbcam/usbcam.rb --host "$listen" "$@" 2>"$log" &
server=$!
tail -n +1 -f "$log" >&2 &
shown=$!
detach() {
    guest 'usbip port | sed -n "s/^Port \([0-9]*\): .*/\1/p" | xargs -r -n1 usbip detach -p' || true
    kill "$server" 2>/dev/null || true
    wait "$server" 2>/dev/null || true
    kill "$shown" 2>/dev/null || true
    rm -f "$log"
}
trap detach EXIT INT TERM
until grep -q '^usbcam: listening on' "$log"; do
    kill -0 "$server" 2>/dev/null || exit 1
    sleep 0.2
done
guest "modprobe vhci-hcd && usbip --tcp-port $port attach -r $remote -b 1-1"
echo "attached; the VM's tessaro-ctl camera list shows it. Ctrl-C detaches." >&2
wait "$server"
'''

[tasks."usbcam:test"]
description = "Run the fake webcam's unit tests"
dir = "{{config_root}}/test/usbcam"
run = "ruby -Ilib -e 'Dir[\"test/*_test.rb\"].sort.each { require File.expand_path(_1) }'"

# A fake USB barcode scanner for the qemu VM: test/usbscanner/usbscanner.rb
# serves a keyboard, HID POS or CDC ACM serial scanner over USB/IP on this
# host, the way usbcam:run serves its camera, and the guest attaches it
# through vhci-hcd. A scan is a line on the control port; see
# docs/scanners.md, Testing in qemu.
[tasks."usbscanner:run"]
description = "Serve a fake USB barcode scanner over USB/IP, and attach it to the qemu:run/qemu:vnc VM with --attach"
dir = "{{config_root}}"
raw = true
usage = '''
flag "--mode <mode>" default="keyboard" help="keyboard, hidpos or serial" {
    choices "keyboard" "hidpos" "serial"
}
flag "--port <port>" default="3241" help="The USB/IP port"
flag "--control <port>" default="3242" help="The port on 127.0.0.1 that takes a scan per line"
flag "--scan <text>" help="Scan this once attached, and again every --every seconds"
flag "--every <seconds>" help="With --scan: seconds between scans"
flag "--attach" help="Also attach it in the VM on the 127.0.0.1:2222 forward, and detach it on exit"
'''
run = '''
set -eu
case "$TESSARO_MACHINE" in
    qemux86-64|genericarm64) ;;
    *)
        echo "usbscanner:run only works for qemux86-64 and genericarm64, not $TESSARO_MACHINE" >&2
        exit 1
        ;;
esac

port={{ usage.port | default(value="3241") | quote }}
set -- --mode {{ usage.mode | default(value="keyboard") | quote }} --port "$port" \
    --control {{ usage.control | default(value="3242") | quote }}
scan={{ usage.scan | default(value="") | quote }}
every={{ usage.every | default(value="") | quote }}
[ -n "$scan" ] && set -- "$@" --scan "$scan"
[ -n "$every" ] && set -- "$@" --every "$every"

if [ "{{ usage.attach | default(value='false') }}" != "true" ]; then
    exec ruby test/usbscanner/usbscanner.rb "$@"
fi

# The VM of qemu:run and qemu:vnc over its SSH forward. The unclaimed image
# has an empty root password.
guest() {
    ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        -o BatchMode=yes -o LogLevel=ERROR -o ConnectTimeout=5 root@127.0.0.1 "$@"
}
guest true 2>/dev/null || {
    echo "no VM answers SSH on 127.0.0.1:2222; start one with: mise run qemu:run" >&2
    exit 1
}
guest 'command -v usbip' >/dev/null || {
    echo "the VM's image has no usbip; rebuild it with usbip-tools (docs/camera.md, Testing in qemu)" >&2
    exit 1
}
log=$(mktemp)
ruby test/usbscanner/usbscanner.rb "$@" 2>"$log" &
server=$!
tail -n +1 -f "$log" >&2 &
shown=$!
detach() {
    guest 'usbip port | sed -n "s/^Port \([0-9]*\): .*/\1/p" | xargs -r -n1 usbip detach -p' || true
    kill "$server" 2>/dev/null || true
    wait "$server" 2>/dev/null || true
    kill "$shown" 2>/dev/null || true
    rm -f "$log"
}
trap detach EXIT INT TERM
until grep -q '^usbscanner: listening on' "$log"; do
    kill -0 "$server" 2>/dev/null || exit 1
    sleep 0.2
done
guest "modprobe vhci-hcd && usbip --tcp-port $port attach -r 10.0.2.2 -b 1-1"
echo "attached; the VM's tessaro-ctl scanner discover shows it. A line to 127.0.0.1:{{ usage.control | default(value="3242") }} scans it. Ctrl-C detaches." >&2
wait "$server"
'''

[tasks."usbscanner:test"]
description = "Run the fake barcode scanner's unit tests"
dir = "{{config_root}}/test/usbscanner"
run = "ruby -Ilib -e 'Dir[\"test/*_test.rb\"].sort.each { require File.expand_path(_1) }'"

[tasks."dev:tunnel"]
description = "Keep an SSH tunnel to the build host up: its VNC ports here, the local device's SSH there"
dir = "{{config_root}}"
raw = true
run = '''
set -eu
: "${TESSARO_BUILD_HOST:?set it in mise.local.toml}"
: "${TESSARO_BUILD_HOST_CONTAINER_IP:?set it in mise.local.toml}"
: "${TESSARO_DEVICE_IP:?set it in mise.local.toml}"

# localhost:5901 - the build host's loopback VNC (mise run qemu:vnc)
# localhost:5902 - VNC on 5901 of a docker container on the build host
# localhost:7401 - the qemu:run/qemu:vnc VM's tessaro-ctl port (QB_SLIRP_OPT)
# localhost:2222 - the same VM's SSH, for `ssh connect --port 2222`
# build host's localhost:7400 - tessaro-ctl on the device on this machine's network
# build host's localhost:5022 - SSH on the same device
# -M 0 leaves dead-link detection to ServerAlive, which drops the connection
# after 90s of silence so autossh can bring it back.
set -- autossh -N -M 0 -o "ServerAliveInterval 30" -o "ServerAliveCountMax 3" \
    "$TESSARO_BUILD_HOST" \
    -L 5901:127.0.0.1:5901 \
    -L "5902:$TESSARO_BUILD_HOST_CONTAINER_IP:5901" \
    -R 7400:$TESSARO_DEVICE_IP:7400 \
    -L 7401:127.0.0.1:7401 \
    -L 2222:127.0.0.1:2222 \
    -R "5022:$TESSARO_DEVICE_IP:22"
echo "+ $*"
exec "$@"
'''
