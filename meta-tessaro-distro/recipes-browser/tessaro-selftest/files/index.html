<!DOCTYPE html>
<!--
  The welcome page: what a factory image shows at http://127.0.0.1/. The
  self-test is beside it at /selftest.html.

  Styled like maintenance.html and, like it, everything inline: this is the
  page a device shows before anyone has set it up, often with no network.

  The live values - node name, IPv4 addresses, the hotspot's SSID while it is
  up, whether the device is claimed - come from /welcome.json, which
  tessaro-agent keeps current in /run/tessaro-kiosk and nginx serves. The page
  asks for it every 5s; see docs/kiosk-browser.md, "The welcome page".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessaro</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d14;
    --glow-a: #10243a;
    --glow-b: #1d1733;
    --fg: #eaf0f8;
    --dim: #8e9bb0;
    --line: rgba(255, 255, 255, 0.08);
    --card: rgba(255, 255, 255, 0.035);
    --accent: #5cc8ff;
    --accent-2: #9d8cff;
    --ok: #5fe0a6;
    --warn: #ffc66b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: clamp(18px, 4.5vmin, 64px);
    overflow: hidden;
    font-family: system-ui, "DejaVu Sans", "Liberation Sans", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .glow {
    position: fixed;
    width: 90vmax;
    height: 90vmax;
    border-radius: 50%;
    filter: blur(8vmax);
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
  }
  .glow.a {
    background: radial-gradient(circle, var(--glow-a), transparent 65%);
    top: -35vmax;
    left: -25vmax;
    animation: drift-a 38s ease-in-out infinite alternate;
  }
  .glow.b {
    background: radial-gradient(circle, var(--glow-b), transparent 65%);
    bottom: -40vmax;
    right: -30vmax;
    animation: drift-b 46s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate(18vmax, 14vmax); } }
  @keyframes drift-b { to { transform: translate(-16vmax, -12vmax); } }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(14px, 2.8vmin, 34px);
    max-width: 92vw;
  }

  /* A mosaic of tiles - tessera - lighting up in turn. */
  .mark {
    width: clamp(72px, 14vmin, 180px);
    height: auto;
    flex: none;
    filter: drop-shadow(0 0 3vmin rgba(92, 200, 255, 0.25));
  }
  .mark rect { animation: pulse 4.8s ease-in-out infinite; }
  .mark rect:nth-child(2) { animation-delay: 1.2s; }
  .mark rect:nth-child(3) { animation-delay: 3.6s; }
  .mark rect:nth-child(4) { animation-delay: 2.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    25%      { opacity: 1; }
  }

  .product {
    margin: 0;
    font-size: clamp(0.8rem, 2.1vmin, 1.4rem);
    letter-spacing: 0.32em;
    text-transform: lowercase;
    color: var(--dim);
  }

  h1 {
    margin: 0;
    font-weight: 650;
    line-height: 1.08;
    letter-spacing: -0.02em;
    font-size: clamp(2rem, 7.6vmin, 6rem);
    background: linear-gradient(100deg, var(--fg) 30%, var(--accent) 70%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    overflow-wrap: anywhere;
  }

  .card {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: clamp(18px, 4vmin, 56px);
    row-gap: clamp(8px, 1.6vmin, 18px);
    align-items: baseline;
    text-align: left;
    padding: clamp(14px, 3vmin, 36px) clamp(18px, 4.5vmin, 56px);
    border: 1px solid var(--line);
    border-radius: clamp(12px, 2vmin, 22px);
    background: var(--card);
    font-size: clamp(1rem, 3vmin, 2.1rem);
  }
  .card dt {
    color: var(--dim);
    font-size: 0.7em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .card dd {
    margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .card dd .ip { display: block; }
  .card dd .ip small { color: var(--dim); font-size: 0.6em; margin-left: 0.5em; }

  .status { display: inline-flex; align-items: center; gap: 0.5em; }
  .status::before {
    content: "";
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0.8em currentColor;
  }
  .status.claimed   { color: var(--ok); }
  .status.unclaimed { color: var(--warn); }
  .status.unknown   { color: var(--dim); }

  .hint {
    margin: 0;
    color: var(--dim);
    font-size: clamp(0.85rem, 2.2vmin, 1.5rem);
  }
  .hint code {
    font-family: "DejaVu Sans Mono", ui-monospace, monospace;
    color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
    padding: 0.1em 0.45em;
    border-radius: 0.35em;
  }

  .stale { opacity: 0.45; transition: opacity 0.6s; }

  @media (prefers-reduced-motion: reduce) {
    .glow, .mark rect { animation: none; }
  }
</style>
</head>
<body>
<div class="glow a"></div>
<div class="glow b"></div>

<main>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5cc8ff"/>
        <stop offset="1" stop-color="#9d8cff"/>
      </linearGradient>
    </defs>
    <g fill="url(#g)">
      <rect x="4"  y="4"  width="42" height="42" rx="9"/>
      <rect x="54" y="4"  width="42" height="42" rx="9"/>
      <rect x="4"  y="54" width="42" height="42" rx="9"/>
      <rect x="54" y="54" width="42" height="42" rx="9"/>
    </g>
  </svg>

  <p class="product" id="product">tessaro-os</p>
  <h1 id="node">Welcome</h1>

  <dl class="card stale" id="card">
    <dt>IP address</dt>
    <dd id="addresses">-</dd>
    <dt class="hotspot" hidden>Hotspot</dt>
    <dd class="hotspot" id="hotspot" hidden></dd>
    <dt>Status</dt>
    <dd><span class="status unknown" id="claim">Starting</span></dd>
  </dl>

  <p class="hint" id="hint" hidden>Set it up with <code id="claim-cmd"></code></p>
</main>

<script>
  // Polls /welcome.json and fills the page. Everything goes in through
  // textContent, never as markup. When the endpoint does not answer the last
  // values stay on screen, dimmed.
  (function () {
    var POLL_MS = 5000;

    function el(id) { return document.getElementById(id); }

    function render(s) {
      el("product").textContent = s.product || "tessaro-os";
      el("node").textContent = s.node || "-";
      document.title = (s.node || "Tessaro") + " - " + (s.product || "tessaro-os");

      var list = el("addresses");
      list.textContent = "";
      var addrs = s.addresses || [];
      if (!addrs.length) {
        list.textContent = "No network";
      }
      addrs.forEach(function (a) {
        var row = document.createElement("span");
        row.className = "ip";
        row.textContent = a.address;
        if (a.interface) {
          var tag = document.createElement("small");
          tag.textContent = a.interface;
          row.appendChild(tag);
        }
        list.appendChild(row);
      });

      // Only while the device runs its own access point. The SSID alone:
      // the password is a secret and never reaches this file.
      var ssid = s.hotspot && s.hotspot.ssid;
      el("hotspot").textContent = ssid || "";
      document.querySelectorAll(".hotspot").forEach(function (n) { n.hidden = !ssid; });

      var claim = el("claim");
      claim.className = "status " + (s.claimed ? "claimed" : "unclaimed");
      claim.textContent = s.claimed ? "Claimed" : "Not claimed";
      el("claim-cmd").textContent = "tessaro-ctl access claim --node " + (s.node || "NAME");
      el("hint").hidden = !!s.claimed;
    }

    function poll() {
      fetch("/welcome.json", { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
        .then(function (s) { render(s); el("card").classList.remove("stale"); })
        .catch(function () { el("card").classList.add("stale"); })
        .then(function () { setTimeout(poll, POLL_MS); });
    }
    poll();
  })();
</script>
</body>
</html>
