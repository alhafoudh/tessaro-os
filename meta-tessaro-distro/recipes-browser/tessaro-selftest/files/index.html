<!DOCTYPE html>
<!--
  The welcome page: what a factory image shows at http://127.0.0.1/. Its
  button opens the demo, beside it at /demo/ (docs/demo.md).

  Styled like maintenance.html and, like it, everything inline: this is the
  page a device shows before anyone has set it up, often with no network.

  The live values - node name, IPv4 addresses, the hotspot's SSID while it is
  up, whether the device is claimed and online, and the setup QR code while
  the hotspot is open - come from /welcome.json, which tessaro-agent keeps
  current in /run/tessaro-kiosk and nginx serves. The page asks for it every
  5s; see docs/kiosk-browser.md, "The welcome page", and docs/quick-setup.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessaro</title>
<script>
  // Back to the demo after its maintenance round trip, before anything is
  // drawn. The demo turns maintenance on for a few seconds and off again,
  // and off loads browser.url, which is this page; before it goes, it leaves
  // a note in localStorage, which this origin shares, naming the section to
  // come back to. The key and the 120s it is good for are RETURN_KEY and
  // RETURN_FOR in demo/src/features/maintenance.ts. Only a URL on this
  // origin is followed, and a note is used once.
  (function () {
    var KEY = "tessaro.demo.return";
    var FOR_MS = 120000;
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      localStorage.removeItem(KEY);
      var note = JSON.parse(raw);
      var age = Date.now() - note.at;
      if (typeof note.url !== "string" || !(age >= 0 && age < FOR_MS)) return;
      if (new URL(note.url, location.href).origin !== location.origin) return;
      location.replace(note.url);
    } catch (e) {
      // A note that does not parse is dropped; the welcome page stays.
    }
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d14;
    --fg: #eaf0f8;
    --dim: #8e9bb0;
    --line: rgba(255, 255, 255, 0.08);
    --card: rgba(255, 255, 255, 0.035);
    --accent: #5cc8ff;
    --accent-2: #9d8cff;
    --ok: #5fe0a6;
    --warn: #ffc66b;
    --bad: #ff7a7a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: clamp(18px, 4.5vmin, 64px);
    overflow: hidden;
    font-family: system-ui, "DejaVu Sans", "Liberation Sans", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* The desktop wallpaper, redrawn as in maintenance.html, so the page
     appears over the desktop without a change. The glows stand still: a
     drift repaints both full-screen layers every frame, which an integrated
     GPU (an HD 530, measured) cannot do in one 60 Hz refresh. For the same
     reason nothing here uses backdrop-filter. */
  .glow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 1800px;
    height: 1800px;
    margin: -900px 0 0 -900px;
    pointer-events: none;
    z-index: 0;
  }
  .glow.a {
    background: radial-gradient(closest-side, rgba(18, 48, 77, 0.95), rgba(16, 36, 58, 0.35) 60%, rgba(16, 36, 58, 0));
    translate: -400px -340px;
  }
  .glow.b {
    background: radial-gradient(closest-side, rgba(36, 27, 68, 0.95), rgba(29, 23, 51, 0.35) 60%, rgba(29, 23, 51, 0));
    translate: 440px 380px;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle, rgba(184, 200, 230, 0.09) 1.6px, transparent 2.1px)
      calc(50% + 20px) calc(50% + 20px) / 40px 40px;
    -webkit-mask-image: radial-gradient(circle 960px, #000, rgba(0, 0, 0, 0.7) 55%, transparent);
    mask-image: radial-gradient(circle 960px, #000, rgba(0, 0, 0, 0.7) 55%, transparent);
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(14px, 2.8vmin, 34px);
    width: min(100%, 1240px);
  }

  /* The Tessaro mark, inline so it also works before network setup. */
  .mark {
    width: clamp(72px, 14vmin, 180px);
    height: auto;
    flex: none;
    filter: drop-shadow(0 0 3vmin rgba(92, 200, 255, 0.25));
  }

  .product {
    margin: 0;
    font-size: clamp(1.25rem, 3.2vmin, 2.25rem);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    color: var(--fg);
  }

  h1 {
    margin: 0;
    font-weight: 650;
    line-height: 1.08;
    letter-spacing: -0.02em;
    font-size: clamp(2rem, 7.6vmin, 6rem);
    background: linear-gradient(100deg, var(--fg) 30%, var(--accent) 70%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    overflow-wrap: anywhere;
  }

  .card {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-content: center;
    margin: 0;
    min-width: 0;
    column-gap: clamp(18px, 4vmin, 56px);
    row-gap: clamp(8px, 1.6vmin, 18px);
    align-items: baseline;
    text-align: left;
    padding: clamp(14px, 3vmin, 36px) clamp(18px, 4.5vmin, 56px);
    border: 1px solid var(--line);
    border-radius: clamp(12px, 2vmin, 22px);
    background: var(--card);
    font-size: clamp(1rem, 3vmin, 2.1rem);
  }
  .card dt {
    color: var(--dim);
    font-size: 0.7em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .card dd {
    margin: 0;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }
  .card dd .ip { display: block; }
  .card dd .ip small { color: var(--dim); font-size: 0.6em; margin-left: 0.5em; }

  .status { display: inline-flex; align-items: center; gap: 0.5em; }
  .status::before {
    content: "";
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0.8em currentColor;
  }
  .status.claimed   { color: var(--ok); }
  .status.unclaimed { color: var(--warn); }
  .status.unknown   { color: var(--dim); }
  .status.online    { color: var(--ok); }
  .status.offline   { color: var(--bad); }

  .panels {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: stretch;
    width: 100%;
    gap: clamp(14px, 3vmin, 40px);
  }

  /* The setup QR: joins a phone to the open hotspot, whose sign-in sheet then
     opens Quick Setup. Its colours are in the SVG itself (qr.rs): the
     logo's gradient on the page's background. */
  .setup {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.6vmin, 18px);
    padding: clamp(14px, 3vmin, 36px);
    border: 1px solid var(--line);
    border-radius: clamp(12px, 2vmin, 22px);
    background: var(--card);
  }
  .setup .hotspot-info { display: grid; gap: 0.35em; max-width: 100%; }
  .setup .hotspot-label {
    color: var(--dim);
    font-size: clamp(0.7rem, 2.1vmin, 1.47rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .setup .hotspot-ssid { font-size: clamp(1rem, 2.6vmin, 1.8rem); overflow-wrap: anywhere; }
  /* A public screen never shows a scrollbar; only a narrow one, where the
     panels stack, may grow past the viewport and scroll. */
  @media (max-width: 700px) {
    body { height: auto; min-height: 100%; overflow: auto; }
    .panels { grid-template-columns: minmax(0, 1fr); grid-auto-rows: 1fr; }
    .card { padding: 24px; column-gap: 18px; }
    .hint { overflow-wrap: anywhere; }
  }
  .panels:not(.has-setup) { grid-template-columns: minmax(0, 1fr); max-width: 660px; }
  .setup[hidden] { display: none; }
  .setup .qr {
    max-width: 100%;
    width: clamp(150px, 30vmin, 360px);
    aspect-ratio: 1;
    border-radius: clamp(6px, 1vmin, 12px);
    overflow: hidden;
  }
  .setup .qr > svg { display: block; width: 100%; height: 100%; }
  .setup .or {
    color: var(--dim);
    font-size: clamp(0.75rem, 1.9vmin, 1.25rem);
    max-width: clamp(150px, 34vmin, 420px);
  }
  .setup .or b { color: var(--fg); font-weight: 600; }

  .hint {
    margin: 0;
    color: var(--dim);
    font-size: clamp(0.85rem, 2.2vmin, 1.5rem);
  }
  .hint code {
    font-family: "DejaVu Sans Mono", ui-monospace, monospace;
    color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
    padding: 0.1em 0.45em;
    border-radius: 0.35em;
  }

  /* The claim hint and the way into the demo share a row, so the page
     still fits a screen with the setup QR up. */
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vmin, 24px) clamp(18px, 3.4vmin, 48px);
  }

  /* The way into the demo, the demo's own primary button made large. */
  .demo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
    min-height: clamp(2.9rem, 6.4vmin, 4.6rem);
    padding: 0 clamp(1.4rem, 3.6vmin, 2.8rem);
    border-radius: 999px;
    background: linear-gradient(110deg, var(--accent), var(--accent-2));
    color: #071019;
    font-size: clamp(1rem, 2.5vmin, 1.75rem);
    font-weight: 650;
    letter-spacing: 0.01em;
    text-decoration: none;
    white-space: nowrap;
    transition: transform 120ms ease;
  }
  .demo:active { transform: scale(0.97); }
  .demo svg { width: 0.9em; height: 0.9em; flex: none; }

  .stale { opacity: 0.45; transition: opacity 0.6s; }

  /* The waves of the QR's Wi-Fi icon (qr-wifi.svg) light up inner first,
     then outer. The inner one runs ahead rather than the outer one starting
     late, since a positive delay shows it at full opacity until it starts. */
  .wifi-wave {
    animation: wifi-pulse 4.8s ease-in-out infinite;
  }
  .wifi-wave.inner { animation-delay: -0.7s; }
  @keyframes wifi-pulse {
    0%, 75%, 100% { opacity: 0.12; }
    30% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wifi-wave { animation: none; }
  }
</style>
</head>
<body>
<div class="glow a"></div>
<div class="glow b"></div>

<main>
  <svg class="mark" viewBox="92 92 840 840" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tessaro-accent" gradientUnits="userSpaceOnUse" x1="225" y1="103" x2="800" y2="921">
        <stop offset="0" stop-color="#5cc8ff"/>
        <stop offset="1" stop-color="#9d8cff"/>
      </linearGradient>
    </defs>
    <path d="M308.767 102.931C313.925 102.445 346.202 106.327 353.317 107.05L472.739 119.638L581.247 131.121L615.042 134.659C633.056 136.544 644.566 136.798 659.093 149.049C674.065 161.667 679.159 179.99 686.583 197.579L716.435 268.312L769.913 396.001L786.875 437.202C789.898 444.592 794.677 455.536 796.908 462.963C799.369 471.439 799.666 480.398 797.762 489.017C792.544 512.094 777.288 519.568 759.076 530.485C749.266 536.289 739.517 542.193 729.83 548.196L689.464 572.663C681.805 577.312 674.078 582.257 666.277 586.337C658.086 590.627 651.286 590.528 643.021 586.844C630.237 581.145 617.255 574.635 604.688 568.509L529.555 531.604L482.666 508.478C464.404 499.453 448.412 493.291 438.613 473.765C430.218 457.035 422.473 439.981 414.516 423.036L370.311 329.478L310.679 204.328L293.195 167.47C290.66 162.122 287.81 156.879 285.368 151.494C275.345 129.387 282.801 106.749 308.767 102.931ZM419.507 186.07C411.505 185.424 397.725 183.924 390.204 184.468C386.721 186.013 384.379 187.166 382.774 190.861C380.745 195.529 382.404 201.511 384.474 205.952C389.422 216.567 394.82 227.051 399.829 237.661L453.956 350.601L482.248 410.075C486.587 419.17 491.061 429.008 495.755 437.821C498.974 443.864 508.352 449.408 515.09 449.358C527.231 449.685 539.384 449.659 551.525 449.757L627.702 450.277C648.226 450.63 668.743 450.835 689.26 450.891C698.211 450.935 711.093 451.358 719.704 450.77C730.083 446.941 729.484 439.547 725.824 430.594C719.513 415.137 712.991 399.767 706.525 384.374L667.036 291.195L645.956 241.691C642.167 232.797 638.538 223.563 634.113 214.995C629.798 206.63 622.59 202.512 613.416 201.785C598.932 200.637 584.442 199.649 569.971 198.458L469.127 190.11L419.507 186.07Z" fill="url(#tessaro-accent)"/>
    <path d="M253.183 165.881C256.657 166.073 258.292 165.995 259.97 169.477C264.058 177.953 267.929 186.547 271.856 195.098L297.308 250.842L381.614 435.203L402.352 481.005C418.894 517.613 417.402 515.98 453.611 533.846L495.953 554.712L624.803 618.403C635.997 623.925 664.548 636.912 673.143 643.207C680.414 648.489 686.174 655.582 689.85 663.776C696.329 678.426 694.553 699.329 694.559 715.364L694.541 778.258L694.565 838.739C694.59 848.603 695.091 863.574 694.38 873.166C693.959 878.583 692.709 883.908 690.667 888.948C685.048 902.906 675.104 911.861 661.472 917.655C646.813 922.683 612.649 920.741 595.806 920.747L489.127 920.76L417.65 920.803C408.726 920.809 388.541 921.341 380.407 920.166C371.147 918.768 362.466 914.804 355.354 908.713C332.929 889.344 337.397 863.049 337.46 836.451L337.677 761.715L338.595 631.352C338.673 604.977 340.29 574.495 335.443 548.812C333.607 539.084 328.338 525.238 324.913 515.547L310.278 474.057C291.954 421.286 273.039 368.722 253.537 316.375L238.871 278.493C232.353 261.755 219.654 235.882 227.458 218.881C232.158 208.642 246.853 172.994 253.183 165.881Z" fill="url(#tessaro-accent)"/>
  </svg>

  <p class="product" id="product">tessaro-os</p>
  <h1 id="node">Welcome</h1>

  <div class="panels stale" id="panels">
    <dl class="card" id="card">
      <dt>IP address</dt>
      <dd id="addresses">-</dd>
      <dt class="hotspot" hidden>Hotspot</dt>
      <dd class="hotspot" id="hotspot-fallback" hidden></dd>
      <dt>Internet</dt>
      <dd><span class="status unknown" id="online">Checking</span></dd>
      <dt>Status</dt>
      <dd><span class="status unknown" id="claim">Starting</span></dd>
    </dl>

    <div class="setup" id="setup" hidden>
      <div class="hotspot-info"><span class="hotspot-label">Hotspot</span><span class="hotspot-ssid" id="hotspot"></span></div>
      <div class="qr" id="qr"></div>
      <div class="or">Once connected, open <b id="setup-url"></b></div>
    </div>
  </div>

  <div class="actions">
    <p class="hint" id="hint" hidden>Set it up with <code id="claim-cmd"></code></p>
    <a class="demo" id="demo" href="/demo/">Explore the demo
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</main>

<script>
  // Polls /welcome.json and fills the page. Everything goes in through
  // textContent, never as markup - except the QR code, an SVG the agent draws
  // from numeric geometry and a bundled Wi-Fi icon (qr.rs). When the
  // endpoint does not answer, the last values stay on screen, dimmed.
  (function () {
    var POLL_MS = 5000;
    var shownQr = null;

    function el(id) { return document.getElementById(id); }

    function render(s) {
      el("product").textContent = s.product || "tessaro-os";
      el("node").textContent = s.node || "-";
      document.title = (s.node || "Tessaro") + " - " + (s.product || "tessaro-os");

      var list = el("addresses");
      list.textContent = "";
      var addrs = s.addresses || [];
      if (!addrs.length) {
        list.textContent = "No network";
      }
      addrs.forEach(function (a) {
        var row = document.createElement("span");
        row.className = "ip";
        row.textContent = a.address;
        if (a.interface) {
          var tag = document.createElement("small");
          tag.textContent = a.interface;
          row.appendChild(tag);
        }
        list.appendChild(row);
      });

      // Only while the device runs its own access point. The SSID alone:
      // the password is a secret and never reaches this file.
      var ssid = s.hotspot && s.hotspot.ssid;
      el("hotspot").textContent = ssid || "";
      el("hotspot-fallback").textContent = ssid || "";
      document.querySelectorAll(".hotspot").forEach(function (n) { n.hidden = !ssid || !!s.setup; });

      var claim = el("claim");
      claim.className = "status " + (s.claimed ? "claimed" : "unclaimed");
      claim.textContent = s.claimed ? "Claimed" : "Not claimed";
      el("claim-cmd").textContent = "tessaro-ctl access claim --node " + (s.node || "NAME");
      el("hint").hidden = !!s.claimed;

      // Whether the agent's last lookup of the public address answered;
      // null until it has tried.
      var online = el("online");
      online.className = "status " + (s.online === true ? "online" : s.online === false ? "offline" : "unknown");
      online.textContent = s.online === true ? "Online" : s.online === false ? "Offline" : "Checking";

      // Only while the device is unclaimed with its hotspot up, which is when
      // the hotspot is open and the QR carries no password.
      var setup = s.setup;
      el("setup").hidden = !setup;
      el("panels").classList.toggle("has-setup", !!setup);
      if (setup) {
        if (setup.qr !== shownQr) {
          el("qr").innerHTML = setup.qr;
          shownQr = setup.qr;
        }
        el("setup-url").textContent = setup.url;
      }
    }

    function poll() {
      fetch("/welcome.json", { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
        .then(function (s) { render(s); el("panels").classList.remove("stale"); })
        .catch(function () { el("panels").classList.add("stale"); })
        .then(function () { setTimeout(poll, POLL_MS); });
    }
    poll();
  })();
</script>
</body>
</html>
