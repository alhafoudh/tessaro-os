# Tessaro's local pages - the welcome page at /, the demo at /demo/, the
# maintenance page and the playlist player at /player.html - served on the
# loopback.
#
# Installed to /usr/lib/nginx/conf.d/, not /etc/nginx/conf.d/: /etc is an
# overlayfs upper on /data, so the first on-device write to a file there
# shadows the image's copy for good. The nginx bbappend in this layer adds the
# /usr/lib include to nginx.conf and removes the stock default_server, which
# would otherwise answer on every interface with the nginx welcome page.
#
# To override any of this on a device, drop a file in /etc/nginx/conf.d/ - it
# is included after this one - and `systemctl reload nginx`.

server {
    # 127.0.0.1 and nothing else. A kiosk has no business serving anything to
    # the network, and this is also what makes the origin a *potentially
    # trustworthy* one in Chromium's sense: http://127.0.0.1 is a secure
    # context, so navigator.serial and navigator.hid exist on the page, and it
    # is a real origin, so SerialAllowAllPortsForUrls can name it. Neither is
    # true of a file:// URL.
    #
    # default_server so this answers whatever Host: the browser sends. There is
    # no other server block, and the stock one is gone.
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /usr/share/tessaro-selftest;
    index index.html;

    # Off deliberately. /var/log is volatile on this image, but the page's own
    # media is a handful of requests per load and a technician reading
    # `journalctl -fu tessaro-agent` is not helped by a second log of them.
    access_log off;

    # The page and its media change only with the image (the file store
    # below has its own rule). Caching them would mean a technician reloading after an
    # update and seeing the old page, which is the one confusing outcome worth
    # ruling out on a diagnostic tool.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The demo (tessaro-demo, docs/demo.md), opened from the welcome page.
    # On this origin, not a server of its own, so it has the device grants
    # and the page bridge the welcome page has. No add_header here, so the
    # server-wide no-store applies, as to the other pages.
    location /demo/ {
        alias /usr/share/tessaro-demo/;
    }

    # The welcome page's live values, written by the agent whenever one of
    # them changes. Only this one file of the agent's run directory is
    # reachable; the server-wide no-store applies, so every poll is fresh.
    location = /welcome.json {
        alias /run/tessaro-kiosk/welcome.json;
        default_type application/json;
    }

    # The playlist the player page (/player.html) shows, written by the
    # agent whenever what plays changes; it then calls the page's reload(),
    # and the page reads this with no-store. Like welcome.json, the one file
    # of the run directory it needs and the server-wide no-store.
    location = /playlist.json {
        alias /run/tessaro-kiosk/playlist.json;
        default_type application/json;
    }

    # The offline page the agent stages in its run directory, for the player
    # to lay over the screen while nothing in its playlist can be played.
    # The same page the browser is sent to when the kiosk site is down.
    location = /offline.html {
        alias /run/tessaro-kiosk/index.html;
        default_type text/html;
    }

    # The playlists' media, fetched by the agent into /data/tessaro/media-cache
    # so a playlist plays from local copies with the network down. The agent
    # names each file after a hash of its URL and puts that path in
    # playlist.json; the same hardening as the file store below, for the same
    # reasons.
    location /media-cache/ {
        alias /data/tessaro/media-cache/;
        autoindex off;
        disable_symlinks on;
        add_header Access-Control-Allow-Origin "*" always;
        # A file here never changes under its name - a new URL is a new
        # hash - so revalidating costs one 304, and a video is not read
        # again on every turn of the playlist.
        add_header Cache-Control "no-cache" always;
    }

    # The file store: /data/files, filled only by `tessaro-ctl files`
    # through the agent. Here because this is the one server on
    # 127.0.0.1:80, not because it belongs to the welcome page.
    location /files/ {
        alias /data/files/;
        # Nothing enumerates the store over HTTP; a page knows what it asked
        # to have put there.
        autoindex off;
        # The agent never makes a symlink; one made by hand must not reach
        # outside the store.
        disable_symlinks on;
        # A location's add_header replaces the server's rather than adding to
        # it, so both are stated here. The origin is open because the files
        # are the kiosk site's content, and that site is on another origin;
        # nothing in the store is secret from a page this device shows.
        add_header Access-Control-Allow-Origin "*" always;
        # Revalidated on every use, not never cached: `tessaro-ctl files
        # sync` changes what is here, and the ETag keeps a video that did
        # not change from being read again.
        add_header Cache-Control "no-cache" always;
    }
}
