<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Tighten cog's own system bus policy.

  cog ships /usr/share/dbus-1/system.d/com.igalia.Cog.conf, which allows
  context="default" - any local user - to send to the destination.
  com.igalia.Cog exports a "quit" action, so as shipped any local user can kill
  the kiosk, and an "open" action, so any local user can point it anywhere.

  Two things about this file are easy to get wrong, and both were got wrong
  first time round:

  1. It has to be parsed after cog's, because both set context="default" rules
     for the same destination and the later one wins. It lives in
     /etc/dbus-1/system.d rather than beside cog's file for that reason:
     dbus-1's system.conf lists

         <includedir>system.d</includedir>
         <includedir>/etc/dbus-1/system.d</includedir>

     in that order, so everything here is parsed after everything there,
     whatever order the files inside each directory come back in. The first
     version of this file tried to win by sorting, as
     /usr/share/dbus-1/system.d/zz-tessaro-kiosk.conf; dbus does not promise
     that order, so the directory is the only real guarantee.

  2. No XML comment here may contain two consecutive dashes. That is not a
     style rule, it is XML: a comment ends at the first such pair. The first
     version pasted a busctl command line, complete with its long options, into
     this comment - which made the whole file malformed, so dbus discarded it
     and the policy silently did nothing. That is why the verification command
     below is described rather than quoted. Check the journal for a parse error
     after changing this file:

         journalctl -b -u dbus

  Verify the policy itself on a device by running, as the unprivileged user
  "nobody" via su, a busctl call on the system bus that pings
  com.igalia.Cog at /com/igalia/Cog on the org.freedesktop.DBus.Peer interface.
  It must be rejected, and the same call as root must succeed.

  The user= rules below are belt and braces: dbus evaluates user= policies after
  every context="default" rule regardless of file order, so they are what keeps
  the deny from locking out the watchdog and the browser itself.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="com.igalia.Cog"/>
  </policy>

  <!-- The watchdog. -->
  <policy user="root">
    <allow send_destination="com.igalia.Cog"/>
  </policy>

  <!-- The browser, which owns the name (COG_DBUS_OWN_USER in tessaro.conf). -->
  <policy user="weston">
    <allow send_destination="com.igalia.Cog"/>
  </policy>
</busconfig>
