# Directories the kiosk needs before it starts.
#
# /run/tessaro-kiosk is where tessaro-agent stages the offline page; Chromium
# navigates to it as file://. The browser would fail the navigation without
# it, so it has to exist first. systemd-tmpfiles-setup.service runs
# Before=sysinit.target and every unit with default dependencies comes after
# basic.target, so the ordering is free; both units also name it in After= as
# documentation.
#
# Not RuntimeDirectory= on either unit: that is wiped when its owning unit
# stops, and there is no single owner here - the agent writes the page, the
# browser reads it, and neither may depend on the other (see the comment in
# tessaro-agent.service).
#
# Root owned and not group writable on purpose: the browser runs as weston and
# must not be able to rewrite the page it is being shown.
d /run/tessaro-kiosk 0755 root root -

# The place an operator drops a replacement offline page, and the parent of
# Chromium's profile. Root owned for the same reason /run/tessaro-kiosk above
# is: /data/kiosk/offline.html is one of the pages the agent stages and puts
# on screen, so a weston-owned directory here would hand the browser user
# control of the page it is being shown and undo the rule two lines up.
# Chromium only needs its own --user-data-dir writable, so that gets its own
# entry; tmpfiles re-applies owner and mode for `d` on every boot, so a device
# that already has the wide ownership heals itself.
d /data/kiosk 0755 root root -
d /data/kiosk/chromium 0700 weston weston -

# A valid page from the first moment, in case anything navigates to the
# offline page before the agent has staged one. C only copies when the
# target is absent, so the agent's page is never clobbered.
C /run/tessaro-kiosk/index.html 0644 root root - /usr/share/tessaro-kiosk/offline.html
