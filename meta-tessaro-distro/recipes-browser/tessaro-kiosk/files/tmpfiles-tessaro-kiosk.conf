# Directories the kiosk needs before it starts.
#
# /run/tessaro-kiosk is the --dir-handler root in tessaro-kiosk.service. cog
# validates that path at startup and exits before the main loop if it is
# missing, so it has to exist first. systemd-tmpfiles-setup.service runs
# Before=sysinit.target and every unit with default dependencies comes after
# basic.target, so the ordering is free; both units also name it in After= as
# documentation.
#
# Not RuntimeDirectory= on either unit: that is wiped when its owning unit
# stops, and there is no single owner here - the watchdog writes the page, the
# browser reads it, and neither may depend on the other (see the comment in
# tessaro-kiosk-watchdog.service).
#
# Root owned and not group writable on purpose: the browser runs as weston and
# must not be able to rewrite the page it is being shown.
d /run/tessaro-kiosk 0755 root root -

# Where an operator drops a replacement offline page. Created so the path is
# discoverable on a device that has never had one.
d /data/kiosk 0755 root root -

# A valid page from the first moment, in case anything navigates to
# tessaro:///index.html before the watchdog has staged one. C only copies when
# the target is absent, so the watchdog's page is never clobbered.
C /run/tessaro-kiosk/index.html 0644 root root - /usr/share/tessaro-kiosk/offline.html
