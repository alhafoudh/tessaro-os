# The directory of the setup portal's API socket, /run/tessaro-portal/api.sock.
#
# root:www 0750 is the socket's only protection: the agent makes the socket
# itself open to all, and only root and nginx's workers (user www, its own
# group) can walk into this directory. The browser, which runs as weston, and
# every other user cannot. The agent never makes the directory, so without
# this line there is no portal rather than an open socket.
d /run/tessaro-portal 0750 root www -
