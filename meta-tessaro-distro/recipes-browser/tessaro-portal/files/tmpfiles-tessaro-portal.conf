# The directory of the captive flag, /run/tessaro-portal/captive, which the
# agent keeps and nginx looks for on every probe (20-tessaro-portal.conf).
#
# root:www 0750: nginx's workers (user www, its own group) can read it, and
# only root can write. The agent never makes the directory, so without this
# line there is no captive portal.
d /run/tessaro-portal 0750 root www -
