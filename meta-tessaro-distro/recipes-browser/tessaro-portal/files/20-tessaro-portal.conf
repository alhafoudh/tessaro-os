# The captive portal, for phones on the hotspot. See docs/setup-portal.md.
#
# Only the phones' connectivity probes and a typed http://10.42.0.1/ come
# here. The setup page and its API are the agent's, on port 7400 over TLS
# (agent/tessaro-agent/src/api/), and this server only sends phones there.
#
# Installed to /usr/lib/nginx/conf.d/ for the same reason as
# 10-tessaro-selftest.conf: /etc is an overlay on /data.

server {
    # Every address, because the hotspot's may not exist yet when nginx
    # starts, and a listen on 10.42.0.1 would fail then. The loopback server
    # in 10-tessaro-selftest.conf names 127.0.0.1 exactly, so connections
    # there still reach it and never this one.
    listen 80 default_server;
    server_name _;

    # The hotspot's subnet only (the hotspot profile pins 10.42.0.1/24,
    # profiles.rs). Anything else - the ethernet side, a WiFi network the
    # device joined as a client - gets a 403 and never the portal.
    allow 10.42.0.0/24;
    deny all;

    access_log off;
    add_header Cache-Control "no-store" always;

    # A phone's connectivity probe asks for its own host name, which the
    # captive DNS drop-in answered with this address. Someone typing the
    # device's address asks for that, so anything else is a probe.
    if ($host != "10.42.0.1") {
        rewrite ^(.*)$ /.probe$1 last;
    }

    location ^~ /.probe/ {
        internal;

        # While the agent keeps this flag (the device unclaimed and
        # network.wifi.captive on), the probe is sent to the setup page,
        # which is what opens the phone's sign-in sheet.
        if (-f /run/tessaro-portal/captive) {
            return 302 https://10.42.0.1:7400/;
        }

        # Otherwise the probe gets the real server's answer, fetched by the
        # device, so a phone sees the internet exactly as the device does.
        # When the device cannot reach it the connection is dropped (444):
        # a phone reads that as "no internet", where an error page would
        # make an iPhone show the sign-in sheet after all.
        rewrite ^/\.probe(.*)$ $1 break;
        resolver 127.0.0.53 valid=30s;
        resolver_timeout 5s;
        proxy_pass http://$host;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @unreachable;
    }

    location @unreachable {
        return 444;
    }

    # http://10.42.0.1/, typed or from the sign-in sheet: the setup page is
    # the agent's, with the device's own certificate.
    location / {
        return 302 https://10.42.0.1:7400/;
    }
}
