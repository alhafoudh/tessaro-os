# Quick Setup's captive DNS, for the dnsmasq NetworkManager runs on the
# hotspot (ipv4.method=shared). See docs/quick-setup.md.
#
# In /etc/NetworkManager/dnsmasq-shared.d, which is the one place NM points
# its shared-mode dnsmasq at (--conf-dir, compiled into NM), so it cannot move
# to /usr/lib like the rest of our defaults. Nothing on the device writes it.
#
# Only the phones' own connectivity probes are answered with the device's
# address, 10.42.0.1 (the hotspot profile pins it, profiles.rs). nginx
# answers them with a redirect to the portal while the sign-in sheet is on,
# which is what makes a phone open it, and with the real server's answer
# once it is off (20-tessaro-portal.conf), so this file never changes. Every
# other name resolves as it always did, so with network.wifi.nat on a phone
# on the hotspot still reaches the internet. Each line matches the name and
# every name under it.
#
# Every probe name is `local=` as well as `address=`. `address=` with an IPv4
# address answers only the A query and forwards AAAA upstream, and an iPhone
# given the real IPv6 address prefers it: the hotspot has no IPv6, so it goes
# out over cellular, reaches Apple and shows "Success" in the sign-in sheet
# instead of the portal. `local=` keeps the AAAA query here, where it has no
# answer. Checked against dnsmasq 2.90.

# Apple: iOS, iPadOS and macOS.
address=/captive.apple.com/10.42.0.1
local=/captive.apple.com/

# Android and ChromeOS.
address=/connectivitycheck.gstatic.com/10.42.0.1
local=/connectivitycheck.gstatic.com/
address=/connectivitycheck.android.com/10.42.0.1
local=/connectivitycheck.android.com/
address=/clients1.google.com/10.42.0.1
local=/clients1.google.com/
address=/clients3.google.com/10.42.0.1
local=/clients3.google.com/

# Windows.
address=/www.msftconnecttest.com/10.42.0.1
local=/www.msftconnecttest.com/
address=/www.msftncsi.com/10.42.0.1
local=/www.msftncsi.com/

# Firefox, and NetworkManager on a Linux laptop.
address=/detectportal.firefox.com/10.42.0.1
local=/detectportal.firefox.com/
address=/nmcheck.gnome.org/10.42.0.1
local=/nmcheck.gnome.org/
address=/network-test.debian.org/10.42.0.1
local=/network-test.debian.org/
address=/connectivity-check.ubuntu.com/10.42.0.1
local=/connectivity-check.ubuntu.com/

# No DHCP option 114 (RFC 8910): it cannot be taken back without restarting
# the hotspot, and the RFC 8908 API it names must have a certificate the
# phone trusts, which the device's self-signed one is not.
