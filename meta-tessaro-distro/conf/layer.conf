# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Appends that only make sense when another layer is present. Keeping them out
# of BBFILES means a target that drops that layer does not fail with
# "not a recipe" on a dangling bbappend.
BBFILES_DYNAMIC += " \
    meta-moonforge-wpe:${LAYERDIR}/dynamic-layers/meta-moonforge-wpe/recipes-*/*/*.bb \
    meta-moonforge-wpe:${LAYERDIR}/dynamic-layers/meta-moonforge-wpe/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-tessaro-distro"
BBFILE_PATTERN_meta-tessaro-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tessaro-distro = "20"

LAYERDEPENDS_meta-tessaro-distro = " \
    core \
    meta-moonforge-distro \
"
LAYERSERIES_COMPAT_meta-tessaro-distro = "scarthgap"
