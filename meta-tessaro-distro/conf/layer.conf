# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# networking-layer is meta-openembedded/meta-networking, enabled in
# kas/common/tessaro.yml; recipes-connectivity/tessaro-network RDEPENDS on
# networkmanager-daemon from it. Note the name: LAYERDEPENDS takes the layer's
# BBFILE_COLLECTIONS name, which here is "networking-layer", not the directory
# name "meta-networking" - the same trap described just below for meta-chromium.
# Listing it means a chain that forgets the layer fails at parse with a clear
# message instead of at do_rootfs with an unresolvable package.

# An append that only makes sense when another layer is present belongs under
# dynamic-layers/<collection>/ plus a BBFILES_DYNAMIC entry here, so that a
# target dropping that layer does not fail with "not a recipe" on a dangling
# bbappend. There are none at the moment: meta-chromium is on in every target,
# so recipes-browser/chromium's bbappend lives in the plain tree. Note the key
# is the layer's BBFILE_COLLECTIONS name, which is not always its directory
# name - meta-chromium registers itself as "chromium-browser-layer".

BBFILE_COLLECTIONS += "meta-tessaro-distro"
BBFILE_PATTERN_meta-tessaro-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tessaro-distro = "20"

# openembedded-layer is meta-openembedded/meta-oe. It is already enabled - the
# Moonforge graphics fragment pulls it in - but the image now names font
# packages from it (ttf-noto-emoji-color, ttf-dejavu-*), so depending on it
# explicitly is what turns a future chain that drops it into a parse error
# instead of a do_rootfs failure. Same naming trap as networking-layer above:
# the BBFILE_COLLECTIONS name is "openembedded-layer", not "meta-oe".
# webserver is meta-openembedded/meta-webserver, enabled in
# kas/common/tessaro.yml. recipes-browser/tessaro-selftest RDEPENDS on nginx
# from it and recipes-httpd/nginx carries a bbappend, which would be a dangling
# append - the failure mode the comment above warns about - in a chain that
# dropped the layer.
LAYERDEPENDS_meta-tessaro-distro = " \
    core \
    meta-moonforge-distro \
    networking-layer \
    openembedded-layer \
    webserver \
"
LAYERSERIES_COMPAT_meta-tessaro-distro = "scarthgap"
