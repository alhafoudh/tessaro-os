require conf/distro/moonforge.conf

DISTRO = "tessaro"
DISTRO_NAME = "Tessaro OS"
DISTRO_VERSION = "0.1"

MAINTAINER = "Ahmed Al Hafoudh <alhafoudh@freevision.sk>"

# Default hostname; base-files would otherwise use ${MACHINE}.
hostname:pn-base-files = "tessaro"

# URL the kiosk browser opens. This is only the build-time default: it is
# written into /etc/default/tessaro-kiosk, which the systemd drop-in in
# dynamic-layers/meta-moonforge-wpe reads, so it can be changed on a running
# device. Upstream bakes the URL straight into the unit and has no runtime knob.
WPE_SIMPLE_LAUNCHER_URL ?= "https://www.freevision.sk"
