require conf/distro/moonforge.conf

DISTRO = "tessaro"
DISTRO_NAME = "Tessaro OS"
DISTRO_VERSION = "0.1"

MAINTAINER = "Ahmed Al Hafoudh <alhafoudh@freevision.sk>"

# Default hostname; base-files would otherwise use ${MACHINE}.
hostname:pn-base-files = "tessaro"

# Kiosk browser: Igalia's cog, from meta-webkit, launched and supervised by
# recipes-browser/tessaro-kiosk.
#
# The dbus PACKAGECONFIG moves cog's control interface from the session bus to
# the system bus. That is the only way the watchdog - a root system unit - can
# reach a browser running as the weston user without digging a session bus
# address out of /run/user/<uid>, which is the same class of hack as the
# /proc/<pid>/environ scrape this replaces.
#
# COG_DBUS_OWN_USER is baked into cog's shipped D-Bus policy as the user allowed
# to own com.igalia.Cog, so it must match User= in tessaro-kiosk.service.
#
# Both live here rather than in a bbappend on purpose: meta-webkit's layer
# collection is named "webkit", which BBFILES_DYNAMIC does not carry, so a
# bbappend against cog would mean a whole dynamic-layers/webkit/ tree for two
# variables.
PACKAGECONFIG:append:pn-cog = " dbus"
COG_DBUS_OWN_USER = "weston"

# URL the kiosk opens. Build-time default only: it is written into
# /usr/lib/tessaro-kiosk/tessaro-kiosk.env, which /etc/default/tessaro-kiosk
# overrides on a running device.
TESSARO_KIOSK_URL ?= "https://www.freevision.sk"
