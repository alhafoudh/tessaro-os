require conf/distro/moonforge.conf

DISTRO = "tessaro"
DISTRO_NAME = "Tessaro OS"
DISTRO_VERSION = "0.1.2"

# The image version: the marketing version above plus the short sha of this
# repo's HEAD, e.g. 0.1.0-1a2b3c4. It names the artifacts
# (tessaro-os-<machine>-<version>.wic.zst, via IMAGE_NAME in
# moonforge-image.bbclass) and is IMAGE_VERSION in os-release, which
# `tessaro-ctl device status` shows. The separator is "-" and not semver's "+"
# because os-release allows only [0-9a-z._-] in IMAGE_VERSION.
#
# This overrides the IMAGE_VERSION: "0" that Moonforge's kas fragment puts in
# the environment. Computed at parse, so every bitbake invocation (build, the
# kas shell, e2e) agrees without the mise tasks passing anything in. A new
# commit changes the base config, so bitbake reparses once and re-runs
# os-release and the image tasks; nothing else depends on it. A working tree
# with any change git status reports (modified, staged, untracked) appends
# -dirty, e.g. 0.1.0-1a2b3c4-dirty, so an image built from uncommitted work is
# never mistaken for the commit.
TESSARO_REVISION := "${@bb.process.run('rev=$(git rev-parse --short=7 HEAD 2>/dev/null) || rev=unknown; [ -z \"$(git status --porcelain 2>/dev/null)\" ] || rev=$rev-dirty; echo $rev', cwd=d.getVar('TESSARO_LAYERDIR'))[0].strip()}"
IMAGE_VERSION := "${DISTRO_VERSION}-${TESSARO_REVISION}"

# The console login banner (/etc/issue, issue.net) shows the image version,
# sha included, so a device on a serial console says which commit it runs.
# base-files writes DISTRO_VERSION there and uses it nowhere else; it rebuilds
# on every commit, which costs one small recipe and the rootfs. IMAGE_VERSION
# above is expanded at parse (:=) so this override does not recurse into it.
DISTRO_VERSION:pn-base-files = "${IMAGE_VERSION}"

MAINTAINER = "Ahmed Al Hafoudh <alhafoudh@freevision.sk>"

# The complete corresponding source of every GPL, LGPL and AGPL package an
# image ships, which distributing the image obliges us to offer: the upstream
# tarball, its patch series and the recipe that builds it. The archiver puts
# them in tmp/deploy/sources/, and `mise run sources:collect` copies the
# image's ones into the store on the build host (docs/sbom.md, "Sources").
# Only target recipes: the class default would also archive every native and
# cross tool, which never reaches a device. COPYLEFT_LICENSE_INCLUDE keeps
# copyleft_filter's default, GPL* LGPL* AGPL*.
INHERIT += "archiver"
ARCHIVER_MODE[src] = "original"
ARCHIVER_MODE[recipe] = "1"
COPYLEFT_RECIPE_TYPES = "target"

# Default hostname; base-files would otherwise use ${MACHINE}.
hostname:pn-base-files = "tessaro"

# The image's timezone is UTC; time.timezone moves it (docs/time.md), which
# timedated does by relinking /etc/localtime on the /etc overlay - that link
# then shadows this one. No /etc/timezone: timedated never updates it, so it
# would go on naming the image's zone after the device moved to another.
DEFAULT_TIMEZONE:pn-tzdata = "UTC"
INSTALL_TIMEZONE_FILE:pn-tzdata = "0"

# Kiosk browser: Chromium, from meta-browser's meta-chromium layer, launched
# and supervised by recipes-browser/tessaro-kiosk. There is no control D-Bus
# interface to configure here; tessaro-agent reaches the browser over CDP
# (--remote-debugging-port) instead.
#
# proprietary-codecs switches the bundled ffmpeg to the Chrome branding, which
# is what decodes H.264. A marketing kiosk without it cannot play the
# video most of the web serves. It also covers MP3/AAC, which the stock
# Chromium branding leaves out.
#
# Both live here rather than in a bbappend because they are distro policy,
# same as the NetworkManager lines below. The recipe is a :pn- override away.
#
# kiosk-mode contributes no GN args and no dependencies. All it does is select
# "--kiosk --no-first-run --incognito" into CHROMIUM_EXTRA_ARGS, which the
# recipe seds into the /usr/bin/chromium wrapper. We want --kiosk and
# --no-first-run and emphatically not --incognito, which throws away cookies,
# localStorage and service worker caches on every restart, and a kiosk site is
# entitled to keep state.
PACKAGECONFIG:append:pn-chromium-ozone-wayland = " kiosk-mode proprietary-codecs"

# cups (use_cups=true) is how Chromium reaches a printer at all: on Linux its
# print backend is libcups and nothing else, so without it window.print() has
# no printer to print on (docs/printing.md). Like any PACKAGECONFIG change it
# rebuilds Chromium from scratch, once; the device's CUPS itself comes from
# tessaro-printing.
PACKAGECONFIG:append:pn-chromium-ozone-wayland = " cups"

# Take --incognito back out, by replacing the whole set the PACKAGECONFIG
# above would have produced.
#
# The obvious fix is to drop kiosk-mode from PACKAGECONFIG and pass the
# flags we want from tessaro-kiosk.service. Do not do that. PACKAGECONFIG is a
# direct vardep of do_configure even when the option expands to nothing, so
# removing it changes that task's basehash and rebuilds Chromium from scratch -
# measured, not assumed:
#
#   Task chromium-ozone-wayland:do_configure couldn't be used from the cache
#     Variable PACKAGECONFIG value changed:
#     "upower use-egl use-v4l2 [-kiosk-mode-] proprietary-codecs"
#
# CHROMIUM_EXTRA_ARGS is only read by a sed in do_install, so overriding it
# costs do_install onward - minutes rather than hours. Check with
# `bitbake -S printdiff chromium-ozone-wayland` before changing either line.
#
# This assignment beats the recipe's own "?=" (that only fires because the base
# variable is unset at parse time; the :pn- value wins at expansion), while the
# recipe's ":append" of --ozone-platform=wayland still lands after it. So the
# wrapper ends up with exactly:
#
#     --kiosk --no-first-run --ozone-platform=wayland
#
# and everything else the browser gets comes from tessaro-kiosk.service. Keep
# it that way: flags in two places is how --incognito went unnoticed.
#
# Replacing the variable also drops what the recipe selects for its other
# default PACKAGECONFIG options: --use-angle=gles-egl for use-egl, and the
# AcceleratedVideoDecode* features for use-v4l2. Those are put back where
# every other flag lives, --use-angle in tessaro-kiosk.service and the
# features in KIOSK_ENABLE_FEATURES. Anything a future PACKAGECONFIG option
# adds to CHROMIUM_EXTRA_ARGS is lost the same way; check chromium-gn.inc.
CHROMIUM_EXTRA_ARGS:pn-chromium-ozone-wayland = "--kiosk --no-first-run"

# Hardware video decode on x86 is VA-API, and Chromium only has it when it is
# built with it. meta-chromium leaves use-vaapi off by default so that not
# every user of the recipe depends on libva. This is a PACKAGECONFIG change,
# so on x86 it is a full Chromium rebuild (see the comment above). It is the
# x86-64 arch override and not a machine one on purpose: qemux86-64 and
# genericx86-64 share the core2-64 tune, so they can share one Chromium build
# in sstate, and the Raspberry Pi's Chromium, which decodes through V4L2 and
# has that compiled in by default, keeps its hash.
#
# use-v4l2, in the recipe's default PACKAGECONFIG, has to go on x86: Chromium
# builds one hardware decoder backend or the other, never both, and
# do_configure stops at assert(!(use_v4l2_codec && use_vaapi)) in
# media/gpu/BUILD.gn when both are asked for. x86 has no V4L2 decoder anyway.
PACKAGECONFIG:append:pn-chromium-ozone-wayland:x86-64 = " use-vaapi"
PACKAGECONFIG:remove:pn-chromium-ozone-wayland:x86-64 = "use-v4l2"

# Mesa on x86: the VA-API driver for AMD and virtio GPUs, H.264 in it, and the
# AMD GL driver itself.
#
# va builds Mesa's VA state tracker, the *_drv_video.so files libva loads,
# packaged in mesa-megadriver with the GL drivers. Intel's VA driver is not
# Mesa's: it is intel-media-driver, from meta-intel, in the genericx86-64 kas
# fragment.
#
# VIDEO_CODECS decides which codecs that state tracker decodes. Its oe-core
# default is "all_free" unless the whole build accepts the "commercial"
# license flag, and all_free leaves out H.264 and H.265, which is most of the
# video the web serves. "all" for mesa alone is the same policy as
# proprietary-codecs for Chromium above, without accepting that flag for
# every recipe.
#
# gallium-llvm with r600 is what adds radeonsi, the GL driver for every
# current AMD GPU (mesa.inc, GALLIUMDRIVERS_RADEONSI). Without it the only
# gallium drivers on x86 are Intel's, virgl and swrast, so an AMD board runs
# Weston and Chromium in software. It builds oe-core's target llvm and ships
# libLLVM in the rootfs, which costs build time and image size. meta-clang
# does not provide llvm, so this does not touch the clang that builds
# Chromium.
#
# Both lines are x86-64 only for the same reason as use-vaapi: Chromium builds
# against mesa, so any change to the Pi's mesa would rebuild the Pi's Chromium
# too, for a VA state tracker the Pi does not use.
PACKAGECONFIG:append:pn-mesa:x86-64 = " va gallium-llvm r600"
VIDEO_CODECS:pn-mesa:x86-64 = "all"

# Network management: NetworkManager, replacing systemd-networkd.
#
# The driver is WiFi. Under systemd-networkd, changing a network in the field
# means hand-writing a .network file plus a wpa_supplicant.conf in different
# syntaxes, with the PSK in plaintext and no feedback on whether the association
# worked. NetworkManager turns that into one nmtui screen, stores the profile as
# a single keyfile under /etc/NetworkManager/system-connections (the /etc
# overlay, so it persists on /data) and reports association and DHCP state.
#
# nmtui is not in NetworkManager's default PACKAGECONFIG; it needs libnewt, from
# oe-core's recipes-extended/newt. The dnsmasq option is off although the hotspot
# (a shared connection) does use dnsmasq: all it sets is the binary's path, which
# NM also finds at runtime on its fixed search list, and an RRECOMMENDS. dnsmasq
# comes in as an RDEPENDS of tessaro-network instead, next to the bbappend that
# stops it breaking resolved - so the NM build is left as it was.
PACKAGECONFIG:append:pn-networkmanager = " nmtui"
PACKAGECONFIG:remove:pn-networkmanager = "dnsmasq"

# tinyproxy, for network.proxy.url, runs as tessaro-proxy.service from a config
# the agent renders into /run (docs/networking.md, "Proxy"). The recipe's own
# unit would start a second proxy on :8888 from /etc/tinyproxy.conf, which is
# on the /etc overlay: kept disabled, by recipes-support/tinyproxy/
# tinyproxy_%.bbappend (an override from here is replaced by the recipe's).

# Same for the firewall backend: RRECOMMENDS:networkmanager-daemon would pull in
# ${NETWORKMANAGER_FIREWALL_DEFAULT}. The hotspot's NAT does use nftables; it is
# an RDEPENDS of tessaro-network, and 10-tessaro.conf names the backend.
NETWORKMANAGER_FIREWALL_DEFAULT = ""

# systemd-networkd is displaced by NetworkManager, so stop building it rather
# than shipping both and hoping they do not both claim the same interface.
#
# This has to be a build-time answer. The rootfs is read only, so there is no
# "systemctl mask" to run, and a mask symlink shipped in /etc would be written
# into the overlay upper on /data on first boot and shadow the image's copy
# permanently - no later image could take it back. Dropping the PACKAGECONFIG
# removes the binary, its units and the network-online.target wiring in one move.
#
# systemd-resolved is a separate PACKAGECONFIG and deliberately stays: it owns
# /etc/resolv.conf as a symlink into /run, recreated each boot by systemd's
# tmpfiles "L!" line, which survives the /etc overlay cleanly. NM is pointed at
# it by recipes-connectivity/tessaro-network instead of writing resolv.conf
# itself, which would put a real file in the overlay upper.
PACKAGECONFIG:remove:pn-systemd = "networkd"

# systemd-conf's only job here besides journald/logind/system.conf drop-ins is
# installing /usr/lib/systemd/network/80-wired.network (ethernet DHCP). With
# networkd gone the file is inert, but leaving it would be a standing invitation
# to misread which stack owns the interface.
#
# Dropping it does NOT cost the zero-configuration ethernet DHCP that file
# provided. NetworkManager does the same job through its auto-default: any
# managed ethernet device with no stored profile gets an in-memory "Wired
# connection 1" with ipv4.method=auto. That is on unless the device is named in
# [main] no-auto-default, which nothing here sets. A factory device still boots
# and takes a DHCP lease with no configuration; the difference is only that the
# profile is ephemeral and regenerated each boot, until someone saves a real one.
PACKAGECONFIG:remove:pn-systemd-conf = "dhcp-ethernet"

# URL the kiosk opens. Build-time default only: it is written into
# /usr/lib/tessaro-kiosk/tessaro-kiosk.env, which `tessaro-ctl config set browser.url=`
# overrides on a running device.
#
# A factory image opens the welcome page, served by nginx on the loopback
# from /usr/share/tessaro-selftest, with the self-test beside it at
# /selftest.html. A deployment sets this to the customer's site, at build time
# here or at runtime with tessaro-ctl.
#
# Served over http rather than opened as a file:// URL, and that is the whole
# point of running a web server for one static directory. A file:// page has a
# null origin, so Chromium's SerialAllowAllPortsForUrls and
# WebHidAllowAllDevicesForUrls - which match on origin and nothing else -
# cannot grant it anything, and the self-test could only reach a device through
# a chooser dialog. http://127.0.0.1 is a real origin, and a *potentially
# trustworthy* one, so it is a secure context too and the device APIs exist at
# all. See TESSARO_SELFTEST_ORIGIN in the tessaro-kiosk recipe.
TESSARO_KIOSK_URL ?= "http://127.0.0.1/"

# What maintenance mode shows (`tessaro-ctl browser maintenance on`). The shipped page
# is tessaro-selftest's, on the same nginx; a deployment may point it at its
# own, and a device can with `tessaro-ctl config set browser.maintenance.url=...`.
TESSARO_MAINTENANCE_URL ?= "http://127.0.0.1/maintenance.html"

# Remote access: Weston's VNC backend, used as the far end of the screen-share
# module so a technician can watch the real panel over an SSH tunnel. View only
# for now - remote input lands on a second wl_seat that Chromium never binds;
# see docs/remote-access.md for why and for the fix.
# The wiring is in recipes-graphics/wayland; the lines below are what make
# the backend exist at all.
#
# vnc is not in oe-core's default PACKAGECONFIG for weston, screenshare and
# shell-fullscreen are. So enabling the backend is the only build-time change
# the mirror needs.
PACKAGECONFIG:append:pn-weston = " vnc"

# Load bearing, and silent if forgotten. neatvnc's own PACKAGECONFIG is "",
# so TLS is off by default, and Weston's VNC backend refuses to start without
# it - nvnc_has_auth() is false, the log says "Neat VNC built without TLS
# support" and vnc_backend_create() bails before it ever binds a port.
# TLS gives the VeNCrypt login (a username and password inside TLS), the one
# TigerVNC, Remmina and tessaro-gui use.
PACKAGECONFIG:append:pn-neatvnc = " tls"

# nettle gives neatvnc's other logins: Apple's Diffie-Hellman one, for
# viewers without TLS (macOS Screen Sharing, Royal TSX), and RSA-AES. Weston
# offers them because its VNC patch requires a login but not encryption (the
# SSH tunnel encrypts). The recipe has no PACKAGECONFIG for it and meson's
# "auto" finds nettle only by luck of the sysroot, so it is enabled and
# depended on explicitly. nettle and gmp ship already, for gnutls.
DEPENDS:append:pn-neatvnc = " nettle gmp"
EXTRA_OEMESON:append:pn-neatvnc = " -Dnettle=enabled"

# PACKAGECONFIG[vnc] declares only neatvnc, but libweston/meson.build hard
# errors with "VNC backend requires libpam" when backend-vnc is on. It resolves
# today through the systemd PACKAGECONFIG dragging libpam into the sysroot,
# which is luck rather than a dependency. Say it out loud so a future
# PACKAGECONFIG change cannot break the build in a way that reads as unrelated.
DEPENDS:append:pn-weston = " libpam"
