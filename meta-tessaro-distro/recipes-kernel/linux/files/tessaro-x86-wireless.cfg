# WiFi drivers for genericx86-64, and btusb as a module there. Applied after
# tessaro-devices.cfg, on genericx86-64 only (see the bbappend).
#
# linux-yocto's genericx86-64 config enables every WLAN vendor menu but builds
# only the old drivers under them (ath5k/ath9k, brcm, mt7601u, rt2x00): no
# Intel, no ath10k/11k/12k, no mt76 beyond mt7601u, no rtw88/rtw89. The
# firmware for all of them is already in the image through linux-firmware, so
# the drivers are the whole gap.
#
# Everything here is =m, unlike tessaro-devices.cfg. Each of these chips loads
# firmware when the driver probes, and a built-in driver probes from the
# initramfs, before the rootfs holding /lib/firmware is mounted: the load
# fails with -2 and the device stays dead. As a module the driver is loaded
# by udev from the rootfs, firmware in reach. genericx86-common.inc
# recommends kernel-modules, so every module built here lands in the image
# without naming a package.

# Intel: iwlmvm drives the 7000 series onwards (the 8265, AX200/AX210, BE200),
# iwldvm the older 1000-6000 cards.
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
CONFIG_IWLDVM=m

# Qualcomm Atheros. ath10k is the 802.11ac generation (QCA6174, QCA9377),
# ath11k and ath12k the WiFi 6/7 cards (QCA6390, WCN6855, WCN7850); the PCI
# drivers select MHI and QRTR themselves. ath9k_htc is the AR9271/AR7010 USB
# dongles.
CONFIG_ATH10K=m
CONFIG_ATH10K_PCI=m
CONFIG_ATH11K=m
CONFIG_ATH11K_PCI=m
CONFIG_ATH12K=m
CONFIG_ATH9K_HTC=m

# MediaTek: MT7921/MT7922 (AMD RZ6xx cards among them) over PCIe and USB, and
# the mt76x0/mt76x2/mt7663 USB and PCIe parts.
CONFIG_MT7921E=m
CONFIG_MT7921U=m
CONFIG_MT76x0U=m
CONFIG_MT76x0E=m
CONFIG_MT76x2U=m
CONFIG_MT76x2E=m
CONFIG_MT7663U=m

# Realtek. rtw88 and rtw89 are the current drivers for the PCIe cards common
# in mini PCs and thin clients, rtw88 also for the USB dongles; rtl8xxxu
# covers the older USB dongles and rtlwifi the older PCIe cards. RTL8192CU
# stays off: it claims the same USB IDs as rtl8xxxu.
CONFIG_RTW88=m
CONFIG_RTW88_8822BE=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW88_8723DE=m
CONFIG_RTW88_8821CE=m
CONFIG_RTW88_8822BU=m
CONFIG_RTW88_8822CU=m
CONFIG_RTW88_8723DU=m
CONFIG_RTW88_8821CU=m
CONFIG_RTW89=m
CONFIG_RTW89_8851BE=m
CONFIG_RTW89_8852AE=m
CONFIG_RTW89_8852BE=m
CONFIG_RTW89_8852CE=m
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y
CONFIG_RTL8188EE=m
CONFIG_RTL8192CE=m
CONFIG_RTL8192EE=m
CONFIG_RTL8723BE=m
CONFIG_RTL8821AE=m

# Marvell: the 88W8897/8997 found on some x86 boards, PCIe and USB.
CONFIG_MWIFIEX=m
CONFIG_MWIFIEX_PCIE=m
CONFIG_MWIFIEX_USB=m

# Bluetooth over USB, which is how the combo cards above attach their radio.
# tessaro-devices.cfg builds it in; here it has to be a module for the same
# firmware reason - Intel's controllers load intel/ibt-*.sfi at probe.
CONFIG_BT_HCIBTUSB=m
