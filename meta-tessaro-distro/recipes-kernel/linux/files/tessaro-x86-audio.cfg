# USB sound cards on genericx86-64: USB speakers, headsets and the like,
# which linux-yocto's config leaves out on this machine. The e2e suite plugs
# an emulated one in (test/e2e/spec/support/vm.rb, docs/audio.md). A module,
# like every other sound driver here; genericx86-common.inc installs them
# all.
CONFIG_SND_USB_AUDIO=m
