# Temperature sensors every linux-yocto machine reports in `device status`
# (docs/hardware.md). The agent reads them from /sys/class/hwmon.
#
# NVME_HWMON gives an NVMe drive's composite temperature, and its warning and
# critical thresholds, to hwmon; the e2e suite reads qemu's emulated one.
# drivetemp does the same for SATA disks over ATA's SCT; it has no modalias,
# so tessaro-kiosk ships a modules-load.d file for it.
CONFIG_NVME_HWMON=y
CONFIG_SENSORS_DRIVETEMP=m
