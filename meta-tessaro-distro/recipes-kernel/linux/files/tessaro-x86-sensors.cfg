# The CPU's temperature on genericx86-64 (docs/hardware.md): coretemp for
# Intel (the package and each core) and k10temp for AMD. Without them a PC
# reports only ACPI's thermal zone and Intel's package zone. Both load on
# their own, matched by the CPU's family.
CONFIG_SENSORS_CORETEMP=m
CONFIG_SENSORS_K10TEMP=m
