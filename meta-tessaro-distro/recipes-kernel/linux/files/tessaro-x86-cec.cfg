# HDMI-CEC on genericx86-64 (docs/cec.md). A PC's GPU drives no CEC line on
# its own HDMI port; what does exist is CEC tunnelled over DisplayPort's AUX
# channel: the HDMI ports that are DisplayPort behind an LSPCON chip (many
# Intel NUCs and mini PCs), and DisplayPort or USB-C to HDMI adapters that
# wire the CEC pin. i915 and amdgpu register those as /dev/cecN on their
# connector. It selects CEC_CORE.
#
# No Pulse-Eight USB adapter: it needs a serial line discipline attached
# from userspace (inputattach) before it is an adapter at all.
CONFIG_DRM_DP_CEC=y
