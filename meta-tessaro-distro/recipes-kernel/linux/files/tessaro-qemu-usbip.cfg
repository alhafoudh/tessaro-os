# USB/IP's client side for qemux86-64 only (see the bbappend): the camera the
# e2e suite and `mise run usbcam:run` plug in is a USB device served over the
# network by test/usbcam/usbcam.rb on the host, and vhci-hcd is the host
# controller it appears behind. QEMU emulates no USB camera, and a dummy_hcd
# gadget cannot stand in for one (docs/camera.md, Testing in qemu).
#
# Modules, loaded by `usbip attach`'s modprobe, and installed on qemux86-64
# through MACHINE_EXTRA_RRECOMMENDS in kas/machine/qemux86-64.yml.
CONFIG_USBIP_CORE=m
CONFIG_USBIP_VHCI_HCD=m
