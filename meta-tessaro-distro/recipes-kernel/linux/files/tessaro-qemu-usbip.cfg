# USB/IP's client side on genericx86-64, for when the image boots under QEMU
# (see the bbappend): the camera and scanner the e2e suite and `mise run
# usbcam:run` / `usbscanner:run` plug in are USB devices served over the
# network by test/usbcam/usbcam.rb and test/usbscanner/usbscanner.rb on the
# host, and vhci-hcd is the host controller they appear behind. QEMU emulates
# no USB camera, and a dummy_hcd gadget cannot stand in for one
# (docs/camera.md, Testing in qemu).
#
# Modules, loaded by `usbip attach`'s modprobe and by nothing else - on real
# hardware they stay unloaded - and installed with every other module by
# genericx86-common.inc's kernel-modules.
CONFIG_USBIP_CORE=m
CONFIG_USBIP_VHCI_HCD=m
