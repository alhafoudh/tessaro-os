# Drivers the kiosk's input and device-API story needs, none of which
# linux-yocto's standard config turns on.
#
# All built in rather than =m: a module is only there on a machine whose BSP
# installs the full module set (genericx86-common.inc and genericarm64.conf
# do) or that names its kernel-module-* package. Built in, the driver is
# simply there on every linux-yocto target and there is no packaging question
# at all. The combined size is negligible next to Chromium.
#
# Built in only works for a driver that needs no firmware at probe: it probes
# from the initramfs, before /lib/firmware is mounted. btusb is one that does
# on Intel controllers, so tessaro-x86-wireless.cfg turns it back into a
# module on genericx86-64, where every module is installed anyway.

# Touch panels. Most USB and I2C touchscreens are HID multitouch devices;
# without this driver they bind to hid-generic, which does not decode
# multi-finger reports. CONFIG_INPUT_TOUCHSCREEN and the usbtouchscreen
# drivers are already on and cover only the older, non-HID panels.
CONFIG_HID_MULTITOUCH=y

# /dev/hidraw*, which is both how WebHID reaches a device and a prerequisite
# for anything else that talks to HID from userspace.
CONFIG_HIDRAW=y

# Web Serial. CONFIG_USB_SERIAL is on and brings ftdi_sio and pl2303, but
# CDC-ACM - what most modern devices present as, including anything
# Arduino-class - is not, and neither are the other common bridge chips.
CONFIG_USB_ACM=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_CH341=y

# Web Bluetooth. CONFIG_BT, CONFIG_BT_LE and CONFIG_RFKILL are already on, but
# every HCI transport driver is off, so the stack has no way to reach a
# controller at all - bluetoothd starts and finds no adapter. btusb covers USB
# dongles and the M.2 combo cards in this class of mini PC; hciuart plus the
# H4 and Broadcom line disciplines cover on-board modules wired to a UART,
# which is how the Pi's radio is attached.
CONFIG_BT_HCIBTUSB=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIUART_BCM=y
