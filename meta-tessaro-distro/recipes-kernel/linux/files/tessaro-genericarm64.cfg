# What genericarm64's linux-yocto config leaves out and the x86 targets have:
# V4L2 and the UVC driver for USB cameras (v4l2loopback does not build
# without VIDEO_DEV, see docs/camera.md), the sound cards a VM offers (Intel
# HDA and virtio-sound, the Mac's audio under QEMU or UTM), and USB/IP's
# client for the test camera test/usbcam/usbcam.rb serves (docs/camera.md,
# Testing in qemu).
#
# Modules: genericarm64.conf installs every module linux-yocto builds
# (MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"), so nothing needs naming.
#
# Built in: whatever the initramfs needs to reach the root disk.
# genericarm64 builds the PCIe host bridge of QEMU's virt machine (ECAM,
# pci-host-generic) as a module that its own initramfs carries, but the image
# bundles tessaro-initramfs, which has no modules: without it the guest finds
# no PCI bus, so no virtio disk, network or GPU, and stops after /init.
CONFIG_PCI_HOST_COMMON=y
CONFIG_PCI_HOST_GENERIC=y
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_VIDEO_DEV=m
CONFIG_USB_VIDEO_CLASS=m
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_HDA_GENERIC=m
CONFIG_SND_VIRTIO=m
CONFIG_USBIP_CORE=m
CONFIG_USBIP_VHCI_HCD=m
