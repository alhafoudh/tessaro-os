# An emulated HDMI-CEC bus for the e2e suite on genericx86-64 under QEMU
# (docs/cec.md, Testing in qemu): vivid's HDMI input and output each register
# a CEC adapter, wired to one another, so the agent claims the output's and
# cec-follower plays the TV on the input's. QEMU emulates no CEC.
#
# A module, loaded only by the CEC lane: vivid also brings fake capture
# devices, which no other lane, and no real device, must see as cameras.
# Installed with every other module by genericx86-common.inc's
# kernel-modules.
CONFIG_MEDIA_TEST_SUPPORT=y
CONFIG_V4L_TEST_DRIVERS=y
CONFIG_VIDEO_VIVID=m
CONFIG_VIDEO_VIVID_CEC=y
