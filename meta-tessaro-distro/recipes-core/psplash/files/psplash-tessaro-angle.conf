# Turn the boot splash with the screen (screen.rotation).
#
# tessaro-agent writes PSPLASH_ARGS=--angle N into /data/tessaro/splash.env
# once a rotation is confirmed; a rotation still on probation never gets
# there, since a reboot reverts it. /data is mounted by the overlayfs preinit
# before systemd starts, so the file is there at sysinit, long before
# /run/tessaro-kiosk/generated.env is. Missing (first boot, after a factory
# reset) or empty means no arguments: an unbraced $PSPLASH_ARGS that is
# empty expands to nothing at all.
#
# Its own name, not framebuf.conf: Moonforge's Pi layer ships that one.
[Service]
EnvironmentFile=-/data/tessaro/splash.env
ExecStart=
ExecStart=/usr/bin/psplash $PSPLASH_ARGS
