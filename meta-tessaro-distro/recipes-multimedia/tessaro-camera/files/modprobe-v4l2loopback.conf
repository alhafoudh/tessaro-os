# No virtual cameras of its own at load: each tessaro-camera mirror adds
# one for its camera through /dev/v4l2loopback and removes it again. Without
# this the module makes a "Dummy video device" that every page would list as
# a camera showing nothing.
#
# exclusive_caps is not set here: that option is for the devices made at
# load, and a mirror sets the same thing on its own device when it adds it.
options v4l2loopback devices=0
