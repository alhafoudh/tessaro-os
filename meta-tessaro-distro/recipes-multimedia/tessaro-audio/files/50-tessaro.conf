# WirePlumber on the Tessaro kiosk. Installed in
# /usr/share/wireplumber/wireplumber.conf.d/, not /etc: /etc is the overlay on
# /data, and a file there would outlive every later image.
#
# WirePlumber runs as the weston user from a plain system unit
# (tessaro-wireplumber.service), with no login session and no session bus.

wireplumber.profiles = {
  main = {
    # No session bus on this image. The device reservation protocol (which
    # lets desktop apps hand a card to JACK) is what talks over it, and
    # there is nobody to reserve from. monitor.alsa only wants it.
    support.dbus = disabled
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled

    # Bluetooth speakers are not wired up. PipeWire is built with the
    # plugins, so turning this back on is the configuration half. Off, it
    # also takes the bluez seat monitoring, the one user of logind - which
    # weston, with no login session, would never pass.
    hardware.bluetooth = disabled

    # Not sound, nothing a kiosk page uses through PipeWire.
    hardware.video-capture = disabled
    monitor.alsa-midi = disabled
  }
}

# Remember nothing. tessaro-agent applies audio.output, audio.volume,
# audio.mute, audio.input and audio.input_volume from tessaro.db whenever
# anything changes, and those settings are the only truth: a volume or a
# default output WirePlumber restored on its own would fight them after
# every reboot, and outlive a factory reset.
wireplumber.settings = {
  device.restore-profile = false
  device.restore-routes = false
  node.stream.restore-props = false
  node.stream.restore-target = false
  node.restore-default-targets = false
}
