# The sound server's runtime directory: PipeWire's socket, the Pulse socket
# Chromium plays through, and WirePlumber's (unused) state. Private to the
# weston user, which PipeWire, WirePlumber, the Pulse server and Chromium all
# run as. tessaro-agent reaches it as root to read and switch outputs.
d /run/tessaro-audio 0700 weston weston -
