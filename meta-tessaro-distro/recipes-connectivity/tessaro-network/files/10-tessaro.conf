# NetworkManager configuration for Tessaro.
#
# Installed to /usr/lib/NetworkManager/conf.d/, not /etc/NetworkManager/conf.d/.
# NM reads both, /etc winning, but /etc is an overlayfs upper on /data: the
# first write to a file there shadows the image's copy permanently, so no later
# image could ever change this default again. Build-time defaults belong on the
# read-only side, exactly like /usr/lib/tessaro-kiosk/tessaro-kiosk.env.
#
# To override on a running device, drop a file in /etc/NetworkManager/conf.d/
# and accept that it is now pinned to that device.

[main]
# systemd-resolved stays in the image and owns /etc/resolv.conf, which is a
# symlink into /run recreated on every boot by systemd's tmpfiles "L!" line.
# That arrangement survives the /etc overlay cleanly because nothing ever
# writes a real file there. If NM managed resolv.conf itself it would write one,
# it would land in the overlay upper on /data, and it would outlive every
# future image.
dns=systemd-resolved
# Belt and braces on top of dns=: rc-manager is the setting that guarantees NM
# does not touch /etc/resolv.conf on any code path.
rc-manager=unmanaged

# Connection profiles are keyfiles under /etc/NetworkManager/system-connections,
# which is what makes them persist on /data. Pinned rather than left to NM's
# built-in default because the ifupdown plugin is compiled in (it is in the
# recipe's default PACKAGECONFIG) and a future version changing its default
# plugin list would silently start reading /etc/network/interfaces instead.
plugins=keyfile

# The only account on this device is root, and the image ships no polkit agent.
# NM's default is to ask polkitd for settings.modify.system (saving a profile)
# and network-control (activating one); upstream's policy grants those to
# allow_active but demands auth_admin_keep otherwise, and there is nothing here
# to answer that prompt. The symptom would be nmtui working from a getty on
# tty1, where logind gives the session an active seat, and the identical action
# failing over SSH with "Not authorized to modify the system settings" - the
# worst kind of bug to diagnose in the field.
#
# root-only authorises uid 0 without consulting polkitd and denies everyone
# else outright, which is stricter than the default, not looser.
# Check with: nmcli general permissions   (every entry should read "yes")
auth-polkit=root-only

# No "Wired connection 1": the agent renders the device's own profiles -
# tessaro-ethernet-dhcp/-static, tessaro-wifi-hotspot/-client - into
# /run/NetworkManager/system-connections at every boot, from its settings
# (`tessaro-ctl config set network.ethernet.mode=...`). NM's in-memory default would only
# compete with them, under a name nobody chose.
no-auto-default=*

# The hotspot is ipv4.method=shared, and NM masquerades shared connections
# through this backend. Named rather than detected so the NAT does not depend
# on which of nft and iptables happens to be installed; nftables is, as an
# RDEPENDS of this recipe.
firewall-backend=nftables

[keyfile]
# The agent's scan of a hotspot adds this station interface on the same radio
# for a few seconds and scans from it with iw, because most drivers refuse to
# scan from an access point (agent/tessaro-agent/src/nm/sidescan.rs). NM
# managing it would start wpa_supplicant on it and try the saved profiles.
unmanaged-devices=interface-name:tessaro-scan

[device]
# wpa-supplicant is already in the image via the wifi DISTRO_FEATURE and arrives
# as an RDEPENDS of networkmanager-wifi. Spelled out rather than left to NM's
# autodetection so that installing iwd for some unrelated reason cannot silently
# switch the backend.
wifi.backend=wpa_supplicant
