# Where the device's CUPS keeps things (tessaro-cups.service, `cupsd -s`).
#
# The printers, their PPDs and the jobs waiting are on /data/cups, so a
# printer set up once survives a reboot with it switched off, and a job
# waiting for paper survives one too. Everything else is in /run. Nothing is
# under /etc/cups: /etc is the overlay on /data (docs/printing.md).

ServerRoot /data/cups
RequestRoot /data/cups/spool
TempDir /data/cups/spool/tmp
StateDir /run/cups
CacheDir /run/cups/cache

User lp
Group lp
# root administers over the socket; the recipe's lpadmin group is kept for
# the stock tools' sake.
SystemGroup root lpadmin

# The journal, through syslog; no files under /var/log.
ErrorLog syslog
AccessLog syslog
PageLog syslog

# The printcap in /run, not /etc/printcap, which would land on the /etc
# overlay; nothing on the device reads it. `Printcap` with no value does not
# switch it off: cupsd refuses the whole file and never starts.
Printcap /run/cups/printcap

# The socket needs no certificate.
CreateSelfSignedCerts no
