# The device's CUPS (tessaro-cups.service). Read from /usr/lib, never from
# /etc/cups: /etc is the overlay on /data, and a copy there would shadow the
# image's forever. The printers are the agent's to set up (docs/printing.md);
# nothing here is changed at run time.

LogLevel warn
MaxLogSize 0
# Only what changes the configuration goes to the journal, not every request
# the agent's once-a-minute check makes.
AccessLogLevel config

# The unix socket only. Port 7400 stays the device's one management port, and
# nothing off the device reaches CUPS; the agent and Chromium both come here.
Listen /run/cups/cups.sock

# The device shares no printer and looks for none on its own: the agent
# discovers printers when asked (lpinfo), and the printers it sets up are the
# only ones there are.
Browsing No
BrowseLocalProtocols none
DefaultShared No
WebInterface No

# A printer that is off or out of paper keeps its jobs and is tried again,
# instead of CUPS's default of stopping the queue until someone starts it: on
# a public screen nobody would.
ErrorPolicy retry-job
JobRetryInterval 30
JobRetryLimit 1000000

# Done jobs are forgotten: `printer jobs` is what still has to print.
PreserveJobHistory No
PreserveJobFiles No
MaxJobs 500

DefaultAuthType Basic

<Location />
  Order allow,deny
  Allow localhost
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

# Anyone on the device may print - the browser runs as weston - and only root
# (@SYSTEM, known by its socket credentials) changes printers and cancels
# someone else's job.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
