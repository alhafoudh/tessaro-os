# The device's CUPS state (cups-files.conf), before tessaro-cups.service
# starts. Owned root:lp as cupsd wants its ServerRoot and spool: it refuses
# a ServerRoot others can write, and its filters and backends run as lp and
# read the jobs from the spool. tmpfiles re-applies owner and mode for `d` at
# every boot. A factory reset wipes /data, and with it every printer.
d /data/cups 0755 root lp -
d /data/cups/ppd 0755 root lp -
d /data/cups/ssl 0700 root lp -
d /data/cups/spool 0710 root lp -
d /data/cups/spool/tmp 01770 root lp -
d /run/cups 0755 root lp -
d /run/cups/cache 0770 root lp -
d /run/cups/certs 0711 root lp -
