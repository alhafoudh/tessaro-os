# Try Tessaro for Apple silicon: the app from this commit around a
# genericarm64 image, as a DMG ready to download. Signed ad hoc, not
# notarized. Runs on GitHub's macOS runner alone. See docs/try-tessaro.md
# and docs/ci.md.
#
# By hand it takes the image of a published release (the latest, or the
# tag given) and leaves the DMG as this run's artifact. release.yml calls
# it with from_run, the image its own build job just uploaded, and
# publishes the DMG with everything else: only release.yml publishes a
# release.

name: try

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag whose genericarm64 image goes in (empty for the latest)
        type: string
        default: ""
  workflow_call:
    inputs:
      from_run:
        description: Take the image from this run's artifacts, as release.yml's build uploads it
        type: boolean
        default: false

permissions:
  # Reading a release's image is all it does with the repo.
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # Only Rust installed (install_args), as in release.yml's clients.
  MISE_AUTO_INSTALL: "false"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  try-tessaro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> ../build/cargo-target
            gui -> ../build/gui-target
      # The QEMU the app bundles, relinked (gui/try-tessaro/bundle-qemu-macos.sh).
      - run: brew install qemu

      # The image: this run's own (release.yml), or a published release's.
      - if: inputs.from_run
        uses: actions/download-artifact@v8
        with:
          pattern: tessaro-os-genericarm64-*.wic.zst
          merge-multiple: true
          path: build/image
      - if: ${{ !inputs.from_run }}
        name: Fetch the release's image
        env:
          TAG: ${{ inputs.release }}
        run: |
          set -e
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName --jq .tagName)
          gh release download "$TAG" --pattern 'tessaro-os-genericarm64-*.wic.zst' --dir build/image
      - name: Name the image
        id: image
        run: |
          set -e
          image=$(ls build/image/tessaro-os-genericarm64-*.wic.zst)
          version=${image##*/tessaro-os-genericarm64-}
          version=${version%.wic.zst}
          echo "path=$image" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - run: mise run try:build "${{ steps.image.outputs.path }}"
      # The runtime's licenses, where its runtime.json exists (docs/sbom.md).
      - run: ruby sbom/sbom.rb check --runtime build/gui-target/release/qemu-runtime/runtime.json

      - name: Pack
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -e
          mkdir -p build/artifacts
          mv build/Try-Tessaro-macos-arm64.dmg "build/artifacts/try-tessaro-$VERSION-macos-arm64.dmg"
          ls -l build/artifacts
      # The DMG stays an artifact; release.yml publishes every try-tessaro-*
      # artifact of its run.
      - uses: actions/upload-artifact@v7
        with:
          name: try-tessaro-macos-arm64
          path: build/artifacts/
          compression-level: 0
          retention-days: 14
