# Try Tessaro: the app from this commit around a Tessaro image, one leg
# per platform it ships on, each package left as an artifact. Signed ad
# hoc, not notarized. Runs on GitHub's runners alone. See
# docs/try-tessaro.md and docs/ci.md.
#
# By hand it takes the images of a published release (the latest, or the
# tag given): an intermediate build of the launcher. release.yml calls it
# with the machines its run built, takes the images its build job
# uploaded, and publishes the packages with everything else. This
# workflow never publishes anything: only release.yml makes a release.

name: try

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag whose images go in (empty for the latest)
        type: string
        default: ""
  workflow_call:
    inputs:
      machines:
        description: The machines the calling run built, as JSON; their images come from its artifacts
        type: string
        required: true

permissions:
  # Reading a release's images is all it does with the repo.
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # Only Rust installed (install_args), as in release.yml's clients.
  MISE_AUTO_INSTALL: "false"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # The platforms Try Tessaro ships on: the runner, the image it bundles
  # and what its package is. Called from release.yml, only those whose
  # machine that run built.
  targets:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          BUILT: ${{ inputs.machines }}
        run: |
          set -e
          targets='[
            {"os": "macos-latest", "platform": "macos-arm64", "machine": "genericarm64", "package": "dmg"}
          ]'
          if [ -n "$BUILT" ]; then
            targets=$(jq --argjson built "$BUILT" '[.[] | select(.machine as $m | $built | index($m))]' <<<"$targets")
          fi
          include=$(jq -c . <<<"$targets")
          echo "include: $include"
          echo "include=$include" >>"$GITHUB_OUTPUT"

  try-tessaro:
    needs: targets
    if: needs.targets.outputs.include != '[]'
    name: try-tessaro (${{ matrix.platform }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          workspaces: |
            agent -> ../build/cargo-target
            gui -> ../build/gui-target
      # The QEMU the app bundles, relinked (gui/try-tessaro/bundle-qemu-macos.sh).
      - if: runner.os == 'macOS'
        run: brew install qemu

      # The image: the calling run's own (release.yml), or a published
      # release's.
      - if: inputs.machines
        uses: actions/download-artifact@v8
        with:
          pattern: tessaro-os-${{ matrix.machine }}-*.wic.zst
          merge-multiple: true
          path: build/image
      - if: ${{ !inputs.machines }}
        name: Fetch the release's image
        env:
          TAG: ${{ inputs.release }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -e
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName --jq .tagName)
          gh release download "$TAG" --pattern "tessaro-os-$MACHINE-*.wic.zst" --dir build/image
      - name: Name the image
        id: image
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          set -e
          image=$(ls build/image/tessaro-os-"$MACHINE"-*.wic.zst)
          version=${image##*/tessaro-os-"$MACHINE"-}
          version=${version%.wic.zst}
          echo "path=$image" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # try:build makes build/Try-Tessaro-<platform>.<package>.
      - run: mise run try:build "${{ steps.image.outputs.path }}"
      # The bundled runtime's licenses, where its runtime.json exists
      # (docs/sbom.md).
      - run: ruby sbom/sbom.rb check --runtime build/gui-target/release/qemu-runtime/runtime.json

      - name: Pack
        env:
          VERSION: ${{ steps.image.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -e
          mkdir -p build/artifacts
          mv "build/Try-Tessaro-$PLATFORM.$PACKAGE" "build/artifacts/try-tessaro-$VERSION-$PLATFORM.$PACKAGE"
          ls -l build/artifacts
      # Left as an artifact; release.yml publishes every try-tessaro-*
      # artifact of its run.
      - uses: actions/upload-artifact@v7
        with:
          name: try-tessaro-${{ matrix.platform }}
          path: build/artifacts/
          compression-level: 0
          retention-days: 14
