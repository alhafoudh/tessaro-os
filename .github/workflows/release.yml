# Build images by hand, run e2e on the genericx86-64 one, build tessaro-ctl and
# tessaro-gui for every platform, Try Tessaro around the genericarm64 image
# when try is ticked, and publish them all as a release when that is ticked.
# The images and e2e are image.yml's jobs, on the self-hosted runner on the
# build host; everything else runs on GitHub's runners. Only
# workflow_dispatch triggers this, so only people with write access run code
# on that host - never add pull_request here. See docs/ci.md.

name: release

on:
  workflow_dispatch:
    inputs:
      genericx86-64:
        description: genericx86-64 (x86_64 PCs; e2e runs on it in QEMU)
        type: boolean
        default: true
      genericarm64:
        description: genericarm64 (Arm64 UEFI, a VM on an Apple silicon Mac)
        type: boolean
        default: false
      try:
        description: Try Tessaro for macOS, around the genericarm64 image (needs genericarm64)
        type: boolean
        default: false
      raspberrypi3-64:
        description: raspberrypi3-64 (Pi 3B / 3B+)
        type: boolean
        default: false
      raspberrypi4-64:
        description: raspberrypi4-64 (Pi 4B / 400 / CM4)
        type: boolean
        default: false
      raspberrypi5:
        description: raspberrypi5 (Pi 5)
        type: boolean
        default: false
      e2e:
        description: Run the e2e suite on the genericx86-64 image
        type: boolean
        default: true
      e2e_args:
        description: "Arguments for e2e:run, e.g. -o '--tag ~reboot'"
        type: string
        default: ""
      release:
        description: Publish the images and clients as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # mise refuses an untrusted mise.toml; the checkout is this repo's own.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.pick.outputs.machines }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # image:name needs only git and sed, so no toolchain gets installed.
      - uses: jdx/mise-action@v5
        with:
          install: false
      # The version every image and client of this run is named with, the
      # same as image.yml's version job computes: the clients need it before
      # image.yml's outputs exist, which is only once it has finished. A fresh
      # checkout is never -dirty; the build host's can be, and build checks.
      - id: version
        env:
          MISE_AUTO_INSTALL: "false"
        run: |
          name=$(TESSARO_MACHINE=genericx86-64 mise run --quiet image:name | tail -n 1)
          version=${name#tessaro-os-genericx86-64-}
          version=${version%.wic.zst}
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: pick
        env:
          PICKED: ${{ toJSON(inputs) }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          machines=$(jq -c '[to_entries[]
            | select(.key == "genericx86-64" or .key == "genericarm64" or .key == "raspberrypi3-64" or .key == "raspberrypi4-64" or .key == "raspberrypi5")
            | select(.value == true) | .key]' <<<"$PICKED")
          [ "$machines" != "[]" ] || { echo "::error::pick at least one machine"; exit 1; }
          # A release only follows a passed e2e, so fail now rather than
          # after hours of builds that could never be released.
          if [ "$(jq -r .release <<<"$PICKED")" = true ]; then
            [ "$(jq -r .e2e <<<"$PICKED")" = true ] && jq -e 'index("genericx86-64")' <<<"$machines" >/dev/null \
              || { echo "::error::a release needs e2e ticked and genericx86-64 picked"; exit 1; }
            # Every release needs a new semver; the sha after it only says
            # which commit. Drafts and prereleases count too.
            semver=${VERSION%%-*}
            pattern="^v${semver//./\\.}(-.*)?$"
            if gh release list --limit 1000 --json tagName -q '.[].tagName' | grep -qE "$pattern"; then
              echo "::error::a release of $semver already exists; bump DISTRO_VERSION in meta-tessaro-distro/conf/distro/tessaro.conf"
              exit 1
            fi
          fi
          # Try Tessaro is built around this run's genericarm64 image, so
          # fail now rather than after hours of builds without it.
          if [ "$(jq -r .try <<<"$PICKED")" = true ]; then
            jq -e 'index("genericarm64")' <<<"$machines" >/dev/null \
              || { echo "::error::Try Tessaro needs genericarm64 picked; untick try otherwise"; exit 1; }
          fi
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  # The picked images and e2e on the genericx86-64 one, on the build host.
  image:
    needs: pick
    uses: ./.github/workflows/image.yml
    # One run at a time, e2e.yml's included: e2e boots the image the build
    # left in the runner's workspace, so no other run may build in between.
    # A run started while one is going waits for it.
    concurrency:
      group: beef-yocto
      cancel-in-progress: false
    with:
      machines: ${{ needs.pick.outputs.machines }}
      e2e: ${{ inputs.e2e }}
      e2e_args: ${{ inputs.e2e_args }}
      release: ${{ inputs.release }}

  # The desktop clients, on GitHub's runners: the build host is kept for the
  # image builds alone. No lint or test here, ci.yml ran them on the push.
  clients:
    needs: pick
    strategy:
      matrix:
        include:
          # 22.04, so the Linux binaries run on glibc 2.35 and newer.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so every step is the same script.
        shell: bash
    env:
      # The tasks' bodies are sh; on Windows mise would hand them to cmd.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -c
      # Only the Rust install_args installed, as in ci.yml.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      # The packages ci.yml installs for its agent and gui jobs.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libwayland-dev libxkbcommon-dev
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> ../build/cargo-target
            gui -> ../build/gui-target
      - run: mise run ctl:build
      # On macOS this also makes Tessaro.app, signed ad hoc.
      - run: mise run gui:build
      - name: Pack
        env:
          VERSION: ${{ needs.pick.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -e
          ctl=tessaro-ctl-$VERSION-$PLATFORM
          gui=tessaro-gui-$VERSION-$PLATFORM
          out=$PWD/build/artifacts
          mkdir -p "$out"
          rm -f "$out"/*
          cd build
          case "$RUNNER_OS" in
            Linux)
              tar -czf "$out/$ctl.tar.gz" -C cargo-target/release tessaro-ctl
              tar -czf "$out/$gui.tar.gz" -C gui-target/release tessaro-gui ;;
            macOS)
              tar -czf "$out/$ctl.tar.gz" -C cargo-target/release tessaro-ctl
              ditto -c -k --keepParent gui-target/release/Tessaro.app "$out/$gui.zip" ;;
            Windows)
              7z a -tzip "$out/$ctl.zip" ./cargo-target/release/tessaro-ctl.exe
              7z a -tzip "$out/$gui.zip" ./gui-target/release/tessaro-gui.exe ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: clients-${{ matrix.platform }}
          path: build/artifacts/
          compression-level: 0
          retention-days: 14

  # Try Tessaro, one leg per platform on GitHub's runners, around the image
  # this run built for it: only when try is ticked (pick makes sure the
  # machines are picked), and after image, whose images it takes from this
  # run's artifacts (a job cannot wait for one build leg, so it waits for
  # them all, e2e included). A failed e2e or another machine's failed leg
  # does not keep it from running; a missing genericarm64 image fails the
  # download. A platform is a row in the matrix and its packaging in
  # try:build; macOS is the only one. Signed ad hoc, not notarized. See
  # docs/try-tessaro.md.
  try:
    needs: [pick, image]
    if: >-
      always() && inputs.try && needs.pick.result == 'success'
      && needs.image.result != 'cancelled'
    name: try (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            machine: genericarm64
            package: dmg
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Only Rust installed (install_args), as in clients.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          workspaces: |
            agent -> ../build/cargo-target
            gui -> ../build/gui-target
      # The QEMU the app bundles, built with VirGL from pinned sources
      # (gui/try-tessaro/build-qemu-gpu.sh) on these Homebrew libraries, and
      # kept between runs: every pin is in that script, so its hash is the
      # key and a release rebuilds QEMU only when a pin moved.
      - if: runner.os == 'macOS'
        run: brew install glib pixman libslirp dtc pkgconf
      - if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: build/qemu-gpu
          key: qemu-gpu-${{ matrix.platform }}-${{ hashFiles('gui/try-tessaro/build-qemu-gpu.sh') }}
      - uses: actions/download-artifact@v8
        with:
          pattern: tessaro-os-${{ matrix.machine }}-*.wic.zst
          merge-multiple: true
          path: build/image
      # try:build makes build/Try-Tessaro-<platform>.<package>.
      - name: Build
        env:
          MACHINE: ${{ matrix.machine }}
        run: mise run try:build build/image/tessaro-os-"$MACHINE"-*.wic.zst
      # The bundled runtime's licenses, where its runtime.json exists
      # (docs/sbom.md).
      - run: ruby sbom/sbom.rb check --runtime build/gui-target/release/qemu-runtime/runtime.json
      - name: Pack
        id: pack
        env:
          VERSION: ${{ needs.pick.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -e
          mkdir -p build/artifacts
          name="try-tessaro-$VERSION-$PLATFORM.$PACKAGE"
          mv "build/Try-Tessaro-$PLATFORM.$PACKAGE" "build/artifacts/$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          # The bundled QEMU is GPL and patched: its source goes beside it
          # (gui/try-tessaro/qemu-source.sh).
          source="try-tessaro-$VERSION-$PLATFORM-qemu-source.tar"
          sh gui/try-tessaro/qemu-source.sh "build/artifacts/$source" build/qemu-gpu
          echo "source=$source" >>"$GITHUB_OUTPUT"
          ls -l build/artifacts
      # Unzipped, as image.yml uploads the images: the artifact is named after
      # the file and downloads as the .dmg itself. release attaches it.
      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.pack.outputs.name }}
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.pack.outputs.source }}
          archive: false
          retention-days: 14

  release:
    needs: [pick, image, clients, try]
    # always(), or the skipped try would skip it. image succeeds only with
    # every build leg and e2e passed, and pick refuses a release without e2e
    # ticked, so e2e cannot have been skipped. try is skipped when unticked.
    if: >-
      always() && inputs.release
      && needs.image.result == 'success' && needs.clients.result == 'success'
      && (needs.try.result == 'success' || needs.try.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tessaro-os-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: clients-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: try-tessaro-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pick.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Tessaro OS $VERSION" \
            --generate-notes
