# Build images by hand, run e2e on the qemu one, build tessaro-ctl and
# tessaro-gui for every platform, Try Tessaro around the genericarm64 image
# when try is ticked, and publish them all as a release when that is ticked. Only the image builds run on the
# self-hosted runner on the build host, which uses the shared download and
# sstate cache in place: it is far too big for a cache store. Everything else
# runs on GitHub's runners. Only workflow_dispatch triggers this, so only
# people with write access run code on that host - never add pull_request
# here. See docs/ci.md.

name: release

on:
  workflow_dispatch:
    inputs:
      qemux86-64:
        description: qemux86-64 (development, QEMU)
        type: boolean
        default: true
      genericx86-64:
        description: genericx86-64 (x86_64 PCs)
        type: boolean
        default: false
      genericarm64:
        description: genericarm64 (Arm64 UEFI, a VM on an Apple silicon Mac)
        type: boolean
        default: false
      try:
        description: Try Tessaro for macOS, around the genericarm64 image (needs genericarm64)
        type: boolean
        default: false
      raspberrypi3-64:
        description: raspberrypi3-64 (Pi 3B / 3B+)
        type: boolean
        default: false
      raspberrypi4-64:
        description: raspberrypi4-64 (Pi 4B / 400 / CM4)
        type: boolean
        default: false
      raspberrypi5:
        description: raspberrypi5 (Pi 5)
        type: boolean
        default: false
      e2e:
        description: Run the e2e suite on the qemux86-64 image
        type: boolean
        default: true
      e2e_args:
        description: "Arguments for e2e:run, e.g. -o '--tag ~reboot'"
        type: string
        default: ""
      release:
        description: Publish the images and clients as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: e2e boots the image the build left in the runner's
# workspace, so no other run may build in between. A run started while one
# is going waits for it.
concurrency:
  group: beef-yocto
  cancel-in-progress: false

env:
  # mise refuses an untrusted mise.toml; the checkout is this repo's own.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.pick.outputs.machines }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # image:name needs only git and sed, so no toolchain gets installed.
      - uses: jdx/mise-action@v5
        with:
          install: false
      # The version every image and client of this run is named with. A fresh
      # checkout is never -dirty; the build host's can be, and build checks.
      - id: version
        env:
          MISE_AUTO_INSTALL: "false"
        run: |
          name=$(TESSARO_MACHINE=qemux86-64 mise run --quiet image:name | tail -n 1)
          version=${name#tessaro-os-qemux86-64-}
          version=${version%.wic.zst}
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: pick
        env:
          PICKED: ${{ toJSON(inputs) }}
        run: |
          machines=$(jq -c '[to_entries[]
            | select(.key == "qemux86-64" or .key == "genericx86-64" or .key == "genericarm64" or .key == "raspberrypi3-64" or .key == "raspberrypi4-64" or .key == "raspberrypi5")
            | select(.value == true) | .key]' <<<"$PICKED")
          [ "$machines" != "[]" ] || { echo "::error::pick at least one machine"; exit 1; }
          # A release only follows a passed e2e, so fail now rather than
          # after hours of builds that could never be released.
          if [ "$(jq -r .release <<<"$PICKED")" = true ]; then
            [ "$(jq -r .e2e <<<"$PICKED")" = true ] && jq -e 'index("qemux86-64")' <<<"$machines" >/dev/null \
              || { echo "::error::a release needs e2e ticked and qemux86-64 picked"; exit 1; }
          fi
          # Try Tessaro is built around this run's genericarm64 image, so
          # fail now rather than after hours of builds without it.
          if [ "$(jq -r .try <<<"$PICKED")" = true ]; then
            jq -e 'index("genericarm64")' <<<"$machines" >/dev/null \
              || { echo "::error::Try Tessaro needs genericarm64 picked; untick try otherwise"; exit 1; }
          fi
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: [self-hosted, yocto]
    timeout-minutes: 1440
    strategy:
      matrix:
        machine: ${{ fromJSON(needs.matrix.outputs.machines) }}
      # One build at a time: the legs share the cache and the host.
      max-parallel: 1
      fail-fast: false
    env:
      TESSARO_MACHINE: ${{ matrix.machine }}
    steps:
      # clean: false, or checkout's git clean -ffdx wipes the kas layer
      # checkouts and build/, and every build starts from nothing.
      - uses: actions/checkout@v5
        with:
          clean: false

      # The same link a worktree gets (CLAUDE.md). /cache is gitignored, so
      # it does not make the image -dirty.
      - name: Link the shared cache
        env:
          TESSARO_CACHE_DIR: ${{ vars.TESSARO_CACHE_DIR }}
        run: |
          [ -n "$TESSARO_CACHE_DIR" ] || { echo "::error::set the TESSARO_CACHE_DIR repository variable"; exit 1; }
          [ -d "$TESSARO_CACHE_DIR" ] || { echo "::error::$TESSARO_CACHE_DIR is not a directory"; exit 1; }
          ln -sfn "$TESSARO_CACHE_DIR" cache
          mkdir -p build

      - name: Name the image
        id: name
        env:
          RELEASE: ${{ inputs.release }}
          EXPECTED: ${{ needs.matrix.outputs.version }}
        run: |
          name=$(mise run --quiet image:name | tail -n 1)
          version=${name#"tessaro-os-$TESSARO_MACHINE-"}
          version=${version%.wic.zst}
          echo "image: $name"
          case "$version" in
            *-dirty)
              [ "$RELEASE" != true ] || { echo "::error::the tree is dirty, a release must come from a clean checkout"; exit 1; }
              echo "::warning::the tree is dirty, the image is named $name" ;;
          esac
          [ "${version%-dirty}" = "$EXPECTED" ] || { echo "::error::the image is $version but the run is $EXPECTED"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "base=${name%.wic.zst}" >> "$GITHUB_OUTPUT"

      # One build at a time across every checkout on the host (CLAUDE.md),
      # a workstation build or e2e run included.
      - name: Wait for the host to be free
        timeout-minutes: 360
        run: |
          while busy=$(pgrep -af 'kas-container|bitbake'); do
            echo "waiting for:"
            echo "$busy"
            sleep 60
          done

      - name: Build
        run: mise run image:build

      - name: Collect the image
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          deploy="build/$TESSARO_MACHINE/tmp/deploy/images/$TESSARO_MACHINE"
          mkdir -p build/artifacts
          rm -f build/artifacts/*
          cp "$deploy/$NAME" "$deploy/${NAME%.wic.zst}.wic.bmap" build/artifacts/
          ls -l build/artifacts

      # The image's SBOM bundle and license list (docs/sbom.md), named after
      # the image. Fails on a license sbom/licenses.yml does not allow.
      - name: SBOM
        env:
          BASE: ${{ steps.name.outputs.base }}
        run: |
          rm -rf "build/sbom/$TESSARO_MACHINE"
          mise run sbom:build
          cp "build/sbom/$TESSARO_MACHINE/$BASE.sbom.tar.zst" "build/sbom/$TESSARO_MACHINE/$BASE.licenses.csv" build/artifacts/
          ls -l build/artifacts

      # archive: false uploads each file as it is, not zipped, so the image,
      # its bmap and its SBOM files download one by one. Each artifact is
      # named after its file.
      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.name.outputs.name }}
          archive: false
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.name.outputs.base }}.wic.bmap
          archive: false
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.name.outputs.base }}.sbom.tar.zst
          archive: false
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.name.outputs.base }}.licenses.csv
          archive: false
          retention-days: 14

  # e2e boots the image out of the kas build tree that built it (native qemu,
  # OVMF, qemuboot.conf), not out of the .wic alone, so it runs on the build
  # host in the same workspace, which build left in place. A job of its own,
  # so it can be re-run without the build. It waits for every build leg.
  e2e:
    needs: [matrix, build]
    # A failed Pi leg does not keep the qemu image from its test; the check
    # below fails if the qemu build is not the one in the tree.
    if: >-
      always() && inputs.e2e && needs.matrix.result == 'success'
      && needs.build.result != 'cancelled'
      && contains(fromJSON(needs.matrix.outputs.machines), 'qemux86-64')
    runs-on: [self-hosted, yocto]
    # The wait for the host below, plus the suite's 30.
    timeout-minutes: 400
    env:
      TESSARO_MACHINE: qemux86-64
    steps:
      # clean: false, so the build tree build left stays.
      - uses: actions/checkout@v5
        with:
          clean: false

      # The tree's latest image must be this commit's, or the suite would
      # test something else than what build uploaded.
      - name: Check the image is this run's
        env:
          EXPECTED: ${{ needs.matrix.outputs.version }}
        run: |
          name=$(mise run --quiet image:name | tail -n 1)
          version=${name#tessaro-os-qemux86-64-}
          version=${version%.wic.zst}
          [ "${version%-dirty}" = "$EXPECTED" ] || { echo "::error::the checkout is $version but the run is $EXPECTED"; exit 1; }
          latest=$(readlink build/qemux86-64/tmp/deploy/images/qemux86-64/tessaro-os-qemux86-64.rootfs.wic.zst || true)
          [ "$latest" = "$name" ] || { echo "::error::the tree's latest image is ${latest:-missing}, not $name"; exit 1; }
          echo "testing $name"

      # One build or e2e run at a time across every checkout on the host
      # (CLAUDE.md).
      - name: Wait for the host to be free
        timeout-minutes: 360
        run: |
          while busy=$(pgrep -af 'kas-container|bitbake'); do
            echo "waiting for:"
            echo "$busy"
            sleep 60
          done

      - name: e2e
        timeout-minutes: 30
        env:
          E2E_ARGS: ${{ inputs.e2e_args }}
          # Ports away from the workstation's own VMs and dev:tunnel forwards.
          E2E_WORKER_OFFSET: "10"
          # Inside build/, so the gems never make the image -dirty.
          BUNDLE_PATH: ${{ github.workspace }}/build/e2e-bundle
        run: |
          mise run e2e:setup
          eval "set -- $E2E_ARGS"
          mise run e2e:run -- "$@"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs
          path: build/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # The desktop clients, on GitHub's runners: the build host is kept for the
  # image builds alone. No lint or test here, ci.yml ran them on the push.
  clients:
    needs: matrix
    strategy:
      matrix:
        include:
          # 22.04, so the Linux binaries run on glibc 2.35 and newer.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so every step is the same script.
        shell: bash
    env:
      # The tasks' bodies are sh; on Windows mise would hand them to cmd.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -c
      # Only the Rust install_args installed, as in ci.yml.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      # The packages ci.yml installs for its agent and gui jobs.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libwayland-dev libxkbcommon-dev
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> ../build/cargo-target
            gui -> ../build/gui-target
      - run: mise run ctl:build
      # On macOS this also makes Tessaro.app, signed ad hoc.
      - run: mise run gui:build
      - name: Pack
        env:
          VERSION: ${{ needs.matrix.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -e
          ctl=tessaro-ctl-$VERSION-$PLATFORM
          gui=tessaro-gui-$VERSION-$PLATFORM
          out=$PWD/build/artifacts
          mkdir -p "$out"
          rm -f "$out"/*
          cd build
          case "$RUNNER_OS" in
            Linux)
              tar -czf "$out/$ctl.tar.gz" -C cargo-target/release tessaro-ctl
              tar -czf "$out/$gui.tar.gz" -C gui-target/release tessaro-gui ;;
            macOS)
              tar -czf "$out/$ctl.tar.gz" -C cargo-target/release tessaro-ctl
              ditto -c -k --keepParent gui-target/release/Tessaro.app "$out/$gui.zip" ;;
            Windows)
              7z a -tzip "$out/$ctl.zip" ./cargo-target/release/tessaro-ctl.exe
              7z a -tzip "$out/$gui.zip" ./gui-target/release/tessaro-gui.exe ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: clients-${{ matrix.platform }}
          path: build/artifacts/
          compression-level: 0
          retention-days: 14

  # Try Tessaro, one leg per platform on GitHub's runners, around the image
  # this run built for it: only when try is ticked (matrix makes sure the
  # machines are picked), and after build, whose images it takes from this
  # run's artifacts (a job cannot wait for one matrix leg, so it waits for
  # them all). A platform is a row in the matrix and its packaging in
  # try:build; macOS is the only one. Signed ad hoc, not notarized. See
  # docs/try-tessaro.md.
  try:
    needs: [matrix, build]
    if: inputs.try
    name: try (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            machine: genericarm64
            package: dmg
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Only Rust installed (install_args), as in clients.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          workspaces: |
            agent -> ../build/cargo-target
            gui -> ../build/gui-target
      # The QEMU the app bundles, relinked (gui/try-tessaro/bundle-qemu-macos.sh).
      - if: runner.os == 'macOS'
        run: brew install qemu
      - uses: actions/download-artifact@v8
        with:
          pattern: tessaro-os-${{ matrix.machine }}-*.wic.zst
          merge-multiple: true
          path: build/image
      # try:build makes build/Try-Tessaro-<platform>.<package>.
      - name: Build
        env:
          MACHINE: ${{ matrix.machine }}
        run: mise run try:build build/image/tessaro-os-"$MACHINE"-*.wic.zst
      # The bundled runtime's licenses, where its runtime.json exists
      # (docs/sbom.md).
      - run: ruby sbom/sbom.rb check --runtime build/gui-target/release/qemu-runtime/runtime.json
      - name: Pack
        id: pack
        env:
          VERSION: ${{ needs.matrix.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -e
          mkdir -p build/artifacts
          name="try-tessaro-$VERSION-$PLATFORM.$PACKAGE"
          mv "build/Try-Tessaro-$PLATFORM.$PACKAGE" "build/artifacts/$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          ls -l build/artifacts
      # Unzipped, as build uploads the images: the artifact is named after
      # the file and downloads as the .dmg itself. release attaches it.
      - uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ steps.pack.outputs.name }}
          archive: false
          retention-days: 14

  release:
    needs: [matrix, build, e2e, clients, try]
    # always(), since e2e's own if uses it; a release needs e2e to have
    # passed, never skipped (matrix refuses a release without e2e). try is
    # skipped when unticked.
    if: >-
      always() && inputs.release
      && needs.build.result == 'success' && needs.clients.result == 'success'
      && needs.e2e.result == 'success'
      && (needs.try.result == 'success' || needs.try.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tessaro-os-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: clients-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: try-tessaro-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.matrix.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Tessaro OS $VERSION" \
            --generate-notes
