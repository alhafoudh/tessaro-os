# Build images by hand, run e2e on the qemu one, and publish a release if asked.
# The builds run on the self-hosted runner on the build host, which uses the
# shared download and sstate cache in place: it is far too big for a cache
# store. Only workflow_dispatch triggers this, so only people with write access
# run code on that host - never add pull_request here. See docs/ci.md.

name: image

on:
  workflow_dispatch:
    inputs:
      qemux86-64:
        description: qemux86-64 (development, QEMU)
        type: boolean
        default: true
      genericx86-64:
        description: genericx86-64 (x86_64 PCs)
        type: boolean
        default: false
      raspberrypi3-64:
        description: raspberrypi3-64 (Pi 3B / 3B+)
        type: boolean
        default: false
      raspberrypi5:
        description: raspberrypi5 (Pi 5)
        type: boolean
        default: false
      e2e:
        description: Run the e2e suite on the qemux86-64 image
        type: boolean
        default: true
      e2e_args:
        description: "Arguments for e2e:run, e.g. -o '--tag ~reboot'"
        type: string
        default: ""
      release:
        description: Publish the images as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.pick.outputs.machines }}
    steps:
      - id: pick
        env:
          PICKED: ${{ toJSON(inputs) }}
        run: |
          machines=$(jq -c '[to_entries[]
            | select(.key == "qemux86-64" or .key == "genericx86-64" or .key == "raspberrypi3-64" or .key == "raspberrypi5")
            | select(.value == true) | .key]' <<<"$PICKED")
          [ "$machines" != "[]" ] || { echo "::error::pick at least one machine"; exit 1; }
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: [self-hosted, yocto]
    timeout-minutes: 1440
    strategy:
      matrix:
        machine: ${{ fromJSON(needs.matrix.outputs.machines) }}
      # One build at a time: the legs share the cache and the host.
      max-parallel: 1
      fail-fast: false
    outputs:
      version: ${{ steps.name.outputs.version }}
    env:
      TESSARO_MACHINE: ${{ matrix.machine }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # clean: false, or checkout's git clean -ffdx wipes the kas layer
      # checkouts and build/, and every build starts from nothing.
      - uses: actions/checkout@v5
        with:
          clean: false

      # The same link a worktree gets (CLAUDE.md). /cache is gitignored, so
      # it does not make the image -dirty.
      - name: Link the shared cache
        env:
          TESSARO_CACHE_DIR: ${{ vars.TESSARO_CACHE_DIR }}
        run: |
          [ -n "$TESSARO_CACHE_DIR" ] || { echo "::error::set the TESSARO_CACHE_DIR repository variable"; exit 1; }
          [ -d "$TESSARO_CACHE_DIR" ] || { echo "::error::$TESSARO_CACHE_DIR is not a directory"; exit 1; }
          ln -sfn "$TESSARO_CACHE_DIR" cache
          mkdir -p build

      - name: Name the image
        id: name
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          name=$(mise run --quiet image:name | tail -n 1)
          version=${name#"tessaro-os-$TESSARO_MACHINE-"}
          version=${version%.wic.zst}
          echo "image: $name"
          case "$version" in
            *-dirty)
              [ "$RELEASE" != true ] || { echo "::error::the tree is dirty, a release must come from a clean checkout"; exit 1; }
              echo "::warning::the tree is dirty, the image is named $name" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # One build at a time across every checkout on the host (CLAUDE.md),
      # a workstation build or e2e run included.
      - name: Wait for the host to be free
        timeout-minutes: 360
        run: |
          while busy=$(pgrep -af 'kas-container|bitbake'); do
            echo "waiting for:"
            echo "$busy"
            sleep 60
          done

      - name: Build
        run: mise run image:build

      - name: Collect the image
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          deploy="build/$TESSARO_MACHINE/tmp/deploy/images/$TESSARO_MACHINE"
          mkdir -p build/artifacts
          rm -f build/artifacts/*
          cp "$deploy/$NAME" "$deploy/${NAME%.wic.zst}.wic.bmap" build/artifacts/
          ls -l build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.machine }}
          path: build/artifacts/
          compression-level: 0
          retention-days: 14

      # e2e boots the image out of the kas build tree that built it, not out
      # of the .wic alone, so it runs here, in the same workspace.
      - name: e2e
        if: matrix.machine == 'qemux86-64' && inputs.e2e
        env:
          E2E_ARGS: ${{ inputs.e2e_args }}
          # Ports away from the workstation's own VMs and dev:tunnel forwards.
          E2E_WORKER_OFFSET: "10"
          # Inside build/, so the gems never make the image -dirty.
          BUNDLE_PATH: ${{ github.workspace }}/build/e2e-bundle
        run: |
          mise run e2e:setup
          eval "set -- $E2E_ARGS"
          mise run e2e:run -- "$@"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.machine == 'qemux86-64' && inputs.e2e
        with:
          name: e2e-logs
          path: build/e2e/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Tessaro OS $VERSION" \
            --generate-notes
